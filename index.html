<!DOCTYPE html>
<html>
<head>
    <title>تطبيق فيديوهاتي</title>
    <style>
        body { font-family: Arial; text-align: center; background: black; color: white; }
        video { width: 100%; max-width: 400px; border-radius: 20px; margin-top: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>🎬 تطبيق فيديوهات قصيرة</h1>
    <video id="myVideo" controls autoplay></video>
    <br>
    <button onclick="nextVideo()">▶️ فيديو التالي</button>
    <button onclick="shareVideo()">📤 مشاركة</button>

    <script>
        let videos = [
            "https://www.w3schools.com/html/mov_bbb.mp4",
            "https://www.w3schools.com/html/movie.mp4"
        ];
        let index = 0;
        let videoElement = document.getElementById("myVideo");

        function loadVideo() {
            videoElement.src = videos[index];
        }

        function nextVideo() {
            index = (index + 1) % videos.length;
            loadVideo();
        }

        function shareVideo() {
            alert("تمت المشاركة (يمكنك ربطها بـ API حقيقي لاحقًا)");
        }

        loadVideo();
    </script>
</body>
</html>
