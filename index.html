:'Total Balance',team:'Team',done:'Tasks',daily:'Daily',refT:'Golden Referral',ref2:"5% of each friend's income for life",copy:'Copy',share:'Share',pf:'Portfolio',co:'Company & Security',det:'Details',earned:'Total Earned',refE:'Referral Earnings',tod:"Today's Profit",mon:'Monthly',taskT:'Daily Tasks',rew:'Reward',start:'Start',doneL:'Done',failL:'Cancelled',wait:'Wait',sec:'sec',cancel:'Cancel',plans:'Investment Plans',avail:'Your Balance',free:'FREE',active:'Active',upBtn:'Upgrade',dy:'Daily',days:'Days',tot:'Total',mo:'Monthly',myAcc:'My Account',refCode:'Referral Link',secT:'Security & Contract',aboutT:'About BlackRock',refsT:'Referrals',wheel:'Lucky Wheel',setT:'Settings',out:'Sign Out',compT:'Referral Contest',compS:'10 friends = Free upgrade!',prog:'Progress',goal:'Goal: 10 M1 friends',spin:'SPIN NOW',noSpin:'No spins',prize:'PRIZE',signIn:'Sign In',signUp:'Create Account',user:'Username',pass:'Password',conf:'Confirm Password',noAcc:"Don't have account? Sign up",hasAcc:'Have account? Sign in',show:'Show',hide:'Hide',notifs:'Notifications',noNotifs:'No notifications',cnfT:'Cancel Task?',keepT:'Keep',cnfB:'Cancel',wLock:'Withdrawal Locked',wReq:'Requires M1 + 10,000 د.ج',sup:'Support',copied:'Copied!',lang:'عربي',aiP:'Ask me...',avT:'Choose Avatar',clear:'Clear Data',totRef:'Total Referrals',refDzd:'د.ج from Referrals',wd:'Withdraw',qwd:'Quick Withdraw',chg:'Changes daily by level',ef:'Each friend = 🎡 spin for you + spin for them!',lo:'⚡ Link opens app',sub:'Investment Platform',contract:'BlackRock, Inc signed an official contract with Algeria in January 2025, valid for 3 years until December 2027.',coDesc:'Founded in 1988 in New York, BlackRock is the world\'s largest asset manager with over $10.2 trillion in AUM.',coSec:'We use military-grade AES-256 encryption with SSL/TLS 3.0 to protect all user data and transactions.',coAlg:'Official contract with Algeria starting January 2025 until December 2027, spanning 3 full years.'}};

// Utilities
function fmt(n){if(isNaN(n))return'0,00';if(n>=1e6)return(n/1e6).toFixed(2).replace('.',',')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace('.',',')+'K';return n.toLocaleString('fr-DZ',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fDZD(n){return fmt(n)+' د.ج'}
function today(){return new Date().toDateString()}
function lvN(id){return LVS.find(l=>l.id===id)?.n||'Starter'}
function lvD(id){return LVS.find(l=>l.id===id)||LVS[0]}
function normalizePhone(value){const digits=String(value||'').replace(/\D/g,'');if(/^0[567]\d{7,8}$/.test(digits))return'+213'+digits.slice(1);if(/^213[567]\d{7,8}$/.test(digits))return'+'+digits;if(/^[567]\d{7,8}$/.test(digits))return'+213'+digits;return'';}
function isValidWilaya(value){return WILAYAS.includes(value)}
function cleanPhoneInput(value){let digits=String(value||'').replace(/\D/g,'');if(digits.startsWith('213'))digits=digits.slice(3);if(digits.startsWith('0'))digits=digits.slice(1);return digits.slice(0,9)}
function inviteLink(code){try{const basePath=location.pathname.replace(/\/?index\.html$/i,'').replace(/\/$/,'');return`${location.origin}${basePath||''}?code=${code}`}catch{return'blackrock.app?code='+code}}
function normalizeUser(u){const out={id:Date.now(),un:'',pw:'',code:'',ref:'',phone:'',wilaya:'',balance:0,taskBal:0,refEarn:0,teamCount:0,wheelSpins:0,m1Refs:0,level:null,totalEarned:0,avatar:null,joined:new Date().toISOString(),joinedVia:null,notifs:[],investments:[],investEarned:0,withdrawals:[],upgradeRequests:[],team:[],loginStreak:0,badges:[],activityLog:[],showLiveActivity:true,profileCompleted:false,...u};out.investments=out.investments||[];out.withdrawals=out.withdrawals||[];out.upgradeRequests=out.upgradeRequests||[];out.team=out.team||[];out.notifs=out.notifs||[];out.activityLog=out.activityLog||[];out.badges=out.badges||[];if(!out.ref||String(out.ref).includes('?ref=')||String(out.ref).includes('/ref/')||String(out.ref).includes('/invite')||!String(out.ref).includes('?code=')){out.ref=inviteLink(out.code)}return out}

// LocalStorage
const LOCAL_KEY='br10-users';
function getUsers(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')}catch{return[]}}
function saveUsers(users){localStorage.setItem(LOCAL_KEY,JSON.stringify(users))}
function getUserByCode(code){return getUsers().find(u=>String(u.code).toUpperCase()===code.toUpperCase())||null}
function getUserByUsername(username){return getUsers().find(u=>u.un===username)||null}
function createUserLocal(user){const users=getUsers();users.push(user);saveUsers(users);return user}
function updateUserLocal(user){const users=getUsers();const i=users.findIndex(u=>u.id===user.id);if(i>=0){users[i]=user;saveUsers(users)}return user}

// Toast
function toast2(msg,type='info'){S.toast={msg,type,id:Date.now()};render();setTimeout(()=>{S.toast=null;render()},2800)}

// Save User
function saveUser(user){S.savePulse++;const normalized=normalizeUser(user);updateUserLocal(normalized);S.user=normalized}

// Create User
function createUser(user,password){const normalized=normalizeUser({...user,pw:'',passwordHash:password});return createUserLocal(normalized)}

// Find User
function findUserByCode(code){return getUserByCode(code.toUpperCase())}

// Login
function loginUser(username,password){const user=getUserByUsername(username);if(!user)return null;if(user.passwordHash===password||user.pw===password)return normalizeUser(user);return null}

// Username Exists
function usernameExists(username){return Boolean(getUserByUsername(username))}

// Render
function render(){document.getElementById('app').innerHTML=appHTML()}

function appHTML(){
  if(!S.user)return authHTML();
  return `
    <div class="h-full flex flex-col">
      <div class="flex-1 overflow-auto pb-[70px]">${S.tab==='home'?homeHTML():S.tab==='tasks'?tasksHTML():S.tab==='up'?upgradeHTML():profileHTML()}</div>
      ${navHTML()}
      ${(S.tab==='home'||S.tab==='tasks')?aiButtonHTML():''}
      ${S.showWheel?wheelOverlayHTML():''}
      ${S.showSheet?sheetHTML():''}
      ${S.toast?toastHTML():''}
    </div>
  `
}

function authHTML(){
  const joinCode=(()=>{try{const params=new URLSearchParams(window.location.search);const queryRef=params.get('code')||params.get('ref');if(queryRef)return queryRef.trim().toUpperCase();const hash=window.location.hash||'';const match=hash.match(/(?:code|ref)=([^&]+)/i);return match?decodeURIComponent(match[1]).trim().toUpperCase():''}catch{return''}})();

  return `
    <div class="h-full flex flex-col items-center justify-center p-6 overflow-auto">
      <div class="w-full max-w-[370px] animate-fadeIn">

        <div class="text-center mb-8">
          <h1 class="logo text-3xl mb-2">BLACKROCK</h1>
          <p class="text-white/40 text-xs font-bold tracking-widest">${t.sub.toUpperCase()}</p>
          <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
            <span class="badge-pill badge-green flex items-center gap-1"><div class="w-2.5 h-2.5 bg-green-500 rounded-full"></div>SSL V3</span>
            <span class="badge-pill badge-gold">NYSE:BLK</span>
            <button onclick="toggleLang()" class="badge-pill bg-white/5 border-white/10 text-white/60 cursor-pointer">${t.lang}</button>
          </div>
        </div>
