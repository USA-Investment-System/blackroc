        /* Animations */

        @keyframes sh { 0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)} }
        @keyframes gr { from{width:0}to{width:100%} }

            border: none;
            cursor: pointer;

        .btn-ghost {

            font-weight: 700;
            cursor: pointer;

const fmtDZD = (n) => {
    if (isNaN(n) || n === null || n === undefined) return '0.00';
    const abs = Math.abs(n);
    if (abs >= 1e12) return (n/1e12).toFixed(2) + 'T';
    if (abs >= 1e9) return (n/1e9).toFixed(2) + 'B';
    if (abs >= 1e6) return (n/1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return parseFloat(n).toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
};

const Wheel = ({ open, onClose, user, onUpdate, toast }) => {

    const [rot, setRot] = useState(0);
    const [result, setResult] = useState(null);

    ];

    const spin = () => {
        if(spinning) return;
        setSpinning(true); setShown(false);
        const add = 1800 + Math.random()*1800;
        const nr = rot + add;

            const seg = 360/prizes.length;

                onUpdate({balance:(user.balance||0)+p.val,totalEarned:(user.totalEarned||0)+p.val});

    if(!open) return null;

const Tasks = ({ user, upd, toast }) => {
    const initTasks = () => {
        try { const s=localStorage.getItem(`br_tk_${user.id}`); if(s) return JSON.parse(s); } catch(e){}
        return [1,2,3,4,5].map((id,i)=>({id,name:`مهمة يومية ${id}`,reward:43,status:i===0?'available':'locked',done:null,failed:null}));
    };
    const [tasks, setTasks] = useState(initTasks);
    const [active, setActive] = useState(null);
    const [cd, setCd] = useState(40);
    const [confirmCancel, setConfirmCancel] = useState(false);
    const cdRef = useRef(null);

    useEffect(()=>{try{localStorage.setItem(`br_tk_${user.id}`,JSON.stringify(tasks));}catch(e){}},[tasks,user.id]);

    useEffect(()=>{
        const today = new Date().toDateString();
        if(user.lastReset!==today){
            setTasks([1,2,3,4,5].map((id,i)=>({id,name:`مهمة يومية ${id}`,reward:43,status:i===0?'available':'locked',done:null,failed:null})));
            upd({lastReset:today});
            toast('🌅 تم تجديد المهام اليومية!','success');
        }
    },[]);

    useEffect(()=>{
        if(active&&cd>0){
            cdRef.current = setTimeout(()=>setCd(c=>c-1),1000);
        } else if(active&&cd===0){
            completeTask();
        }
        return()=>clearTimeout(cdRef.current);
    },[active,cd]);

    const startTask = (id) => {
        const idx = tasks.findIndex(t=>t.id===id);
        if(idx>0&&tasks[idx-1].status!=='completed'){toast('أكمل المهمة السابقة أولاً!','warning');return;}
        setActive(id); setCd(40);
        setTasks(ts=>ts.map(t=>t.id===id?{...t,status:'active'}:t));
        toast('⏱️ المهمة بدأت! انتظر 40 ثانية...','info');
    };

    const completeTask = () => {
        const task = tasks.find(t=>t.id===active);
        if(!task) return;
        setTasks(ts=>ts.map(t=>{
            if(t.id===active) return {...t,status:'completed',done:new Date().toISOString()};
            if(t.id===active+1) return {...t,status:'available'};
            return t;
        }));
        upd({balance:(user.balance||0)+task.reward,taskBal:(user.taskBal||0)+task.reward,tasksDone:(user.tasksDone||0)+1,totalEarned:(user.totalEarned||0)+task.reward});
        toast(`🎉 تم إكمال المهمة! ربحت ${task.reward} DZD`,'success');
        setActive(null);
    };

    const doCancel = () => {
        setTasks(ts=>ts.map(t=>t.id===active?{...t,status:'failed',failed:new Date().toISOString()}:t));
        clearTimeout(cdRef.current);
        setActive(null); setConfirmCancel(false);
        toast('❌ تم إلغاء المهمة! تُعاد غداً','error');
    };

    const done = tasks.filter(t=>t.status==='completed').length;
    const pct = (user.taskBal||0)/215*100;

    return (
        <div className="hs" style={{height:'100%',overflowY:'auto',paddingBottom:90}}>
            <div style={{position:'sticky',top:0,zIndex:40,background:'rgba(6,9,18,.96)',backdropFilter:'blur(20px)',padding:'12px 16px',borderBottom:'1px solid rgba(255,255,255,.05)',textAlign:'center'}}>
                <div style={{color:'white',fontWeight:900,fontSize:18}}>⚡ المهام اليومية</div>
            </div>

            <div style={{padding:'14px 14px 0'}}>
                {/* Stats Row */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
                    {[
                        {label:'المكتملة',val:`${done}/5`,icon:'check',c:'#00E676'},
                        {label:'الفريق',val:user.teamCount||0,icon:'users',c:'#2979FF'},
                        {label:'المكسب اليوم',val:`${done*43} DZD`,icon:'profit',c:'#F5C518'},
                    ].map((s,i)=>(
                        <div key={i} className="gc" style={{borderRadius:14,padding:'12px 8px',textAlign:'center'}}>
                            <Ic n={s.icon} s={20} c="text-white/50"/>
                            <div style={{color:s.c,fontWeight:900,fontSize:14,marginTop:4}}>{s.val}</div>
                            <div style={{color:'rgba(255,255,255,.35)',fontSize:10,marginTop:2}}>{s.label}</div>
                        </div>
                    ))}
                </div>

                {/* Withdraw Progress */}
                <div className="gc gc-red" style={{borderRadius:14,padding:'12px',marginBottom:14}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
                        <Ic n="lock" s={14} c="text-red-400"/>
                        <span style={{color:'rgba(255,80,100,.9)',fontSize:12,fontWeight:800}}>السحب مقفل — يتطلب الترقية إلى M1</span>
                    </div>
                    <div style={{background:'rgba(255,255,255,.08)',borderRadius:10,height:8,overflow:'hidden',marginBottom:5}}>
                        <div className="pg-red" style={{width:`${Math.min(pct,100)}%`,height:'100%',borderRadius:10,transition:'width .5s'}}/>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',color:'rgba(255,255,255,.35)',fontSize:11}}>
                        <span>{fmtDZD(user.taskBal||0)} DZD</span>
                        <span>215 DZD (الحد الأدنى)</span>
                    </div>
                </div>

                {/* Task Cards */}
                {tasks.map((task,i)=>{
                    const isLocked = task.status==='locked';
                    const isActive = task.status==='active'&&active===task.id;
                    const isDone = task.status==='completed';
                    const isFailed = task.status==='failed';
                    const isAvail = task.status==='available';
                    const prog = isDone?100:isActive?((40-cd)/40*100):0;

                    return (
                        <div key={task.id} className={`gc ${isDone?'task-done':isFailed?'task-fail':isActive?'task-active':''}`} style={{borderRadius:16,padding:'14px',marginBottom:10,border:'1px solid rgba(255,255,255,.06)',transition:'all .3s'}}>
                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                                <div style={{display:'flex',alignItems:'center',gap:10}}>
                                    <div style={{width:46,height:46,borderRadius:12,background:isLocked||isFailed?'rgba(255,23,68,.12)':isDone?'rgba(0,230,118,.15)':isActive?'linear-gradient(135deg,#F5C518,#FF6D00)':'linear-gradient(135deg,#F5C518,#FF6D00)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                                        {isLocked&&<Ic n="lock" s={22} c="text-red-400"/>}
                                        {isFailed&&<Ic n="x" s={22} c="text-red-400"/>}
                                        {isDone&&<Ic n="check" s={22} c="text-green-400"/>}
                                        {(isActive||isAvail)&&<Ic n="rocket" s={22} c="text-white"/>}
                                    </div>
                                    <div>
                                        <div style={{color:isLocked||isFailed?'rgba(255,255,255,.4)':'white',fontWeight:800,fontSize:14}}>{task.name}</div>
                                        <div style={{color:'rgba(255,255,255,.4)',fontSize:12}}>+DZD {task.reward}</div>
                                    </div>
                                </div>
                                <div style={{fontFamily:'Montserrat,sans-serif',fontSize:20,fontWeight:900,color:isDone?'#00E676':isFailed?'#FF1744':'#F5C518'}}>+{task.reward}</div>
                            </div>

                            {/* Progress */}
                            <div style={{background:'rgba(255,255,255,.07)',borderRadius:6,height:6,marginBottom:10,overflow:'hidden'}}>
                                <div style={{width:`${prog}%`,height:'100%',borderRadius:6,transition:isActive?'width 1s linear':'none',background:isDone?'linear-gradient(90deg,#00E676,#00C853)':isFailed?'linear-gradient(90deg,#FF1744,#D50000)':'linear-gradient(90deg,#F5C518,#FF6D00)'}}/>
                            </div>

                            {/* Active countdown */}
                            {isActive&&(
                                <div style={{marginBottom:10}}>
                                    <div className="gc gc-gold" style={{borderRadius:12,padding:'12px',textAlign:'center',marginBottom:8}}>
                                        <div style={{color:'rgba(255,255,255,.5)',fontSize:11,marginBottom:4}}>انتظر...</div>
                                        <div style={{fontFamily:'Montserrat,sans-serif',fontSize:44,fontWeight:900,lineHeight:1}} className="gt">{cd}</div>
                                        <div style={{color:'rgba(255,255,255,.35)',fontSize:11}}>ثانية</div>
                                        {/* Progress ring hint */}
                                        <div style={{marginTop:6,height:4,background:'rgba(255,255,255,.07)',borderRadius:3,overflow:'hidden'}}>
                                            <div className="pg-gold" style={{height:'100%',borderRadius:3,width:`${(40-cd)/40*100}%`,transition:'width 1s linear'}}/>
                                        </div>
                                    </div>
                                    <button onClick={()=>setConfirmCancel(true)} style={{width:'100%',padding:'11px',borderRadius:12,background:'rgba(255,23,68,.1)',border:'1px solid rgba(255,23,68,.25)',color:'#FF1744',fontWeight:800,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                                        <Ic n="x" s={16}/>إلغاء المهمة (تخسرها)
                                    </button>
                                </div>
                            )}

                            {isAvail&&<button onClick={()=>startTask(task.id)} className="btn-gold" style={{width:'100%',padding:'12px',borderRadius:12,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                                <Ic n="play" s={18} c="text-white"/>ابدأ المهمة (40 ثانية)
                            </button>}
                            {isDone&&<div style={{width:'100%',padding:'11px',borderRadius:12,background:'rgba(0,230,118,.1)',border:'1px solid rgba(0,230,118,.25)',color:'#00E676',fontWeight:800,fontSize:13,textAlign:'center'}}>✅ تم الإكمال — +{task.reward} DZD</div>}
                            {isFailed&&<div style={{width:'100%',padding:'11px',borderRadius:12,background:'rgba(255,23,68,.08)',border:'1px solid rgba(255,23,68,.2)',color:'rgba(255,80,100,.7)',fontWeight:800,fontSize:13,textAlign:'center'}}>❌ أُلغيت — تُعاد غداً</div>}
                            {isLocked&&<div style={{width:'100%',padding:'11px',borderRadius:12,background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.06)',color:'rgba(255,255,255,.3)',fontWeight:700,fontSize:13,textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}><Ic n="lock" s={14}/>أكمل المهمة السابقة أولاً</div>}
                        </div>
                    );
                })}
            </div>

            {/* Cancel confirm dialog */}
            {confirmCancel&&<div className="overlay-bg fi" style={{position:'fixed',inset:0,zIndex:99,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
                <div className="gc gc-red" style={{borderRadius:20,padding:24,width:'100%',maxWidth:320}}>
                    <div style={{textAlign:'center',marginBottom:16}}>
                        <div style={{width:56,height:56,background:'rgba(255,23,68,.15)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><Ic n="x" s={28} c="text-red-400"/></div>
                        <div style={{color:'white',fontWeight:900,fontSize:17,marginBottom:8}}>تأكيد الإلغاء</div>
                        <div style={{color:'rgba(255,255,255,.55)',fontSize:13,lineHeight:1.6}}>إذا ألغيت الآن ستخسر <span style={{color:'#FF1744',fontWeight:900}}>43 DZD</span> ولا يمكنك إعادتها إلا غداً!</div>
                    </div>
                    <div style={{display:'flex',gap:10}}>
                        <button onClick={()=>setConfirmCancel(false)} className="btn-ghost" style={{flex:1,padding:'12px',borderRadius:12,fontSize:13}}>إكمال المهمة</button>
                        <button onClick={doCancel} style={{flex:1,padding:'12px',borderRadius:12,background:'#D50000',color:'white',fontWeight:900,fontSize:13,border:'none',cursor:'pointer'}}>إلغاء نهائي</button>
                    </div>
                </div>
            </div>}
        </div>
    );
};

                                    {user.un.charAt(0).toUpperCase()}

                    </button>
                    <div style={{color:'white',fontWeight:900,fontSize:18,marginBottom:4}}>{user.un}</div>
                    <div style={{color:'rgba(255,255,255,.4)',fontSize:12,marginBottom:10}}>ID: #{String(user.id).slice(-5)}</div>
                    <span style={{padding:'5px 14px',background:'linear-gradient(135deg,rgba(245,197,24,.15),rgba(255,152,0,.1))',border:'1px solid rgba(245,197,24,.3)',borderRadius:100,color:'#F5C518',fontSize:12,fontWeight:800,display:'inline-flex',alignItems:'center',gap:5}}>
                        <Ic n="star" s={12}/>
                        {levelName}
                    </span>
                    <div style={{marginTop:10,color:'rgba(255,255,255,.3)',fontSize:11}}>انضم: {new Date(user.joined||Date.now()).toLocaleDateString('ar-DZ')}</div>
                </div>

                {/* Stats */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
                    {[
                        {l:'الرصيد',v:`${fmtDZD(user.balance||0)} DZD`,c:'#F5C518'},
                        {l:'الفريق',v:user.teamCount||0,c:'#2979FF'},
                        {l:'إجمالي الربح',v:`${fmtDZD(user.totalEarned||0)} DZD`,c:'#00E676'},
                        {l:'دورات العجلة',v:user.spins||0,c:'#FF9800'},
                    ].map((s,i)=>(
                        <div key={i} className="gc" style={{borderRadius:14,padding:'12px',textAlign:'center'}}>
                            <div style={{color:s.c,fontWeight:900,fontSize:15,fontFamily:'Montserrat,sans-serif'}}>{s.v}</div>
                            <div style={{color:'rgba(255,255,255,.4)',fontSize:11,marginTop:3}}>{s.l}</div>
                        </div>
                    ))}
                </div>

                {/* Referral Card */}
                <div className="gc gc-gold" style={{borderRadius:16,padding:'14px',marginBottom:14}}>
                    <div style={{color:'white',fontWeight:900,fontSize:14,marginBottom:12,textAlign:'center'}}>كود الدعوة الخاص بك</div>
                    <div style={{background:'rgba(255,255,255,.04)',borderRadius:12,padding:'12px',textAlign:'center',border:'1px solid rgba(245,197,24,.15)',marginBottom:10}}>
                        <div style={{fontFamily:'Montserrat,sans-serif',fontSize:28,fontWeight:900,letterSpacing:5}} className="gt">{user.code}</div>
                    </div>
                    <div style={{background:'rgba(255,255,255,.04)',borderRadius:10,padding:'8px 10px',display:'flex',alignItems:'center',gap:8,marginBottom:10,border:'1px solid rgba(255,255,255,.06)'}}>
                        <span style={{flex:1,color:'rgba(255,255,255,.5)',fontSize:11,textAlign:'center',direction:'ltr',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.ref}</span>
                        <button onClick={copyRef} style={{padding:'5px 10px',background:'rgba(245,197,24,.12)',border:'1px solid rgba(245,197,24,.25)',borderRadius:8,color:'#F5C518',fontSize:11,fontWeight:800,cursor:'pointer',flexShrink:0}}>{copied?'✓ تم':'نسخ'}</button>
                    </div>
                    <button onClick={shareRef} className="btn-gold" style={{width:'100%',padding:'12px',borderRadius:12,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                        <Ic n="share" s={16} c="text-white"/>مشاركة الرابط
                    </button>
                </div>

                {/* Menu */}
                <div className="gc" style={{borderRadius:16,padding:'8px',marginBottom:14}}>
                    {[
                        {icon:'shield',title:'وثيقة الأمان',desc:'SECURE V3 — BlackRock, Inc',c:'text-green-400',action:()=>setSecOpen(true)},
                        {icon:'bldg',title:'عن الشركة',desc:'BlackRock, Inc — نيويورك 1988',c:'text-blue-400',action:()=>setCompOpen(true)},
                        {icon:'users',title:'الإحالات',desc:`${user.teamCount||0} مدعو`,c:'text-yellow-400',action:()=>setRefOpen(true)},
                        {icon:'gift',title:'عجلة الحظ',desc:'ادعُ صديقاً وادور!',c:'text-purple-400',action:()=>setWheelOpen(true)},
                        {icon:'settings',title:'الإعدادات',desc:'إعدادات الحساب',c:'text-white/60',action:()=>setSetOpen(true)},
                    ].map((item,i)=>(
                        <button key={i} onClick={item.action} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 10px',background:'none',border:'none',cursor:'pointer',borderBottom:i<4?'1px solid rgba(255,255,255,.04)':'none',textAlign:'right'}}>
                            <div style={{display:'flex',alignItems:'center',gap:10}}>
                                <Ic n={item.icon} s={20} c={item.c}/>
                                <div>
                                    <div style={{color:'white',fontWeight:800,fontSize:13}}>{item.title}</div>
                                    <div style={{color:'rgba(255,255,255,.35)',fontSize:11}}>{item.desc}</div>
                                </div>
                            </div>
                            <Ic n="left" s={16} c="text-white/20"/>
                        </button>
                    ))}
                </div>

                <button onClick={logout} style={{width:'100%',padding:'13px',borderRadius:14,background:'rgba(255,23,68,.08)',border:'1px solid rgba(255,23,68,.2)',color:'#FF1744',fontWeight:900,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                    <Ic n="logout" s={18}/>تسجيل الخروج
                </button>
            </div>

            {/* Security Sheet */}
            <Sheet open={secOpen} onClose={()=>setSecOpen(false)} title="🛡️ وثيقة الأمان">
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {[
                        {l:'دولة التسجيل',v:'🇺🇸 New York, USA'},
                        {l:'رقم التسجيل',v:'NYSE: BLK — EIN: 32-0174431'},
                        {l:'التشفير',v:'SSL/TLS 3.0 — AES-256'},
                        {l:'عقد الجزائر',v:'يناير 2025 — ديسمبر 2028 ✅'},
                        {l:'حماية الأموال',v:'مضمونة 100% ✅'},
                    ].map((r,i)=>(
                        <div key={i} className="gc" style={{borderRadius:12,padding:'12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <span style={{color:'rgba(255,255,255,.5)',fontSize:12}}>{r.l}</span>
                            <span style={{color:'white',fontWeight:800,fontSize:12,textAlign:'left',direction:'ltr'}}>{r.v}</span>
                        </div>
                    ))}
                    <div className="proof-c" style={{borderRadius:14,padding:'14px'}}>
                        <div style={{color:'rgba(255,255,255,.6)',fontSize:12,lineHeight:1.8,textAlign:'center'}}>
                            تقر شركة <span style={{color:'#00E676',fontWeight:900}}>BlackRock, Inc</span> بأنها أبرمت عقداً رسمياً مع الجانب الجزائري في <span style={{color:'#F5C518',fontWeight:900}}>يناير 2025</span> لمدة 3 سنوات.
                        </div>
                    </div>
                </div>
            </Sheet>

            {/* Company Sheet */}
            <Sheet open={compOpen} onClose={()=>setCompOpen(false)} title="🏢 معلومات الشركة">
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {[
                        {l:'الاسم القانوني',v:'BlackRock, Inc'},
                        {l:'المقر الرئيسي',v:'🇺🇸 New York, USA'},
                        {l:'سنة التأسيس',v:'1988'},
                        {l:'المجال',v:'إدارة الأصول والاستثمار'},
                        {l:'عقد الجزائر',v:'يناير 2025 ✅'},
                        {l:'انتهاء العقد',v:'ديسمبر 2028'},
                        {l:'إجمالي الأصول',v:'10.2 تريليون دولار'},
                        {l:'عدد الموظفين',v:'+19,000 موظف'},
                    ].map((r,i)=>(
                        <div key={i} className="gc" style={{borderRadius:12,padding:'12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <span style={{color:'rgba(255,255,255,.5)',fontSize:12}}>{r.l}</span>
                            <span style={{color:'white',fontWeight:800,fontSize:12}}>{r.v}</span>
                        </div>
                    ))}
                    <button onClick={()=>window.open('https://www.blackrock.com','_blank')} className="btn-gold" style={{borderRadius:14,padding:'13px',fontSize:14}}>🌐 blackrock.com</button>
                </div>
            </Sheet>

            {/* Referrals Sheet */}
            <Sheet open={refOpen} onClose={()=>setRefOpen(false)} title="👥 إحالاتي">
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                        <div className="gc gc-gold" style={{borderRadius:14,padding:'14px',textAlign:'center'}}>
                            <div style={{color:'#F5C518',fontWeight:900,fontSize:28,fontFamily:'Montserrat'}}>{user.teamCount||0}</div>
                            <div style={{color:'rgba(255,255,255,.4)',fontSize:11,marginTop:4}}>إجمالي الإحالات</div>
                        </div>
                        <div className="gc gc-green" style={{borderRadius:14,padding:'14px',textAlign:'center'}}>
                            <div style={{color:'#00E676',fontWeight:900,fontSize:18,fontFamily:'Montserrat'}}>{fmtDZD(user.refEarn||0)}</div>
                            <div style={{color:'rgba(255,255,255,.4)',fontSize:11,marginTop:4}}>DZD من الإحالات</div>
                        </div>
                    </div>
                    <div className="gc" style={{borderRadius:14,padding:'14px',textAlign:'center',border:'1px solid rgba(255,255,255,.05)'}}>
                        <div style={{color:'rgba(255,255,255,.4)',fontSize:12,marginBottom:8}}>رابطك الخاص</div>
                        <div style={{background:'rgba(255,255,255,.04)',borderRadius:10,padding:'10px',marginBottom:10,border:'1px solid rgba(255,255,255,.06)'}}>
                            <span style={{color:'rgba(255,255,255,.6)',fontSize:12,direction:'ltr'}}>{user.ref}</span>
                        </div>
                        <div style={{color:'rgba(255,255,255,.4)',fontSize:12,lineHeight:1.7}}>
                            كل صديق يدخل برابطك يعطيك <span style={{color:'#F5C518',fontWeight:900}}>5%</span> من دخله اليومي مدى الحياة!<br/>
                            + دورة عجلة حظ مجانية 🎡
                        </div>
                    </div>
                    {(user.teamCount||0)===0&&<div style={{textAlign:'center',padding:'20px 0',color:'rgba(255,255,255,.3)',fontSize:13}}>لم تدعُ أي صديق بعد<br/>ابدأ المشاركة الآن!</div>}
                </div>
            </Sheet>

            {/* Settings Sheet */}
            <Sheet open={setOpen} onClose={()=>setSetOpen(false)} title="⚙️ الإعدادات">
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    <div className="gc" style={{borderRadius:14,padding:'14px'}}>
                        <div style={{color:'white',fontWeight:900,fontSize:14,marginBottom:10}}>معلومات الحساب</div>
                        {[
                            {l:'اسم المستخدم',v:user.un},
                            {l:'الرصيد',v:`${fmtDZD(user.balance||0)} DZD`},
                            {l:'الإحالات',v:user.teamCount||0},
                            {l:'تاريخ الانضمام',v:new Date(user.joined||Date.now()).toLocaleDateString('ar-DZ')},
                        ].map((r,i)=>(
                            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:i<3?'1px solid rgba(255,255,255,.04)':'none'}}>
                                <span style={{color:'rgba(255,255,255,.4)',fontSize:12}}>{r.l}</span>
                                <span style={{color:'white',fontSize:12,fontWeight:700}}>{r.v}</span>
                            </div>
                        ))}
                    </div>
                    <button onClick={()=>{localStorage.clear();toast('تم مسح البيانات','success');window.location.reload();}} style={{width:'100%',padding:'12px',borderRadius:12,background:'rgba(255,23,68,.08)',border:'1px solid rgba(255,23,68,.2)',color:'#FF1744',fontWeight:800,fontSize:13,cursor:'pointer'}}>
                        🗑️ مسح جميع البيانات
                    </button>
                </div>
            </Sheet>

            {/* Wheel & Avatar */}
            <Wheel open={wheelOpen} onClose={()=>setWheelOpen(false)} user={user} onUpdate={upd} toast={toast}/>
            {avatarOpen&&<AvatarPicker current={user.avatar} onPick={id=>upd({avatar:id})} onClose={()=>setAvatarOpen(false)}/>}
        </div>
    );
};

/* ─── MAIN APP ─── */
const App = () => {
    const [user, setUser] = useState(null);
    const [tab, setTab] = useState('home');
    const [toast, setToastState] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(()=>{
        try {
            const saved = localStorage.getItem('br_cu');
            if(saved) setUser(JSON.parse(saved));
        } catch(e){}
        setTimeout(()=>setLoading(false),1200);
    },[]);

    useEffect(()=>{
        if(!user) return;
        try {
            localStorage.setItem('br_cu',JSON.stringify(user));
            const users = JSON.parse(localStorage.getItem('br_u')||'[]');
            const updated = users.map(u=>u.id===user.id?user:u);
            localStorage.setItem('br_u',JSON.stringify(updated));
        } catch(e){}
    },[user]);

    const showToast = useCallback((msg,type='info')=>{
        setToastState({msg,type,id:Date.now()});
    },[]);

    const upd = useCallback((changes)=>{
        setUser(prev=>({...prev,...changes}));
    },[]);

    const login = (u) => { setUser(u); setTab('home'); };
    const logout = () => { localStorage.removeItem('br_cu'); setUser(null); setTab('home'); showToast('تم تسجيل الخروج','success'); };

    if(loading){
        return (
            <div style={{height:'100%',background:'var(--bg)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
                <div className="pp" style={{width:88,height:88,background:'linear-gradient(135deg,#F5C518,#FF9800,#FF6D00)',borderRadius:24,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 12px 40px rgba(245,197,24,.25)'}}>
                    <Ic n="diamond" s={46} c="text-white"/>
                </div>
                <div style={{fontFamily:'Montserrat,sans-serif',fontSize:28,fontWeight:900,letterSpacing:2}} className="gt">BLACKROCK</div>
                <div style={{color:'rgba(255,255,255,.3)',fontSize:12}}>جاري التحميل...</div>
                <div style={{width:140,height:4,background:'rgba(255,255,255,.06)',borderRadius:2,overflow:'hidden',marginTop:4}}>
                    <div className="pg-gold" style={{height:'100%',borderRadius:2,animation:'gr 1.2s ease-out forwards'}}/>
                </div>
            </div>
        );
    }

    if(!user) return (
        <div style={{height:'100%'}}>
            <Auth onLogin={login} toast={showToast}/>
            {toast&&<Toast key={toast.id} message={toast.msg} type={toast.type} onClose={()=>setToastState(null)}/>}
        </div>
    );

    const nav = [
        {id:'home',icon:'home',label:'الرئيسية'},
        {id:'tasks',icon:'tasks',label:'المهام',badge:5},
        {id:'up',icon:'diamond',label:'الترقية'},
        {id:'profile',icon:'user',label:'حسابي'},
    ];

    return (
        <div style={{height:'100%',maxWidth:430,margin:'0 auto',position:'relative',background:'var(--bg)',overflow:'hidden',boxShadow:'0 0 80px rgba(0,0,0,.8)'}}>
            {/* Content */}
            <div style={{height:'100%'}}>
                {tab==='home'&&<Home user={user} upd={upd} toast={showToast} nav={setTab}/>}
                {tab==='tasks'&&<Tasks user={user} upd={upd} toast={showToast}/>}
                {tab==='up'&&<Upgrade user={user} upd={upd} toast={showToast}/>}
                {tab==='profile'&&<Profile user={user} upd={upd} toast={showToast} logout={logout}/>}
            </div>

            {/* Bottom Nav */}
            <div style={{position:'absolute',bottom:0,left:0,right:0,background:'rgba(6,9,18,.97)',backdropFilter:'blur(20px)',borderTop:'1px solid rgba(255,255,255,.06)',zIndex:50,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
                <div style={{display:'flex',justifyContent:'space-around',alignItems:'center',paddingTop:6,paddingBottom:8}}>
                    {nav.map(n=>{
                        const active = tab===n.id;
                        return (
                            <button key={n.id} onClick={()=>setTab(n.id)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'4px 12px',background:'none',border:'none',cursor:'pointer',color:active?'#F5C518':'rgba(255,255,255,.35)',position:'relative',transition:'color .2s'}}>
                                {active&&<div style={{position:'absolute',bottom:-8,left:'50%',transform:'translateX(-50%)',width:20,height:2.5,background:'linear-gradient(90deg,#F5C518,#FF9800)',borderRadius:2}}/>}
                                <div style={{position:'relative'}}>
                                    <Ic n={n.icon} s={23}/>
                                    {n.badge&&<span className="n-dot" style={{position:'absolute',top:-5,right:-6,width:16,height:16,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:900,color:'white',border:'1.5px solid var(--bg)',animation:'nb 2s infinite'}}>{n.badge}</span>}
                                </div>
                                <span style={{fontSize:10,fontWeight:active?900:600}}>{n.label}</span>
                            </button>
                        );
                    })}
                </div>
            </div>

            {toast&&<Toast key={toast.id} message={toast.msg} type={toast.type} onClose={()=>setToastState(null)}/>}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
