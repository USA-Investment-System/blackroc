<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACKROCK GLOBAL</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #FFB800;
  --bg: #0A0A0F;
  --card: #12121E;
  --text: #F0F0FF;
  --text2: #9090B0;
  --green: #00E676;
  --red: #FF1744;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);}
.page{padding:16px;}
.task-card{background:var(--card);padding:14px;border-radius:14px;margin-bottom:10px;}
.task-btn{padding:10px;border-radius:10px;border:none;background:var(--gold);font-weight:700;cursor:pointer;width:100%;}
.task-btn.cancel{background:var(--red);color:#fff;margin-top:8px;}
.timer{font-size:22px;font-weight:900;color:var(--gold);text-align:center;margin:10px 0;}
</style>
</head>
<body><div class="page">
  <h2>المهام اليومية</h2>
  <div id="task-box"></div>
</div><script>
let TASK_REWARD = 43;
let currentTask = 1;
let balance = 0;
let activeTimer = null;
let remaining = 30;

// reset daily
const today = new Date().toDateString();
if(localStorage.getItem('lastDay') !== today){
  localStorage.setItem('lastDay', today);
  currentTask = 1;
}

function renderTask(){
  const box = document.getElementById('task-box');
  box.innerHTML = `
    <div class='task-card'>
      <div>مهمة رقم ${currentTask}</div>
      <div class='timer' id='timer'>30</div>
      <button class='task-btn' onclick='startTask()'>ابدأ المهمة</button>
      <button class='task-btn cancel' onclick='cancelTask()'>إلغاء (خسارة)</button>
    </div>
  `;
}

function startTask(){
  remaining = 30;
  document.getElementById('timer').textContent = remaining;

  activeTimer = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = remaining;

    if(remaining <= 0){
      clearInterval(activeTimer);
      balance += TASK_REWARD;
      currentTask++;
      if(currentTask > 5) currentTask = 1;
      renderTask();
    }
  },1000);
}

function cancelTask(){
  if(activeTimer){
    clearInterval(activeTimer);
    balance -= TASK_REWARD;
    currentTask = 2; // penalty rule
    renderTask();
  }
}

renderTask();
</script></body>
</html>
