<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackRock Algeria | نظام الاستثمار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { background-color: #080808; color: #f3f3f3; font-family: 'Tajawal', sans-serif; margin: 0; padding-bottom: 80px; }
        .page { display: none; min-height: 100vh; padding: 20px; animation: slideIn 0.3s ease-out; }
        .active-page { display: block; }
        .gold-text { color: #f7bf28; }
        .bg-gold { background: linear-gradient(90deg, #f7bf28 0%, #b38728 100%); color: #000; font-weight: 700; }
        .card { background: #121212; border: 1px solid #222; border-radius: 16px; }
        .input-box { background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 12px; padding: 16px; width: 100%; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: #f7bf28; box-shadow: 0 0 10px rgba(247, 191, 40, 0.2); }
        .tab-nav { background: #121212; border-top: 1px solid #222; position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 12px; z-index: 1000; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="login" class="page active-page">
        <div class="text-center my-12">
            <h1 class="text-5xl font-black gold-text tracking-tighter">BLACKROCK</h1>
            <p class="text-gray-500 text-sm mt-2">المنصة الأولى للاستثمار في الجزائر</p>
        </div>
        <div class="space-y-4 px-2">
            <input type="text" id="log-user" placeholder="اسم المستخدم أو رقم الهاتف" class="input-box">
            <input type="password" id="log-pass" placeholder="كلمة المرور" class="input-box">
            <button onclick="handleLogin()" class="w-full bg-gold py-4 rounded-xl text-lg shadow-xl active:scale-95 transition-all">دخول الحساب</button>
            <p class="text-center text-gray-400 mt-6">عضو جديد؟ <span class="gold-text font-bold cursor-pointer" onclick="showPage('register')">إنشاء حساب</span></p>
        </div>
    </div>

    <div id="register" class="page">
        <div class="mb-8" onclick="showPage('login')"> <span class="gold-text text-2xl">←</span> العودة </div>
        <h2 class="text-2xl font-bold mb-6">فتح حساب مستثمر جديد</h2>
        <div class="space-y-4">
            <input type="text" placeholder="الاسم الكامل" class="input-box">
            <div class="flex gap-2">
                <input type="text" value="+213" class="input-box w-24 text-center text-gray-500" disabled>
                <input type="number" id="phone" placeholder="رقم الهاتف (05/06/07)" class="input-box">
            </div>
            <select id="wilaya" class="input-box">
                <option disabled selected>-- اختر ولايتك (58 ولاية) --</option>
                <script>
                    const wilayas = ["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة","تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة","سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر","ورقلة","وهران","البيض","إليزي","برج بوعريريج","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت","غرداية","غليزان","تيميمون","برج باجي مختار","أولاد جلال","بني عباس","إن صالح","إن قزام","تقرت","جانت","المغير","المنيعة"];
                    wilayas.forEach((w, i) => {
                        document.write(`<option value="${i+1}">${i+1} - ${w}</option>`);
                    });
                </script>
            </select>
            <input type="password" id="reg-pass" placeholder="تعيين كلمة مرور قوية" class="input-box">
            <button onclick="handleRegister()" class="w-full bg-gold py-4 rounded-xl text-lg font-bold">تأكيد التسجيل</button>
        </div>
    </div>

    <div id="main" class="page">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-gold flex items-center justify-center font-bold">R</div>
                <div><p class="text-xs text-gray-500">مرحباً بك،</p><p class="text-sm font-bold">مستثمر محترف</p></div>
            </div>
            <div class="bg-green-900/20 text-green-500 text-[10px] px-3 py-1 rounded-full border border-green-500/20 pulse">آمن ومتصل</div>
        </div>

        <div class="card p-6 mb-6 bg-gradient-to-br from-[#1a1a1a] to-[#080808]">
            <p class="text-gray-400 text-xs">الرصيد الكلي (د.ج)</p>
            <h2 class="text-4xl font-black mt-2">0.00 <span class="text-sm gold-text">DZD</span></h2>
            <div class="flex gap-4 mt-6">
                <button class="flex-1 bg-white/5 py-3 rounded-lg border border-white/10 text-xs font-bold">سحب الأرباح</button>
                <button class="flex-1 bg-gold py-3 rounded-lg text-xs font-bold">إيداع جديد</button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="card p-4">
                <p class="text-gray-500 text-[10px]">أرباح اليوم</p>
                <p class="text-green-500 font-bold">+150.00</p>
            </div>
            <div class="card p-4">
                <p class="text-gray-500 text-[10px]">رصيد المهام</p>
                <p class="gold-text font-bold">500.00</p>
            </div>
        </div>

        <div class="card p-4 flex items-center justify-between border-l-4 border-l-yellow-500">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🔥</span>
                <div><p class="text-sm font-bold">باقة STARTER</p><p class="text-[10px] text-gray-500">عائد يومي 5%</p></div>
            </div>
            <button class="text-xs gold-text font-bold">تفعيل الآن</button>
        </div>

        <div class="tab-nav">
            <div class="flex flex-col items-center gold-text"><span>🏠</span><span class="text-[10px]">الرئيسية</span></div>
            <div class="flex flex-col items-center text-gray-600"><span>💰</span><span class="text-[10px]">الاستثمار</span></div>
            <div class="flex flex-col items-center text-gray-600"><span>👥</span><span class="text-[10px]">الفريق</span></div>
            <div class="flex flex-col items-center text-gray-600"><span>👤</span><span class="text-[10px]">حسابي</span></div>
        </div>
    </div>

    <script>
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
            window.scrollTo(0,0);
        }

        function handleLogin() {
            const user = document.getElementById('log-user').value;
            const pass = document.getElementById('log-pass').value;
            if(user && pass) {
                showPage('main');
            } else {
                alert("يرجى إدخال البيانات كاملة");
            }
        }

        function handleRegister() {
            const phone = document.getElementById('phone').value;
            if(phone.length < 10) {
                alert("رقم الهاتف غير صحيح!");
            } else {
                alert("تم إنشاء الحساب بنجاح!");
                showPage('main');
            }
        }
    </script>
</body>
</html>
