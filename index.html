<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKROCK - منصة الاستثمار</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;background:#020509;color:#fff;font-family:'Tajawal',sans-serif}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.p-3{padding:12px}.p-4{padding:16px}.p-6{padding:24px}
.rounded-lg{border-radius:12px}.rounded-xl{border-radius:16px}.rounded-2xl{border-radius:20px}.rounded-full{border-radius:999px}
.font-bold{font-weight:700}.font-extrabold{font-weight:900}
.text-sm{font-size:12px}.text-base{font-size:14px}.text-lg{font-size:16px}.text-xl{font-size:18px}.text-2xl{font-size:24px}
.text-gold{color:#D4AF37}.text-green{color:#22C55E}.text-white{color:#fff}.text-muted{color:rgba(255,255,255,.5)}
.bg-gold{background:#D4AF37}.bg-gold-gradient{background:linear-gradient(135deg,#D4AF37,#C9992C)}
.bg-card{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99))}
.border-gold{border:1px solid rgba(212,175,55,.2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 0;border:none;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer;font-family:'Tajawal',sans-serif;transition:opacity .2s}
.btn:active{opacity:.8}
.btn-gold{background:linear-gradient(135deg,#D4AF37,#C9992C);color:#020509}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;color:#fff;padding:16px;font-size:15px;font-weight:700;outline:none;font-family:'Tajawal',sans-serif}
.inp:focus{border-color:rgba(212,175,55,.5)}
.card{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px}
.header{padding:16px;border-bottom:1px solid rgba(212,175,55,.1)}
.logo{font-family:'Montserrat',sans-serif;font-size:32px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#D4AF37,#C9992C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge-pill{display:inline-block;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:800}
.badge-green{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#22C55E}
.badge-gold{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.2);color:#D4AF37}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(2,5,9,.98);border-top:1px solid rgba(212,175,55,.15);display:flex;z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:11px;font-weight:700}
.nav-btn.active{color:#D4AF37}
.nav-icon{font-size:22px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;border-radius:99px;font-size:14px;font-weight:800;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast-success{background:#16A34A}.toast-error{background:#DC2626}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end}
.sheet-content{background:linear-gradient(180deg,#0b1122,#050912);border-radius:22px 22px 0 0;width:100%;max-height:85vh;overflow-y:auto}
.sheet-handle{width:40px;height:4px;background:rgba(212,175,55,.2);border-radius:2px;margin:12px auto}
.relative{position:relative}.absolute{position:absolute}.fixed{position:fixed}
.w-full{width:100%}.h-full{height:100%}
.overflow-auto{overflow:auto}
.text-center{text-align:center}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.block{display:block}
.w-14{width:56px}.h-14{height:56px}
.mx-auto{margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
// State
const S={lang:'ar',user:null,tab:'home',tasks:null,activeTask:null,cdVal:40,wheelRot:0,showWheel:false,showSheet:false,sheetContent:'',sheetTitle:'',toast:null};
let isLogin=false;

// Constants
const WILAYAS=['01 - أدرار','02 - الشلف','03 - الأغواط','04 - أم البواقي','05 - باتنة','06 - بجاية','07 - بسكرة','08 - بشار','09 - البليدة','10 - البويرة','11 - تمنراست','12 - تبسة','13 - تلمسان','14 - تيارت','15 - تيزي وزو','16 - الجزائر','17 - الجلفة','18 - جيجل','19 - سطيف','20 - سعيدة','21 - سكيكدة','22 - سيدي بلعباس','23 - عنابة','24 - قالمة','25 - قسنطينة','26 - المدية','27 - مستغانم','28 - المسيلة','29 - معسكر','30 - ورقلة','31 - وهران','32 - البيض','33 - إليزي','34 - برج بوعريريج','35 - بومرداس','36 - الطارف','37 - تندوف','38 - تيسمسيلت','39 - الوادي','40 - خنشلة','41 - سوق أهراس','42 - تيبازة','43 - ميلة','44 - عين الدفلى','45 - النعامة','46 - عين تموشنت','47 - غرداية','48 - غليزان','49 - تيميمون','50 - برج باجي مختار','51 - أولاد جلال','52 - بني عباس','53 - عين صالح','54 - عين قزام','55 - توقرت','56 - جانت','57 - المغير','58 - المنيعة'];
const LVS=[{id:'trial',n:'Starter',p:0,d:3,dy:43,tot:215,mo:0},{id:'m1',n:'M1',p:7000,d:5,dy:43,tot:215,mo:6450},{id:'m2',n:'M2',p:26600,d:10,dy:86,tot:860,mo:25800}];
const WP=[{l:'43 د.ج',v:43,cl:'#D4AF37'},{l:'86 د.ج',v:86,cl:'#6B4C0A'},{l:'215 د.ج',v:215,cl:'#C9992C'},{l:'Spin+',v:0,cl:'#7C3AED'},{l:'430 د.ج',v:430,cl:'#B8860B'}];
const T={ar:{home:'الرئيسية',tasks:'المهام',up:'الترقية',acc:'حسابي',bal:'الرصيد',team:'الفريق',done:'المهام',daily:'اليومي',copy:'نسخ',share:'مشاركة',wd:'سحب',signUp:'إنشاء حساب',signIn:'تسجيل الدخول',user:'اسم المستخدم',pass:'كلمة المرور',conf:'تأكيد كلمة المرور',phone:'رقم الهاتف',wilaya:'الولاية',noAcc:'ليس لديك حساب؟ سجل مجاناً',hasAcc:'لديك حساب؟ سجل الدخول',security:'Platform Security',contract:'عقد رسمي: يناير 2025 → ديسمبر 2027',aes:'AES-256 + SSL/TLS 3.0',ein:'NYSE: BLK — EIN: 32-0174431'},en:{home:'Home',tasks:'Tasks',up:'Plans',acc:'Account',bal:'Balance',team:'Team',done:'Tasks',daily:'Daily',copy:'Copy',share:'Share',wd:'Withdraw',signUp:'Create Account',signIn:'Sign In',user:'Username',pass:'Password',conf:'Confirm Password',phone:'Phone Number',wilaya:'Wilaya',noAcc:"Don't have account? Sign up",hasAcc:'Have account? Sign in',security:'Platform Security',contract:'Contract: Jan 2025 → Dec 2027',aes:'AES-256 + SSL/TLS 3.0',ein:'NYSE: BLK — EIN: 32-0174431'}};

// Utilities
function fmt(n){if(isNaN(n))return'0,00';return n.toLocaleString('fr-DZ',{minimumFractionDigits:2})}
function normalizePhone(value){const digits=String(value||'').replace(/\D/g,'');if(/^0[567]\d{7,8}$/.test(digits))return'+213'+digits.slice(1);if(/^213[567]\d{7,8}$/.test(digits))return'+'+digits;if(/^[567]\d{7,8}$/.test(digits))return'+213'+digits;return'';}
function cleanPhoneInput(value){let digits=String(value||'').replace(/\D/g,'');if(digits.startsWith('213'))digits=digits.slice(3);if(digits.startsWith('0'))digits=digits.slice(1);return digits.slice(0,9)}
function inviteLink(code){try{const basePath=location.pathname.replace(/\/?index\.html$/i,'').replace(/\/$/,'');return`${location.origin}${basePath||''}?code=${code}`}catch{return'blackrock.app?code='+code}}

// LocalStorage
const LOCAL_KEY='br10-users';
function getUsers(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]')}catch{return[]}}
function saveUsers(users){localStorage.setItem(LOCAL_KEY,JSON.stringify(users))}
function getUserByUsername(username){return getUsers().find(u=>u.un===username)||null}
function createUserLocal(user){const users=getUsers();users.push(user);saveUsers(users);return user}

// Toast
function toast2(msg,type='success'){S.toast={msg,type};render();setTimeout(()=>{S.toast=null;render()},2800)}

// Render
function render(){document.getElementById('app').innerHTML=appHTML()}

function appHTML(){
  if(!S.user)return authHTML();
  return `<div class="h-full flex flex-col"><div class="flex-1 overflow-auto pb-[70px]">${S.tab==='home'?homeHTML():S.tab==='tasks'?tasksHTML():profileHTML()}</div>${navHTML()}${S.showSheet?sheetHTML():''}${S.toast?`<div class="toast toast-${S.toast.type}">${S.toast.msg}</div>`:''}</div>`
}

function authHTML(){
  const joinCode=(()=>{try{const params=new URLSearchParams(window.location.search);const queryRef=params.get('code')||params.get('ref');if(queryRef)return queryRef.trim().toUpperCase();return''}catch{return''}})();
  const t=T[S.lang];
  
  return `
    <div class="app">
      <div class="p-6 flex flex-col items-center">
        ${joinCode?`<div class="bg-gradient-to-r from-[rgba(212,175,55,.12)] to-[rgba(34,197,94,.06)] border border-[rgba(212,175,55,.28)] rounded-2xl p-4 text-center mb-6 w-full"><p class="text-gold text-sm font-extrabold mb-1">🎁 ${S.lang==='ar'?'دعوة صديق مفعلة':'Referral Active'}</p></div>`:''}
        
        <div class="text-center mb-6">
          <h1 class="logo mb-2">BLACKROCK</h1>
          <p class="text-white/40 text-xs font-bold">${t.sub||'منصة الاستثمار'}</p>
          <div class="flex items-center justify-center gap-2 mt-4">
            <button onclick="toggleLang()" class="badge-pill">${t.lang||'English'}</button>
            <span class="badge-pill badge-gold">NYSE:BLK</span>
            <span class="badge-pill badge-green">SSL V3 🛡️</span>
          </div>
        </div>

        <form onsubmit="handleAuth(event)" class="w-full flex flex-col gap-4">
          <div class="text-left"><label class="block text-white/50 text-sm font-bold mb-2">${t.user}</label><input type="text" id="auth-un" class="inp" placeholder="${t.user}" required /></div>
          <div class="text-left"><label class="block text-white/50 text-sm font-bold mb-2">${t.pass}</label><div class="relative"><input type="password" id="auth-pw" class="inp" placeholder="${t.pass}" style="padding-left:50px" required /><button type="button" onclick="togglePw()" class="absolute left-4 top-1/2 -translate-y-1/2 text-white/40 text-xl">👁</button></div></div>
          <div class="text-left"><label class="block text-white/50 text-sm font-bold mb-2">${t.conf}</label><input type="password" id="auth-cpw" class="inp" placeholder="${t.conf}" required /></div>
          <div class="text-left"><label class="block text-white/50 text-sm font-bold mb-2">${t.phone}</label><div class="relative inp flex items-center" style="padding:0"><span class="text-gold font-montserrat font-extrabold text-lg px-4" style="background:rgba(212,175,55,.1);border-radius:16px 0 0 16px;height:100%;display:flex;align-items:center">+213</span><input type="tel" id="auth-phone" class="inp" placeholder="5XXXXXXXX" style="border-radius:0 16px 16px 0;padding-left:16px;border-left:none" oninput="this.value=cleanPhoneInput(this.value)" required /></div></div>
          <div class="text-left"><label class="block text-white/50 text-sm font-bold mb-2">${t.wilaya}</label><select id="auth-wilaya" class="inp" required><option value="">${S.lang==='ar'?'اختر ولايتك':'Choose Wilaya'}</option>${WILAYAS.map(w=>`<option value="${w}">${w}</option>`).join('')}</select></div>
          <button type="submit" class="btn btn-gold">${isLogin?t.signIn:t.signUp}</button>
        </form>

        <button onclick="toggleAuthMode()" class="mt-4 text-white/50 text-sm font-bold bg-none border-none cursor-pointer">${isLogin?t.noAcc:t.hasAcc}</button>

        <div class="card mt-6 border-[rgba(34,197,94,.15)] w-full">
          <div class="flex items-center gap-2 mb-3 justify-end"><span class="text-green-500 text-base font-extrabold">${t.security}</span><span class="text-green-500 text-xl">🛡️</span></div>
          <p class="text-white/40 text-xs leading-loose text-left dir-ltr">• ${t.contract}<br/>• ${t.aes}<br/>• ${t.ein}</p>
        </div>
      </div>
    </div>
  `
}

function homeHTML(){
  const user=S.user;
  return `
    <div class="p-4">
      <div class="header flex items-center justify-between">
        <div class="flex items-center gap-2"><div class="bg-gold-gradient w-7 h-7 rounded-lg flex items-center justify-center">💎</div><p class="text-white font-extrabold">${T[S.lang].home}</p></div>
        <button onclick="toggleLang()" class="badge-pill badge-gold">${T[S.lang].lang}</button>
      </div>
      <div class="flex flex-col gap-3 mt-4">
        <div class="card border-gold p-4"><p class="text-white/40 text-[10px] font-extrabold mb-1">${T[S.lang].bal.toUpperCase()}</p><p class="text-gold font-montserrat text-3xl font-extrabold">${fmt(user.balance||0)}</p><p class="text-white/30 text-[10px] font-bold mt-1">د.ج</p></div>
        <div class="grid-2"><button onclick="openDeposit()" class="card p-3 flex items-center gap-3"><div class="w-10 h-10 bg-[rgba(212,175,55,.07)] rounded-lg flex items-center justify-center text-gold">💰</div><p class="text-white font-extrabold text-sm">${S.lang==='ar'?'شحن':'Deposit'}</p></button><button onclick="openWithdraw()" class="card p-3 flex items-center gap-3"><div class="w-10 h-10 bg-[rgba(34,197,94,.07)] rounded-lg flex items-center justify-center text-green-500">💳</div><p class="text-white font-extrabold text-sm">${T[S.lang].wd}</p></button></div>
        <div class="card border-gold p-4 text-center"><p class="text-white font-extrabold text-sm mb-3">🔗 رابط الدعوة</p><div class="bg-white/5 border border-white/5 rounded-xl p-2 mb-3 text-white/40 text-xs">${user.ref}</div><div class="grid-2"><button onclick="copyRef()" class="bg-white/5 text-white rounded-xl py-2 text-xs font-extrabold">📋 نسخ</button><button onclick="shareRef()" class="bg-gold text-[#020509] rounded-xl py-2 text-xs font-extrabold">🔗 مشاركة</button></div></div>
      </div>
    </div>
  `
}

function tasksHTML(){
  return `<div class="p-4"><div class="header"><p class="text-white font-extrabold">${T[S.lang].tasks}</p></div><div class="mt-4 text-center text-white/50">المهام قادمة...</div></div>`
}

function profileHTML(){
  const user=S.user;
  return `
    <div class="p-4">
      <div class="header flex items-center justify-between">
        <p class="text-white font-extrabold">${T[S.lang].acc}</p>
        <button onclick="toggleLang()" class="badge-pill badge-gold">${T[S.lang].lang}</button>
      </div>
      <div class="flex flex-col gap-3 mt-4">
        <div class="card border-gold p-5 text-center"><div class="bg-gold-gradient w-20 h-20 rounded-full flex items-center justify-center text-3xl font-extrabold text-[#020509] mx-auto mb-3">${(user.un||'?')[0].toUpperCase()}</div><p class="text-white font-extrabold text-lg">${user.un}</p><p class="text-white/30 text-[11px] font-bold mt-2">BLK-${String(user.id).slice(-6)}</p></div>
        <button onclick="logout()" class="btn bg-[rgba(239,68,68,.06)] border border-[rgba(239,68,68,.12)] text-red-500">🚪 خروج</button>
      </div>
    </div>
  `
}

function navHTML(){
  const tabs=[['home','🏠',T[S.lang].home],['tasks','⚡',T[S.lang].tasks],['up','💎',T[S.lang].up],['profile','👤',T[S.lang].acc]];
  return `<nav class="nav">${tabs.map(tb=>`<button onclick="S.tab='${tb[0]}';render()" class="nav-btn ${S.tab===tb[0]?'active':''}"><div class="nav-icon">${tb[1]}</div><span>${tb[2]}</span></button>`).join('')}</nav>`
}

function sheetHTML(){
  return `<div class="sheet" onclick="if(event.target===event.currentTarget){S.showSheet=false;render()}"><div class="sheet-content"><div class="sheet-handle"></div>${S.sheetTitle?`<p class="text-center text-base font-extrabold text-white p-3 border-b border-white/5">${S.sheetTitle}</p>`:''}<div class="p-4 pb-12">${S.sheetContent}</div></div></div>`
}

// Handlers
function toggleAuthMode(){isLogin=!isLogin;document.getElementById('auth-pw').value='';document.getElementById('auth-cpw').value='';document.getElementById('auth-phone').value='';document.getElementById('auth-wilaya').value='';render()}
function togglePw(){const pw=document.getElementById('auth-pw');pw.type=pw.type==='password'?'text':'password'}
function toggleLang(){S.lang=S.lang==='ar'?'en':'ar';document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';render()}
function handleAuth(e){
  e.preventDefault();
  const un=document.getElementById('auth-un').value;
  const pw=document.getElementById('auth-pw').value;
  const cpw=document.getElementById('auth-cpw').value;
  const phone=document.getElementById('auth-phone').value;
  const wilaya=document.getElementById('auth-wilaya').value;
  const normalizedPhone=normalizePhone(phone);
  
  if(!un||!pw){toast2('يرجى ملء الحقول','error');return}
  if(pw!==cpw){toast2('كلمتا المرور مختلفتان','error');return}
  if(!normalizedPhone){toast2('أدخل رقم جزائري صحيح','error');return}
  if(!wilaya){toast2('اختر الولاية','error');return}
  
  if(isLogin){
    const user=getUserByUsername(un);
    if(user&&user.pw===pw){S.user=user;toast2('👋 مرحباً '+un,'success')}
    else{toast2('بيانات خاطئة','error')}
  }else{
    if(getUserByUsername(un)){toast2('الاسم موجود','error');return}
    const code=Math.random().toString(36).substring(2,8).toUpperCase();
    const joinCode=(()=>{try{const params=new URLSearchParams(window.location.search);return(params.get('code')||params.get('ref')||'').toUpperCase()}catch{return''}})();
    const user={id:Date.now(),un,pw,code,ref:inviteLink(code),phone:normalizedPhone,wilaya,balance:0,taskBal:0,refEarn:0,teamCount:0,wheelSpins:1,m1Refs:0,level:'trial',totalEarned:0,joined:new Date().toISOString(),notifs:[]};
    if(joinCode){const referrer=getUserByCode(joinCode);if(referrer){referrer.teamCount++;referrer.wheelSpins++;saveUsers(getUsers())}}
    createUserLocal(user);
    S.user=user;
    toast2('🎉 مرحباً! لديك دورة عجلة حظ 🎡','success')
  }
  render()
}
function copyRef(){navigator.clipboard.writeText(S.user.ref);toast2('تم النسخ','success')}
function shareRef(){navigator.clipboard.writeText(`🏦 BlackRock\n${S.user.ref}`);toast2('تم النسخ','success')}
function openDeposit(){S.sheetTitle='شحن الرصيد';S.sheetContent=`<div class="text-center"><div class="w-14 h-14 bg-gold-gradient rounded-xl flex items-center justify-center mx-auto mb-3">💰</div><p class="text-gold font-extrabold mb-2">🔐 Signal</p><p class="text-white/50 text-xs mb-3">رابط الوكلاء للشحن:</p><div class="bg-black/20 rounded-xl p-3 text-xs text-white/55 mb-4 dir-ltr text-left">https://signal.me/#eu/8QzHlJCULtwT98_rnOOfdNxK5ndjabUYXgU8Zh8OsgPx3xc7m_hKhJUr0gUzR3cF</div><button onclick="window.open('https://signal.me/#eu/8QzHlJCULtwT98_rnOOfdNxK5ndjabUYXgU8Zh8OsgPx3xc7m_hKhJUr0gUzR3cF')" class="btn btn-blue w-full">🔐 فتح Signal</button></div>`;S.showSheet=true;render()}
function openWithdraw(){if(!S.user.level||S.user.level==='trial'){toast2('يتطلب M1','warning');return}if(S.user.balance<10000){toast2('الحد الأدنى 10,000 د.ج','warning');return}S.sheetTitle='سحب الأموال';S.sheetContent=`<div class="flex flex-col gap-3"><input class="inp" placeholder="رقم CCP" /><input class="inp" placeholder="الاسم الكامل" /><input type="number" class="inp" placeholder="المبلغ" /><button class="btn btn-green" onclick="S.showSheet=false;toast2('تم الإرسال','success')">تأكيد السحب ✅</button></div>`;S.showSheet=true;render()}
function logout(){S.user=null;S.tab='home';render()}

// Initialize
render();
</script>
</body>
</html>
