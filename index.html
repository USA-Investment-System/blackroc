        @keyframes heart-burst {

            100% { transform: scale(1.5) rotate(0deg); opacity: 0; }
        }

        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
        .slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .btn-press:active { transform: scale(0.95); }
        .shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .music-disc { animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .tab-indicator { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .comment-slide { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast-enter { animation: slide-up 0.3s ease-out; }
        .ripple { position: relative; overflow: hidden; }
        .ripple::after { content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%); transform: scale(0); opacity: 0; }

                if (containerRef.current) {
                    const scrollTop = containerRef.current.scrollTop;
                    const height = window.innerHeight;
                    const index = Math.round(scrollTop / height);
                    if (index !== activeIndex && index >= 0 && index < videos.length) {
                        setActiveIndex(index);
                    }
                }
            }, [activeIndex, videos.length]);

            useEffect(() => {
                const container = containerRef.current;
                if (container) {
                    container.addEventListener('scroll', handleScroll);
                    return () => container.removeEventListener('scroll', handleScroll);
                }
            }, [handleScroll]);

                <div ref={containerRef} className="video-container h-screen overflow-y-scroll hide-scrollbar">

        // ==================== MESSAGES TAB ====================
        const MessagesTab = ({ users, chats, onUpdateChats, onShowToast }) => {
            const [selectedChat, setSelectedChat] = useState(null);
            const [messageText, setMessageText] = useState('');
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [selectedChat?.messages]);

            const handleSendMessage = () => {
                if (!messageText.trim() || !selectedChat) return;
                
                const newMessage = {
                    id: Date.now(),
                    senderId: 'me',
                    text: messageText.trim(),
                    time: new Date(),
                    read: true
                };

                const updatedChats = chats.map(chat => {
                    if (chat.id === selectedChat.id) {
                        return { ...chat, messages: [...chat.messages, newMessage], unread: 0 };
                    }
                    return chat;
                });

                onUpdateChats(updatedChats);
                setMessageText('');
                
                // محاكاة رد تلقائي
                setTimeout(() => {
                    const replyMessage = {
                        id: Date.now() + 1,
                        senderId: selectedChat.userId,
                        text: 'شكراً على رسالتك! 👋',
                        time: new Date(),
                        read: false
                    };
                    onUpdateChats(prev => prev.map(chat => {
                        if (chat.id === selectedChat.id) {
                            return { ...chat, messages: [...chat.messages, replyMessage] };
                        }
                        return chat;
                    }));
                }, 2000);
            };

            if (selectedChat) {
                const user = users.find(u => u.id === selectedChat.userId);
                if (!user) return null;

                return (
                    <div className="h-screen bg-dark flex flex-col">
                        <div className="flex items-center gap-3 p-4 border-b border-white/5 bg-dark/95 backdrop-blur-xl z-10">
                            <button onClick={() => setSelectedChat(null)} className="text-white p-2 hover:bg-white/10 rounded-full transition-colors">
                                <Icon name="close" size={22} />
                            </button>
                            <div className="relative">
                                <img src={user.avatar} className="w-10 h-10 rounded-full object-cover border border-white/10" alt="" />
                                <div className="absolute bottom-0 left-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-dark"></div>
                            </div>
                            <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-1.5">
                                    <span className="text-white font-bold text-sm truncate">{user.name}</span>
                                    {user.verified && <Icon name="verified" size={14} />}
                                </div>
                                <span className="text-green-400 text-xs">متصل الآن</span>
                            </div>
                            <button className="p-2 text-white/60 hover:text-white hover:bg-white/10 rounded-full transition-colors" onClick={() => onShowToast('المكالمات الصوتية قريباً', 'info')}>
                                <Icon name="volume" size={20} />
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 hide-scrollbar">
                            {selectedChat.messages.map((msg, idx) => {
                                const isMe = msg.senderId === 'me';
                                const prevMsg = idx > 0 ? selectedChat.messages[idx - 1] : null;
                                const showAvatar = !isMe && (!prevMsg || prevMsg.senderId !== msg.senderId);
                                
                                return (
                                    <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'} items-end gap-2`}>
                                        {!isMe && showAvatar && (
                                            <img src={user.avatar} className="w-6 h-6 rounded-full object-cover flex-shrink-0 mb-1" alt="" />
                                        )}
                                        {!isMe && !showAvatar && <div className="w-6 flex-shrink-0" />}
                                        <div className={`max-w-[75%] px-4 py-2.5 rounded-2xl ${isMe ? 'bg-primary text-white rounded-tl-sm' : 'bg-white/10 text-white rounded-tr-sm'}`}>
                                            <p className="text-sm leading-relaxed">{msg.text}</p>
                                            <span className={`text-[10px] mt-1 block ${isMe ? 'text-white/70' : 'text-white/40'}`}>
                                                {timeAgo(msg.time)}
                                            </span>
                                        </div>
                                    </div>
                                );
                            })}
                            <div ref={messagesEndRef} />
                        </div>
                        
                        <div className="p-4 border-t border-white/5 bg-dark/95 backdrop-blur-xl">
                            <div className="flex gap-2 items-center">
                                <button className="p-2 text-white/40 hover:text-white transition-colors" onClick={() => onShowToast('الملصقات قريباً', 'info')}>
                                    <Icon name="emoji" size={22} />
                                </button>
                                <input 
                                    type="text" 
                                    value={messageText}
                                    onChange={(e) => setMessageText(e.target.value)}
                                    placeholder="اكتب رسالة..." 
                                    className="flex-1 bg-white/10 rounded-full py-2.5 px-4 text-white text-sm placeholder-white/40 focus:bg-white/15 transition-all border border-transparent focus:border-white/20"
                                    onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()}
                                />
                                <button 
                                    onClick={handleSendMessage}
                                    disabled={!messageText.trim()}
                                    className={`p-2.5 rounded-full transition-all ${messageText.trim() ? 'bg-primary text-white hover:bg-primary/80' : 'bg-white/10 text-white/30'}`}
                                >
                                    <Icon name="send" size={20} />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen overflow-y-auto hide-scrollbar bg-dark pb-20">
                    <div className="sticky top-0 z-40 bg-dark/95 backdrop-blur-xl p-4 border-b border-white/5">
                        <h2 className="text-white font-bold text-xl mb-4">الرسائل</h2>
                        <div className="relative">
                            <input 
                                type="text" 
                                placeholder="ابحث في المحادثات..." 
                                className="w-full bg-white/10 rounded-full py-2.5 px-4 pr-10 text-white text-sm placeholder-white/40 focus:bg-white/15 transition-all border border-transparent focus:border-white/20"
                            />
                            <Icon name="search" size={16} className="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/40" />
                        </div>
                    </div>
                    <div className="divide-y divide-white/5">
                        {chats.map(chat => {
                            const user = users.find(u => u.id === chat.userId);
                            if (!user) return null;
                            const lastMsg = chat.messages[chat.messages.length - 1];
                            return (
                                <button 
                                    key={chat.id} 
                                    className="w-full flex items-center gap-3 p-4 hover:bg-white/5 transition-colors text-right"
                                    onClick={() => {
                                        setSelectedChat(chat);
                                        if (chat.unread > 0) {
                                            onUpdateChats(chats.map(c => c.id === chat.id ? { ...c, unread: 0 } : c));
                                        }
                                    }}
                                >
                                    <div className="relative flex-shrink-0">
                                        <img src={user.avatar} className="w-14 h-14 rounded-full object-cover border border-white/10" alt="" />
                                        <div className="absolute bottom-0 left-0 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-dark"></div>
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center justify-between mb-1">
                                            <div className="flex items-center gap-1.5">
                                                <span className="text-white font-bold text-sm">{user.name}</span>
                                                {user.verified && <Icon name="verified" size={12} />}
                                            </div>
                                            <span className="text-white/40 text-xs">{lastMsg ? timeAgo(lastMsg.time) : ''}</span>
                                        </div>
                                        <div className="flex items-center justify-between">
                                            <p className={`text-sm truncate ${chat.unread > 0 ? 'text-white font-medium' : 'text-white/50'}`}>
                                                {lastMsg?.senderId === 'me' ? 'أنت: ' : ''}{lastMsg?.text || ''}
                                            </p>
                                            {chat.unread > 0 && (
                                                <span className="bg-primary text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 mr-2">
                                                    {chat.unread}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ==================== PROFILE TAB ====================
        const ProfileTab = ({ users, videos, posts, onShowToast, onNavigate }) => {
            const [activeTab, setActiveTab] = useState('videos');
            const [showEdit, setShowEdit] = useState(false);
            const [editName, setEditName] = useState('أنت');
            const [editBio, setEditBio] = useState('🎥 صانع محتوى | 💻 مطور | 🌍 مستكشف');
            const currentUser = { name: editName, avatar: 'https://i.pravatar.cc/150?img=68', username: '@your.username', bio: editBio, verified: true, followers: 1200000, following: 384 };

            const myVideos = videos.filter(v => v.userId === 1);
            const savedVideos = videos.filter(v => v.saved);
            const myPosts = posts.filter(p => p.userId === 1);

            const handleSaveProfile = () => {
                setShowEdit(false);
                onShowToast('تم تحديث الملف الشخصي ✅', 'success');
            };

            return (
                <div className="h-screen overflow-y-auto hide-scrollbar bg-dark pb-20">
                    <div className="relative h-48 bg-gradient-to-br from-primary via-purple-600 to-blue-600">
                        <div className="absolute inset-0 bg-black/20"></div>
                        <button className="absolute top-4 left-4 p-2 bg-black/30 backdrop-blur-sm rounded-full text-white hover:bg-black/50 transition-colors" onClick={() => setShowEdit(true)}>
                            <Icon name="edit" size={18} />
                        </button>
                    </div>
                    
                    <div className="px-4 -mt-16 relative z-10">
                        <div className="flex justify-between items-end mb-4">
                            <div className="relative">
                                <img src={currentUser.avatar} className="w-32 h-32 rounded-full border-4 border-dark object-cover shadow-2xl" alt="" />
                                <div className="absolute bottom-2 right-2 w-8 h-8 bg-primary rounded-full flex items-center justify-center border-2 border-dark shadow-lg">
                                    <Icon name="camera" size={16} className="text-white" />
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowEdit(true)}
                                className="bg-white/10 text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-white/20 transition-all mb-4 border border-white/10 backdrop-blur-sm"
                            >
                                تعديل الملف
                            </button>
                        </div>
                        
                        <div className="mb-5">
                            <div className="flex items-center gap-2 mb-1">
                                <h1 className="text-white font-bold text-2xl">{currentUser.name}</h1>
                                {currentUser.verified && <Icon name="verified" size={20} />}
                            </div>
                            <p className="text-white/50 text-sm mb-2">{currentUser.username}</p>
                            <p className="text-white/80 text-sm leading-relaxed">{currentUser.bio}</p>
                        </div>

                        <div className="flex justify-around py-5 border-y border-white/10 mb-5">
                            <button className="text-center group" onClick={() => onShowToast('عرض قائمة المتابعين', 'info')}>
                                <p className="text-white font-bold text-lg group-hover:text-primary transition-colors">{formatNumber(currentUser.following)}</p>
                                <p className="text-white/50 text-xs">يتابعون</p>
                            </button>
                            <button className="text-center group" onClick={() => onShowToast('عرض قائمة المتابعين', 'info')}>
                                <p className="text-white font-bold text-lg group-hover:text-primary transition-colors">{formatNumber(currentUser.followers)}</p>
                                <p className="text-white/50 text-xs">متابعين</p>
                            </button>
                            <button className="text-center group" onClick={() => onShowToast('عرض الإعجابات', 'info')}>
                                <p className="text-white font-bold text-lg group-hover:text-primary transition-colors">45.6M</p>
                                <p className="text-white/50 text-xs">إعجاب</p>
                            </button>
                        </div>

                        <div className="flex border-b border-white/10 mb-4">
                            {['videos', 'liked', 'posts'].map(tab => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`flex-1 py-3 text-sm font-bold transition-all relative ${activeTab === tab ? 'text-primary' : 'text-white/40 hover:text-white/70'}`}
                                >
                                    {tab === 'videos' ? 'الفيديوهات' : tab === 'liked' ? 'المفضلة' : 'المنشورات'}
                                    {activeTab === tab && <div className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-primary rounded-full" />}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-3 gap-1 pb-4">
                            {(activeTab === 'videos' ? myVideos : activeTab === 'liked' ? savedVideos : myPosts).map((item, i) => (
                                <button key={i} className="relative aspect-[3/4] bg-white/5 overflow-hidden group" onClick={() => onNavigate('home')}>
                                    <img 
                                        src={item.thumbnail || item.image || `https://picsum.photos/seed/profile${i}/300/400`} 
                                        className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" 
                                        alt="" 
                                    />
                                    <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3">
                                        <div className="flex items-center gap-1 text-white">
                                            <Icon name="heartFill" size={14} />
                                            <span className="text-xs font-bold">{formatNumber(item.likes)}</span>
                                        </div>
                                        <div className="flex items-center gap-1 text-white">
                                            <Icon name="comment" size={14} />
                                            <span className="text-xs font-bold">{formatNumber(item.comments)}</span>
                                        </div>
                                    </div>
                                </button>
                            ))}
                            {(activeTab === 'videos' ? myVideos : activeTab === 'liked' ? savedVideos : myPosts).length === 0 && (
                                <div className="col-span-3 text-center py-12 text-white/40">
                                    <Icon name={activeTab === 'videos' ? 'camera' : activeTab === 'liked' ? 'bookmark' : 'edit'} size={48} className="mx-auto mb-3 opacity-30" />
                                    <p>لا يوجد محتوى هنا بعد</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Edit Profile Modal */}
                    {showEdit && (
                        <div className="fixed inset-0 z-[80] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                            <div className="bg-surface w-full max-w-sm rounded-3xl p-6 border border-white/10 shadow-2xl">
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="text-white font-bold text-lg">تعديل الملف الشخصي</h3>
                                    <button onClick={() => setShowEdit(false)} className="text-white/60 hover:text-white p-1">
                                        <Icon name="close" size={24} />
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-white/60 text-xs mb-1.5 block">الاسم</label>
                                        <input 
                                            type="text" 
                                            value={editName}
                                            onChange={(e) => setEditName(e.target.value)}
                                            className="w-full bg-white/10 rounded-xl py-3 px-4 text-white text-sm focus:bg-white/15 transition-all border border-transparent focus:border-white/20"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-white/60 text-xs mb-1.5 block">نبذة عنك</label>
                                        <textarea 
                                            value={editBio}
                                            onChange={(e) => setEditBio(e.target.value)}
                                            rows={3}
                                            className="w-full bg-white/10 rounded-xl py-3 px-4 text-white text-sm focus:bg-white/15 transition-all border border-transparent focus:border-white/20 resize-none"
                                        />
                                    </div>
                                    <button 
                                        onClick={handleSaveProfile}
                                        className="w-full bg-primary text-white py-3 rounded-xl font-bold hover:bg-primary/80 transition-all mt-2"
                                    >
                                        حفظ التغييرات
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== MAIN APP ====================
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [users, setUsers] = useState(INITIAL_USERS);
            const [stories, setStories] = useState(INITIAL_STORIES);
            const [videos, setVideos] = useState(INITIAL_VIDEOS);
            const [posts, setPosts] = useState(INITIAL_POSTS);
            const [chats, setChats] = useState(INITIAL_CHATS);
            const [toast, setToast] = useState(null);
            const [showComments, setShowComments] = useState(null);
            const [showShare, setShowShare] = useState(null);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            const updateVideo = (videoId, updates) => {
                setVideos(videos.map(v => v.id === videoId ? { ...v, ...updates } : v));
            };

            const updatePost = (postId, updates) => {
                setPosts(posts.map(p => p.id === postId ? { ...p, ...updates } : p));
            };

            const updateStory = (storyId, updates) => {
                setStories(stories.map(s => s.id === storyId ? { ...s, ...updates } : s));
            };

            const updateChats = (newChats) => {
                setChats(newChats);
            };

            const addComment = (videoId, text) => {
                setVideos(videos.map(v => {
                    if (v.id === videoId) {
                        return {
                            ...v,
                            comments: v.comments + 1,
                            commentsList: [...v.commentsList, {
                                id: Date.now(),
                                userId: 0, // current user
                                text,
                                likes: 0,
                                liked: false,
                                time: new Date()
                            }]
                        };
                    }
                    return v;
                }));
                showToast('تم إضافة التعليق!', 'success');
            };

            const likeComment = (videoId, commentId) => {
                setVideos(videos.map(v => {
                    if (v.id === videoId) {
                        return {
                            ...v,
                            commentsList: v.commentsList.map(c => {
                                if (c.id === commentId) {
                                    return { ...c, liked: !c.liked, likes: c.liked ? c.likes - 1 : c.likes + 1 };
                                }
                                return c;
                            })
                        };
                    }
                    return v;
                }));
            };

            const tabs = [
                { id: 'home', icon: 'home', label: 'الرئيسية' },
                { id: 'search', icon: 'search', label: 'اكتشف' },
                { id: 'create', icon: 'plus', label: 'إنشاء' },
                { id: 'messages', icon: 'message', label: 'رسائل' },
                { id: 'profile', icon: 'user', label: 'أنا' },
            ];

            const renderContent = () => {
                switch(activeTab) {
                    case 'home': return <HomeFeed users={users} stories={stories} posts={posts} onUpdatePost={updatePost} onUpdateStory={updateStory} onShowToast={showToast} onNavigate={setActiveTab} />;
                    case 'search': return <SearchTab users={users} onShowToast={showToast} onNavigate={setActiveTab} />;
                    case 'create': return <CreateTab onShowToast={showToast} onNavigate={setActiveTab} />;
                    case 'messages': return <MessagesTab users={users} chats={chats} onUpdateChats={updateChats} onShowToast={showToast} />;
                    case 'profile': return <ProfileTab users={users} videos={videos} posts={posts} onShowToast={showToast} onNavigate={setActiveTab} />;
                    default: return <HomeFeed users={users} stories={stories} posts={posts} onUpdatePost={updatePost} onUpdateStory={updateStory} onShowToast={showToast} onNavigate={setActiveTab} />;
                }
            };

            return (
                <AppContext.Provider value={{ showToast }}>
                    <div className="relative h-screen w-full max-w-md mx-auto bg-dark overflow-hidden shadow-2xl">
                        {renderContent()}

                        {/* Comments Sheet */}
                        {showComments && (
                            <CommentsSheet 
                                isOpen={!!showComments} 
                                onClose={() => setShowComments(null)} 
                                video={showComments}
                                users={users}
                                onAddComment={addComment}
                                onLikeComment={likeComment}
                            />
                        )}

                        {/* Share Sheet */}
                        {showShare && (
                            <ShareSheet 
                                isOpen={!!showShare} 
                                onClose={() => setShowShare(null)} 
                                onShare={(msg) => showToast(msg, 'success')}
                            />
                        )}

                        {/* Toast */}
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                        {/* Bottom Navigation */}
                        <div className="absolute bottom-0 left-0 right-0 bg-dark/95 backdrop-blur-xl border-t border-white/5 z-50">
                            <div className="flex justify-around items-center py-2">
                                {tabs.map(tab => (
                                    <button 
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex flex-col items-center gap-0.5 p-2 transition-all ${activeTab === tab.id ? 'text-primary scale-110' : 'text-white/50 hover:text-white/80'}`}
                                    >
                                        {tab.id === 'create' ? (
                                            <div className="w-10 h-10 bg-gradient-to-r from-primary to-secondary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20">
                                                <Icon name="plus" size={24} className="text-white" />
                                            </div>
                                        ) : (
                                            <>
                                                <div className="relative">
                                                    <Icon name={tab.icon} size={24} />
                                                    {tab.id === 'messages' && chats.reduce((a, c) => a + c.unread, 0) > 0 && (
                                                        <span className="absolute -top-1 -right-1 w-4 h-4 bg-primary rounded-full text-[8px] text-white flex items-center justify-center font-bold">
                                                            {chats.reduce((a, c) => a + c.unread, 0)}
                                                        </span>
                                                    )}
                                                </div>
                                                <span className="text-[9px] font-medium">{tab.label}</span>
                                            </>
                                        )}
                                    </button>
                                ))}
                            </div>
                            <div className="h-1.5 bg-dark"></div>
                        </div>

                        {/* Floating Video Button */}
                        <button 
                            onClick={() => setActiveTab('home')}
                            className={`absolute top-4 right-4 z-30 p-3 rounded-full backdrop-blur-md transition-all shadow-lg ${activeTab === 'home' ? 'bg-primary/90 text-white shadow-primary/30' : 'bg-black/50 text-white/80 border border-white/10'}`}
                        >
                            <Icon name="play" size={20} />
                        </button>
                    </div>
                </AppContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
