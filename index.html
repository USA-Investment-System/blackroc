<!DOCTYPE html>
<html id="html-root" lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020509">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BlackRock — Investment Platform</title>
<style>
/* ── RESET & VARS ── */
:root{
  --bg:#020509;--c1:#0a1020;--c2:#0d1428;
  --gold:#D4AF37;--gold2:#C9992C;--gold3:#B8860B;--goldL:#E8CC6A;
  --w:#FFF;--g1:rgba(255,255,255,.85);--g2:rgba(255,255,255,.52);
  --g3:rgba(255,255,255,.26);--g4:rgba(255,255,255,.09);--g5:rgba(255,255,255,.04);
  --grn:#22C55E;--red:#EF4444;--blu:#3B82F6;--pur:#A855F7;
  --bdr:rgba(212,175,55,.14);--bdr2:rgba(255,255,255,.06);
}
*{font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--w);}
#root{height:100%;display:flex;justify-content:center;}
.app{width:100%;max-width:430px;height:100%;position:relative;overflow:hidden;background:var(--bg);}

/* ── SCROLL ── */
.scr{position:absolute;top:0;left:0;right:0;bottom:72px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;will-change:scroll-position;}
.scr::-webkit-scrollbar,.sh::-webkit-scrollbar,.as::-webkit-scrollbar{display:none;}
.as{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ── ANIMATIONS (GPU accelerated) ── */
@keyframes fu{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fy{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-7px,0)}}
@keyframes gl{0%,100%{box-shadow:0 0 18px rgba(212,175,55,.3)}50%{box-shadow:0 0 36px rgba(212,175,55,.6)}}
@keyframes su{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes td{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
@keyframes pb{from{width:0}to{width:100%}}
@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.fu{animation:fu .2s cubic-bezier(.16,1,.3,1) both;}
.fi{animation:fi .16s ease both;}
.fy{animation:fy 3s ease-in-out infinite;}
.gl{animation:gl 2.5s infinite;}
.pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1) both;}

/* ── CARDS ── */
.cd{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));border:1px solid var(--bdr2);border-radius:14px;}
.cdg{border-color:var(--bdr)!important;}
.cdn{border-color:rgba(34,197,94,.22)!important;}
.cdr{border-color:rgba(239,68,68,.2)!important;}

/* ── GOLD TEXT ── */
.gt{background:linear-gradient(135deg,var(--goldL),var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ── BUTTONS ── */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:800;border-radius:12px;padding:12px 14px;font-size:14px;width:100%;-webkit-tap-highlight-color:transparent;}
.btn:active{opacity:.82;transform:scale(.97);}
.bp{background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold3));color:var(--bg);box-shadow:0 4px 18px rgba(212,175,55,.28);}
.bs{background:rgba(255,255,255,.07);border:1px solid var(--bdr2);color:var(--w);}
.bd{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.24);color:var(--red);}
.bg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.24);color:var(--grn);}

/* ── NAV ── */
.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(2,5,9,.97);border-top:1px solid rgba(212,175,55,.09);display:flex;justify-content:space-around;align-items:center;z-index:100;}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;color:var(--g3);padding:4px 12px;position:relative;}
.nb.on{color:var(--gold);}
.nb.on::after{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:20px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:0 0 2px 2px;}
.nl{font-size:10px;font-weight:700;margin-top:1px;}
.bdg{position:absolute;top:-4px;right:-5px;min-width:16px;height:16px;background:var(--red);border-radius:8px;border:2px solid var(--bg);font-size:8px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ── INPUT ── */
.inp{background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:12px;color:var(--w);padding:12px 14px;font-size:14px;font-family:'Tajawal',sans-serif;font-weight:700;outline:none;width:100%;}
.inp:focus{border-color:rgba(212,175,55,.45);}
.inp::placeholder{color:var(--g3);}

/* ── SHEET ── */
.sho{position:fixed;inset:0;background:rgba(2,5,9,.86);z-index:200;display:flex;align-items:flex-end;}
.sh{background:linear-gradient(180deg,#0b1122,#050912);border-radius:22px 22px 0 0;border-top:1px solid rgba(212,175,55,.14);border-left:1px solid var(--bdr2);border-right:1px solid var(--bdr2);width:100%;max-height:92vh;overflow-y:auto;animation:su .28s cubic-bezier(.16,1,.3,1);-webkit-overflow-scrolling:touch;}

/* ── BADGES ── */
.bgd{background:linear-gradient(135deg,rgba(212,175,55,.14),rgba(201,153,44,.09));border:1px solid rgba(212,175,55,.28);border-radius:100px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;}

/* ── PROGRESS ── */
.pg{background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;transition:width .4s ease;}
.pg-g{background:linear-gradient(90deg,var(--gold),var(--gold2));}
.pg-n{background:linear-gradient(90deg,var(--grn),#16A34A);}
.pg-r{background:linear-gradient(90deg,var(--red),#DC2626);}
.pg-b{background:linear-gradient(90deg,var(--blu),#2563EB);}

/* ── TASK CARDS ── */
.tc{border-radius:14px;padding:12px;margin-bottom:7px;}
.tc-a{border-color:rgba(212,175,55,.24)!important;}
.tc-r{border-color:rgba(212,175,55,.5)!important;background:linear-gradient(135deg,rgba(22,17,3,.5),rgba(7,12,24,.99))!important;}
.tc-d{border-color:rgba(34,197,94,.3)!important;background:linear-gradient(135deg,rgba(0,20,10,.3),rgba(7,12,24,.99))!important;}
.tc-f{border-color:rgba(239,68,68,.2)!important;opacity:.68;}

/* ── WHEEL ── */
.wo{width:260px;height:260px;border-radius:50%;position:relative;}
.wp{position:absolute;top:-11px;left:50%;transform:translateX(-50%);border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid var(--red);z-index:10;filter:drop-shadow(0 0 6px rgba(239,68,68,.7));}
.wh{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:var(--bg);border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 18px rgba(212,175,55,.4);}

/* ── MARKET TICKER ── */
.ticker-wrap{overflow:hidden;background:rgba(212,175,55,.05);border-bottom:1px solid rgba(212,175,55,.07);}
.ticker-inner{display:flex;gap:0;animation:tk 20s linear infinite;white-space:nowrap;will-change:transform;}
.tick{display:inline-flex;align-items:center;gap:5px;padding:5px 16px;flex-shrink:0;}

/* ── AI BUBBLES ── */
.bai{background:rgba(10,16,32,.97);border:1px solid var(--bdr2);border-radius:13px;border-top-left-radius:4px;padding:10px 13px;max-width:86%;font-size:12.5px;line-height:1.7;color:var(--g1);white-space:pre-wrap;}
.bu{background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:13px;border-top-right-radius:4px;padding:10px 13px;max-width:86%;font-size:12.5px;line-height:1.7;color:var(--bg);font-weight:700;white-space:pre-wrap;}
.tdd span{display:inline-block;width:6px;height:6px;background:var(--g3);border-radius:50%;margin:0 2px;}
.tdd span:nth-child(1){animation:td 1.2s 0s infinite}
.tdd span:nth-child(2){animation:td 1.2s .2s infinite}
.tdd span:nth-child(3){animation:td 1.2s .4s infinite}

/* ── FAB ── */
.fab{position:absolute;bottom:80px;left:12px;z-index:99;width:50px;height:50px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:15px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 6px 22px rgba(212,175,55,.4);}
.fdot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;background:var(--grn);border-radius:50%;border:2px solid var(--bg);animation:dp 1.6s infinite;}

/* ── AVATAR ── */
.avr{background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold3));padding:2.5px;border-radius:50%;display:inline-block;}

/* ── SHIMMER ── */
.shim{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));border:1px solid rgba(212,175,55,.16);border-radius:14px;position:relative;overflow:hidden;}
.shim::before{content:'';position:absolute;top:0;left:-100%;width:80%;height:100%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.04),transparent);animation:su 0s, fu 0s;}

/* ── STAT ── */
.stc{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));border:1px solid var(--bdr2);border-radius:13px;padding:11px 7px;text-align:center;}

/* ── LVEL CARD ── */
.lvc{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));border:1px solid rgba(212,175,55,.1);border-radius:14px;padding:13px;margin-bottom:9px;}
.lvc.lk{border-color:rgba(239,68,68,.08);opacity:.65;}
.lvc.cu{border-color:rgba(34,197,94,.34);}

/* ── COMPETITION CARD ── */
.comp-card{background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(139,92,246,.06));border:1px solid rgba(168,85,247,.25);border-radius:14px;padding:14px;}

/* ── TOAST ── */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:800;color:#fff;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);}

/* ── SAVE INDICATOR ── */
#sv{position:fixed;top:12px;right:10px;z-index:9998;font-size:9px;font-weight:800;color:var(--grn);background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.18);border-radius:100px;padding:2px 8px;opacity:0;transition:opacity .3s;pointer-events:none;}
#sv.on{opacity:1;}

/* RTL fix for LTR content */
.ltr{direction:ltr;text-align:left;}
[lang="en"] .ltr-text{direction:ltr;}
</style>
</head>

function t(k){return(T[LANG.current]||T.ar)[k]||k;}
function setLang(l){
  LANG.current=l;
  const root=document.getElementById('html-root');
  root.lang=l;root.dir=l==='ar'?'rtl':'ltr';
  render();
}
window.toggleLang=function(){setLang(LANG.current==='ar'?'en':'ar');};

// ── Storage ──
let _svT;
const DB={
  g(k){try{const v=localStorage.getItem('br6_'+k);return v?JSON.parse(v):null;}catch{return null;}},
  s(k,v){
    try{localStorage.setItem('br6_'+k,JSON.stringify(v));}catch{}
    clearTimeout(_svT);
    const el=document.getElementById('sv');
    if(el){el.classList.add('on');_svT=setTimeout(()=>el.classList.remove('on'),1400);}
  },
  d(k){try{localStorage.removeItem('br6_'+k);}catch{}}
};

// ── State ──
const S={
  user:null,tab:'home',
  activeTask:null,cdVal:40,cdTimer:null,
  tasks:null,sheetEl:null,
  wheelRot:0,wheelSpinning:false,
  aiMsgs:[],aiTyping:false,
  joinCode:null
};

// ── Utils ──
function fmt(n){n=parseFloat(n)||0;if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});}
function genCode(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');}
function today(){return new Date().toDateString();}
function $(id){return document.getElementById(id);}
function detectRef(){const h=location.hash;if(h.includes('ref='))S.joinCode=h.split('ref=')[1]?.split('&')[0]||null;const p=new URLSearchParams(location.search);if(p.get('ref'))S.joinCode=p.get('ref');}
function getRefLink(){return location.href.split('?')[0].split('#')[0]+'?ref='+S.user.code;}

// ── Toast ──
let _tt;
function toast(msg,type='info'){
  clearTimeout(_tt);
  const c={success:'#16A34A',error:'#DC2626',warning:'#D97706',info:'#1D4ED8'};
  const el=$('toast');if(!el)return;
  el.style.cssText=`position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:800;color:#fff;background:${c[type]};display:block;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:fu .18s ease;`;
  el.textContent=msg;
  _tt=setTimeout(()=>{el.style.display='none';},2600);
}

// ── User ──
function saveUser(){
  if(!S.user)return;
  DB.s('cur',S.user);
  const users=DB.g('users')||[];
  const i=users.findIndex(u=>u.id===S.user.id);
  if(i>=0)users[i]=S.user;else users.push(S.user);
  DB.s('users',users);
}
function upd(ch){Object.assign(S.user,ch);saveUser();}

function lvIdx(id){return LVS.findIndex(l=>l.id===id);}
function lvN(id){return LVS.find(l=>l.id===id)?.n||'Starter';}
function nextLv(id){const i=lvIdx(id);return i>=0&&i<LVS.length-1?LVS[i+1]:null;}

// ── Daily Tasks by Level ──
// Tasks change daily and scale with level
function getDailyTasks(){
  const u=S.user;
  const lvI=lvIdx(u.level||'trial');
  const lvData=LVS[Math.max(0,lvI)];
  const reward=lvData.dy; // reward per task matches level daily / 5
  const perTask=Math.max(43,Math.floor(reward/5));

  // Seed based on date + userId so tasks change daily but consistently
  const seed=parseInt(today().replace(/\D/g,'').slice(-4))+u.id;
  const taskTypes=[
    {ar:'مشاهدة رسالة استثمارية',en:'View investment report',sec:40},
    {ar:'مراجعة أداء المحفظة',en:'Review portfolio performance',sec:40},
    {ar:'قراءة تقرير السوق',en:'Read market report',sec:45},
    {ar:'تحليل اتجاهات السوق',en:'Analyze market trends',sec:35},
    {ar:'فحص الاستراتيجية اليومية',en:'Check daily strategy',sec:40},
    {ar:'مراجعة الأرباح والخسائر',en:'Review P&L report',sec:50},
    {ar:'تحديث بيانات المحفظة',en:'Update portfolio data',sec:40},
  ];
  // Pick 5 unique tasks based on seed
  const saved=DB.g('tk_'+u.id);
  if(saved&&saved.date===today())return saved.tasks;
  const shuffled=[...taskTypes].sort(()=>Math.sin(seed)*10000%1-.5);
  const picked=shuffled.slice(0,5);
  const tasks=picked.map((tp,i)=>({id:i+1,nameAr:tp.ar,nameEn:tp.en,sec:tp.sec,reward:perTask,status:'available'}));
  DB.s('tk_'+u.id,{date:today(),tasks});
  return tasks;
}
function saveTasks(){DB.s('tk_'+S.user.id,{date:today(),tasks:S.tasks});}

// Returns {eligible, progress, nextPrize}
function getCompStatus(u){
  // Count m1+ referrals
  const m1Refs=u.m1Refs||0;
  const prog=m1Refs%10;
  const tier=Math.floor(m1Refs/10);
  // Prize: free upgrade
  const curIdx=lvIdx(u.level||'trial');
  const prizeLevel=LVS[Math.min(curIdx+1+tier,LVS.length-1)];
  return{prog,goal:10,tier,prizeLevel};
}

window.startTask=function(id){
  if(S.activeTask!==null){toast(LANG.current==='ar'?'هناك مهمة جارية!':'Task in progress!','warning');return;}
  const tk=S.tasks.find(x=>x.id===id);if(!tk||tk.status!=='available')return;
  tk.status='active';S.activeTask=id;S.cdVal=tk.sec;saveTasks();render();
  toast(LANG.current==='ar'?'⏱️ المهمة بدأت!':'⏱️ Task started!','info');
  S.cdTimer=setInterval(()=>{
    S.cdVal--;
    const cd=$('cd-'+id),cb=$('cb-'+id);
    if(cd)cd.textContent=S.cdVal;
    if(cb)cb.style.width=((tk.sec-S.cdVal)/tk.sec*100)+'%';
    if(S.cdVal<=0){clearInterval(S.cdTimer);S.cdTimer=null;completeTask(id);}
  },1000);
};

function completeTask(id){
  const tk=S.tasks.find(x=>x.id===id);if(!tk)return;
  tk.status='done';S.activeTask=null;saveTasks();
  upd({balance:(S.user.balance||0)+tk.reward,taskBal:(S.user.taskBal||0)+tk.reward,totalEarned:(S.user.totalEarned||0)+tk.reward});
  toast('✓ +'+(tk.reward)+' DZD!','success');render();
}

const WP=[
  {l:'43 DZD',v:43,bg:'#D4AF37',fg:'#020509'},
  {l:'86 DZD',v:86,bg:'#B8860B',fg:'#fff'},
  {l:'215 DZD',v:215,bg:'#D4AF37',fg:'#020509'},
  {l:'Spin+',v:0,bg:'#7C3AED',fg:'#fff'},
  {l:'430 DZD',v:430,bg:'#C9992C',fg:'#020509'},
  {l:'86 DZD',v:86,bg:'#B8860B',fg:'#fff'},
  {l:'215 DZD',v:215,bg:'#D4AF37',fg:'#020509'},
  {l:'43 DZD',v:43,bg:'#C9992C',fg:'#020509'},
];
window.tryWheel=function(){
  closeSheet();
  if((S.user.wheelSpins||0)<=0){toast(LANG.current==='ar'?'ادعُ صديقاً للحصول على دورة!':'Invite a friend to earn a spin!','warning');return;}
  openWheelScreen();
};
function openWheelScreen(){
  const ex=$('ws');if(ex)ex.remove();
  const ov=document.createElement('div');
  ov.id='ws';
  ov.style.cssText='position:fixed;inset:0;background:rgba(2,5,9,.94);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;animation:fi .16s ease';
  // Build wheel SVG segments
  const n=WP.length,r=130,cx=134,cy=134;
  const seg=360/n;
  const segs=WP.map((p,i)=>{
    const a1=(i*seg-90)*Math.PI/180;
    const a2=((i+1)*seg-90)*Math.PI/180;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const mx=cx+(r*.62)*Math.cos((a1+a2)/2),my=cy+(r*.62)*Math.sin((a1+a2)/2);
    const rot=(i*seg+(seg/2)-90);
    return`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${p.bg}" stroke="rgba(0,0,0,.3)" stroke-width="1"/>
    <text x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="11" fill="${p.fg}" transform="rotate(${rot},${mx},${my})">${p.l}</text>`;
  }).join('');

  ov.innerHTML=`
    <button onclick="$('ws')?.remove()" style="position:absolute;top:48px;right:14px;width:36px;height:36px;background:var(--g4);border:1px solid var(--bdr2);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--g2)">${I.x}</button>
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-family:Montserrat,sans-serif;font-size:11px;font-weight:800;color:var(--gold);letter-spacing:2px">${t('wheelTitle').toUpperCase()}</div>
      <div style="color:var(--g3);font-size:11.5px;margin-top:2px">${t('wheelSpins')}: <span id="ws-s" style="color:var(--gold);font-weight:800">${S.user.wheelSpins||0}</span></div>
    </div>
    <div style="position:relative;margin-bottom:18px">
      <div class="wp"></div>
      <svg id="wheel-svg" width="268" height="268" viewBox="0 0 268 268" style="transform:rotate(${S.wheelRot}deg);border-radius:50%;box-shadow:0 0 50px rgba(212,175,55,.25),0 0 100px rgba(212,175,55,.1)">
        ${segs}
        <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bg)" stroke="var(--gold)" stroke-width="3"/>
        <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-family="Montserrat,sans-serif" font-size="12" font-weight="900" fill="var(--gold)">BLK</text>
      </svg>
    </div>
    <div id="wr" style="min-height:52px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;width:100%;max-width:280px"></div>
    <button id="w-btn" onclick="spinWheel()" class="btn bp" style="width:100%;max-width:280px;font-size:14px;color:var(--bg)">${(S.user.wheelSpins||0)>0?'🎯 '+t('wheelSpin'):t('noSpins')}</button>
    <div style="color:var(--g3);font-size:9.5px;margin-top:8px;text-align:center">${LANG.current==='ar'?'كل صديق يسجل = دورة لك + دورة له!':'Each friend who joins = spin for you + spin for them!'}</div>
  `;
  document.body.appendChild(ov);
}
window.spinWheel=function(){
  if(S.wheelSpinning||(S.user.wheelSpins||0)<=0)return;
  S.wheelSpinning=true;
  const btn=$('w-btn');btn.textContent='🎡 ...';btn.disabled=true;
  const n=WP.length,seg=360/n;
  const add=1440+Math.random()*1440,nr=S.wheelRot+add;
  const svgEl=$('wheel-svg');
  svgEl.style.cssText=`transform:rotate(${nr}deg);border-radius:50%;box-shadow:0 0 50px rgba(212,175,55,.25);transition:transform 4s cubic-bezier(.17,.67,.12,.99);`;
  S.wheelRot=nr;
  setTimeout(()=>{
    const wi=Math.floor(((360-(nr%360))+seg/2)%360/seg)%n;
    const prize=WP[wi];
    S.wheelSpinning=false;
    const ns=Math.max(0,(S.user.wheelSpins||0)-1);
    if(prize.v>0){
      upd({balance:(S.user.balance||0)+prize.v,totalEarned:(S.user.totalEarned||0)+prize.v,wheelSpins:ns});
      toast('🎉 +'+prize.v+' DZD!','success');
    } else {
      upd({wheelSpins:ns+1});
      toast(LANG.current==='ar'?'🎠 دورة إضافية!':'🎠 Extra spin!','warning');
    }
    const wr=$('wr');
    if(wr)wr.innerHTML=`<div class="shim" style="border-radius:12px;padding:11px 20px;text-align:center;width:100%"><div style="color:var(--g3);font-size:10px;font-family:Montserrat,sans-serif;margin-bottom:2px">${t('prize')}</div><div style="font-family:Montserrat,sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--goldL),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${prize.v>0?'+'+prize.v+' DZD':prize.l}</div></div>`;
    const ss=$('ws-s');if(ss)ss.textContent=S.user.wheelSpins||0;
    if(btn){btn.textContent=(S.user.wheelSpins||0)>0?'🎯 '+t('wheelSpin'):t('noSpins');btn.disabled=(S.user.wheelSpins||0)<=0;}
    render();
  },4100);
};

              if(nxt){ru.level=nxt.id;ru.notifs=[...(ru.notifs||[]),{id:Date.now(),title:'🏆 '+(LANG.current==='ar'?'ترقية مجانية!':'Free Upgrade!'),desc:`${LANG.current==='ar'?'لقد فزت بترقية مجانية إلى':'You earned a free upgrade to'} ${nxt.n}!`,t:'Now',r:false}];}
            }
            const ri=users.findIndex(x=>x.id===ru.id);if(ri>=0)users[ri]=ru;DB.s('users',users);
          }
        }
        const u={id:Date.now(),un,pw,code,ref:'blackrock.app/ref/'+code,
          balance:0,taskBal:0,refEarn:0,teamCount:0,wheelSpins:S.joinCode?1:0,
          m1Refs:0,level:null,totalEarned:0,avatar:null,
          joined:new Date().toISOString(),joinedVia:S.joinCode||null,
          notifs:[
            {id:1,title:S.joinCode?'🎁 '+(LANG.current==='ar'?'مرحباً! حصلت على دورة عجلة حظ!':'Welcome! You got a lucky spin!'):'👋 '+(LANG.current==='ar'?'مرحباً بك في BlackRock!':'Welcome to BlackRock!'),
             desc:LANG.current==='ar'?'ابدأ المهام اليومية الآن وادعُ أصدقاءك!':'Start daily tasks now and invite friends!',t:'Now',r:false},
            {id:2,title:'🏆 '+(LANG.current==='ar'?'مسابقة الإحالة':'Referral Contest'),
             desc:LANG.current==='ar'?'ادعُ 10 أصدقاء يشحنون M1 ← ترقية مجانية!':'Invite 10 friends who upgrade M1 → Free upgrade!',t:'Now',r:false},
          ]};
        users.push(u);DB.s('users',users);DB.s('cur',u);S.user=u;
        toast(S.joinCode?'🎡 +'+(LANG.current==='ar'?'دورة عجلة حظ!':'Free spin!'):'🎉','success');
        S.joinCode=null;launchApp();
      }
    },400);
  };
}

function launchApp(){S.tasks=getDailyTasks();render();}
function boot(){const app=$('app');if(!app)return;const u=DB.g('cur');if(u){S.user=u;launchApp();}else renderAuth();}

// ── Handle M1 upgrade → count for competition ──
const _origUpd=upd;
// When a user upgrades to M1+, notify their referrer
window.handleM1Upgrade=function(userId){
  const users=DB.g('users')||[];
  const u=users.find(x=>x.id===userId);
  if(!u||!u.joinedVia)return;
  const ref=users.find(x=>x.code===u.joinedVia);
  if(!ref)return;
  ref.m1Refs=(ref.m1Refs||0)+1;
  ref.refEarn=(ref.refEarn||0)+((LVS.find(l=>l.id===u.level)||LVS[0]).dy*0.05);
  // Check competition milestone
  if(ref.m1Refs%10===0){
    const nxt=nextLv(ref.level||'trial');
    if(nxt){
      ref.level=nxt.id;
      ref.notifs=[...(ref.notifs||[]),{id:Date.now(),title:'🏆 Free Upgrade!',desc:`Congrats! Free upgrade to ${nxt.n}!`,t:'Now',r:false}];
      toast(LANG.current==='ar'?'🏆 ترقية مجانية!':'🏆 Free Upgrade!','success');
    }
  }
  const ri=users.findIndex(x=>x.id===ref.id);if(ri>=0)users[ri]=ref;DB.s('users',users);
  if(S.user&&S.user.id===ref.id){S.user=ref;saveUser();}
};
