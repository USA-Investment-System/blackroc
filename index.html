<script>
// الحالة العامة للمهام
let tasksState = {
    total: 5,
    done: 0,
    failed: 0,
    currentRunning: false
};

// بناء قائمة المهام مع حالة "قفل" ذكية
function buildTasks() {
    const tasksList = document.getElementById('tasks-list');
    tasksList.innerHTML = '';
    for(let i=1; i<=tasksState.total; i++){
        tasksList.innerHTML += `
            <div class="task-card" id="task-item-${i}" onclick="openMiningTask(${i})">
                <div class="task-icon" id="icon-${i}">⚡</div>
                <div class="task-info">
                    <div class="task-title">المهمة اليومية رقم ${i}</div>
                    <div id="status-text-${i}" style="font-size:11px; color:var(--text2)">اضغط للبدء (30 ثانية)</div>
                    <div class="task-progress"><div class="task-progress-bar" id="bar-${i}" style="width:0%"></div></div>
                </div>
                <div class="task-reward" id="reward-val-${i}">
                    <div class="amount">+43</div>
                    <div class="label">DZD</div>
                </div>
            </div>
        `;
    }
}

// فتح مودال المهمة لبدء العد التنازلي
function openMiningTask(taskId) {
    if(tasksState.currentRunning) return showToast("⚠️ أكمل المهمة الحالية أولاً!");
    
    const card = document.getElementById(`task-item-${taskId}`);
    if(card.classList.contains('completed') || card.classList.contains('failed')) return;

    const title = document.getElementById('modal-title');
    const content = document.getElementById('modal-content');
    
    title.textContent = `معالجة المهمة ${taskId}`;
    content.innerHTML = `
        <div style="text-align:center; padding:20px;">
            <div id="modal-timer" style="font-size:50px; font-weight:900; color:var(--gold); margin-bottom:20px;">30s</div>
            <p style="font-size:13px; color:var(--text2); margin-bottom:20px;">يجب البقاء في هذه الصفحة. إغلاق النافذة يعني خسارة المهمة نهائياً.</p>
            <button class="modal-btn" id="confirm-task-btn" onclick="startCountdown(${taskId})">بدء المعالجة الآن</button>
            <button class="modal-btn outline" onclick="cancelTask(${taskId})">إلغاء المهمة (خسارة الربح)</button>
        </div>
    `;
    openModalDirect();
}

let activeInterval;

function startCountdown(taskId) {
    tasksState.currentRunning = true;
    let s = 30;
    const timerDisplay = document.getElementById('modal-timer');
    const btn = document.getElementById('confirm-task-btn');
    const progressBar = document.getElementById(`bar-${taskId}`);
    
    btn.disabled = true;
    btn.style.opacity = "0.5";
    btn.innerText = "جاري الاتصال بالعقدة...";

    activeInterval = setInterval(() => {
        s--;
        timerDisplay.textContent = s + "s";
        progressBar.style.width = ((30 - s) / 30 * 100) + "%";

        if(s <= 0) {
            clearInterval(activeInterval);
            completeTaskSuccess(taskId);
        }
    }, 1000);
}

function completeTaskSuccess(taskId) {
    tasksState.currentRunning = false;
    balance += 43;
    tasksState.done++;
    updateBalance();
    
    const card = document.getElementById(`task-item-${taskId}`);
    card.classList.add('completed');
    card.style.pointerEvents = "none";
    card.style.opacity = "0.6";
    document.getElementById(`icon-${taskId}`).textContent = "✅";
    document.getElementById(`status-text-${taskId}`).textContent = "تم بنجاح";
    document.getElementById(`status-text-${taskId}`).style.color = "var(--green)";
    
    addTransaction(`مهمة ${taskId} مكتملة`, 43, true);
    closeModalDirect();
    showToast("✅ تم إضافة الربح لحسابك");
}

function cancelTask(taskId) {
    if(activeInterval) clearInterval(activeInterval);
    tasksState.currentRunning = false;
    tasksState.failed++;
    
    const card = document.getElementById(`task-item-${taskId}`);
    card.classList.add('failed');
    card.style.pointerEvents = "none";
    card.style.opacity = "0.5";
    card.style.border = "1px solid var(--red)";
    
    document.getElementById(`icon-${taskId}`).textContent = "❌";
    document.getElementById(`status-text-${taskId}`).textContent = "مهمة ملغاة (مفقودة)";
    document.getElementById(`status-text-${taskId}`).style.color = "var(--red)";
    document.getElementById(`reward-val-${taskId}`).style.display = "none";
    
    closeModalDirect();
    showToast("⚠️ تم إلغاء المهمة وخسارة الربح اليومي");
}

function openModalDirect() { document.getElementById('modal').classList.add('open'); }
function closeModalDirect() { 
    if(tasksState.currentRunning) {
        if(confirm("إذا أغلقت الآن ستفشل المهمة. هل أنت متأكد؟")) {
            // نجد الـ Task ID الحالي برمجياً أو نمنع الإغلاق
        } else { return; }
    }
    document.getElementById('modal').classList.remove('open'); 
}

// تشغيل النظام عند التحميل
window.onload = () => {
    buildTasks();
    updateBalance();
};
</script>
