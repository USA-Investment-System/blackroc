<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Investment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #f9e295 50%, #b38728 100%); }
        .card { background: #161616; border: 1px solid #262626; border-radius: 15px; }
        .glow { box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body class="p-4">

    <div class="flex justify-between items-center mb-8 mt-4">
        <div>
            <h1 class="text-2xl font-bold text-white leading-tight">نظام الاستثمار الأمريكي</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest">USA Investment System</p>
        </div>
        <div class="w-12 h-12 rounded-full gold-gradient flex items-center justify-center shadow-lg">
            <span class="text-black font-bold text-xl">U</span>
        </div>
    </div>

    <div class="card p-6 mb-6 glow relative overflow-hidden">
        <div class="absolute top-0 right-0 w-24 h-24 gold-gradient opacity-10 rounded-full -mr-10 -mt-10"></div>
        <p class="text-gray-400 text-sm mb-1">إجمالي الرصيد المتاح</p>
        <h2 class="text-4xl font-bold text-white mb-4">$42,550.<span class="text-sm">00</span></h2>
        <div class="flex gap-2">
            <span class="bg-green-900/30 text-green-400 text-xs px-2 py-1 rounded">+12.5% اليوم</span>
            <span class="bg-blue-900/30 text-blue-400 text-xs px-2 py-1 rounded">حساب نشط</span>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="card p-4 text-center">
            <p class="text-gray-500 text-xs mb-1">الأرباح الشهرية</p>
            <p class="text-lg font-semibold text-white">+$5,200</p>
        </div>
        <div class="card p-4 text-center">
            <p class="text-gray-500 text-xs mb-1">المشاريع النشطة</p>
            <p class="text-lg font-semibold text-white">14 مشروع</p>
        </div>
    </div>

    <h3 class="text-white font-bold mb-4">إدارة الاستثمارات</h3>
    <div class="space-y-3">
        <button class="w-full gold-gradient text-black font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform">
            إضافة استثمار جديد
        </button>
        <button class="w-full card text-white font-semibold py-4 rounded-xl active:scale-95 transition-transform border-gray-700">
            سحب الأرباح إلى Binance
        </button>
    </div>

    <div class="mt-10 pt-6 border-t border-gray-800 text-center">
        <div class="inline-flex items-center gap-2">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <p class="text-gray-500 text-xs italic">النظام محمي ومؤمن بالكامل - 2026</p>
        </div>
    </div>

</body>
</html>
