<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena | BlackRock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { background-color: #0d0d0d; color: #f3f3f3; font-family: 'Tajawal', sans-serif; padding-bottom: 70px; }
        .gold-primary { color: #f7bf28; }
        .bg-gold-btn { background: linear-gradient(90deg, #f7bf28 0%, #dab44f 100%); }
        .card-dark { background-color: #171717; border-radius: 12px; border: 1px solid #262626; }
        .tab-bar { background-color: #171717; border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; right: 0; z-index: 100; }
        .nav-item { color: #a3a3a3; }
        .nav-item.active { color: #f7bf28; }
        .green-status { color: #2ecc71; }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
    </style>
</head>
<body class="p-4">

    <div class="flex justify-between items-center mb-6 mt-2 text-xs text-neutral-400">
        <span>Arena | Ben...</span>
        <div class="flex items-center gap-1">
            <span class="w-3 h-3 bg-neutral-700 rounded-full"></span>
            <span>22:00</span>
        </div>
    </div>

    <div class="text-center mb-10 mt-6">
        <h1 class="text-4xl font-bold uppercase gold-primary tracking-wider">BlackRock</h1>
        <p class="text-xs text-neutral-400 mt-1">منصة الاستثمار</p>
    </div>

    <div class="space-y-5 px-3 mb-10">
        <div class="space-y-1">
            <label class="text-neutral-300 text-sm">اسم المستخدم</label>
            <input type="text" placeholder="اسم المستخدم" class="w-full card-dark p-4 text-sm text-neutral-200 placeholder-neutral-600 focus:outline-none focus:ring-1 focus:ring-gold-primary">
        </div>
        <div class="space-y-1">
            <label class="text-neutral-300 text-sm">كلمة المرور</label>
            <div class="relative">
                <input type="password" placeholder="كلمة المرور" class="w-full card-dark p-4 text-sm text-neutral-200 placeholder-neutral-600 focus:outline-none focus:ring-1 focus:ring-gold-primary">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-600">👁️</span>
            </div>
        </div>
        <button class="w-full bg-gold-btn text-black font-bold py-4 rounded-xl text-lg mt-4 active:scale-95 transition-transform">
            تسجيل الدخول
        </button>
        <div class="text-center mt-4">
            <a href="#" class="text-neutral-400 text-sm">ليس لديك حساب؟ <span class="gold-primary font-medium">سجل مجاناً</span></a>
        </div>
    </div>

    <div class="card-dark p-5 flex items-start gap-4 mb-8">
        <span class="text-3xl green-status">🛡️</span>
        <div>
            <h4 class="text-white font-bold text-sm">Platform Security</h4>
            <p class="text-xs text-neutral-400">عقد رسمي: يناير 2025 - ديسمبر 2027</p>
            <p class="text-xs text-neutral-400">AES-256 + SSL/TLS 3.0</p>
        </div>
    </div>

    <div class="tab-bar p-3 grid grid-cols-4 text-center">
        <div class="nav-item active flex flex-col items-center">
            <span class="text-xl">🏠</span>
            <span class="text-xs mt-1">الرئيسية</span>
        </div>
        <div class="nav-item flex flex-col items-center">
            <span class="text-xl">⚡</span>
            <span class="text-xs mt-1">المهام</span>
        </div>
        <div class="nav-item flex flex-col items-center">
            <span class="text-xl">📈</span>
            <span class="text-xs mt-1">الترقية</span>
        </div>
        <div class="nav-item flex flex-col items-center">
            <span class="text-xl">👤</span>
            <span class="text-xs mt-1">حسابی</span>
        </div>
    </div>

</body>
</html>
