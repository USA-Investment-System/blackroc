<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlackRock Investment Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050810; overflow: hidden; color: white; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(255, 193, 7, 0.3); } 50% { box-shadow: 0 0 40px rgba(255, 193, 7, 0.6); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes count-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes progress-fill { from { width: 0%; } to { width: 100%; } }
        @keyframes glow-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        
        .slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in { animation: fade-in 0.3s ease-out; }
        .pulse-glow { animation: pulse-glow 2s infinite; }
        .float { animation: float 3s ease-in-out infinite; }
        .spin-slow { animation: spin 8s linear infinite; }
        .bounce { animation: bounce 2s infinite; }
        .shake { animation: shake 0.5s; }
        .count-up { animation: count-up 0.5s ease-out; }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(20, 25, 45, 0.95), rgba(15, 20, 35, 0.98));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .gold-gradient {
            background: linear-gradient(135deg, #FFD700, #FFA000, #FF8F00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .green-glow {
            background: linear-gradient(135deg, #00E676, #00C853);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }
        
        .btn-press:active { transform: scale(0.97); }
        
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #FFD700 0deg 51.4deg,
                #FF6F00 51.4deg 102.8deg,
                #FFD700 102.8deg 154.2deg,
                #FF6F00 154.2deg 205.6deg,
                #FFD700 205.6deg 257deg,
                #FF6F00 257deg 308.4deg,
                #FFD700 308.4deg 360deg
            );
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1a1f3a, #0a0e1a);
            border-radius: 50%;
            border: 3px solid #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #FF1744;
            z-index: 20;
            filter: drop-shadow(0 0 10px rgba(255, 23, 68, 0.5));
        }
        
        .secure-badge {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.15), rgba(0, 200, 83, 0.08));
            border: 1px solid rgba(0, 230, 118, 0.25);
        }
        
        .level-card {
            background: linear-gradient(135deg, rgba(20, 25, 45, 0.95), rgba(15, 20, 35, 0.98));
            border: 1px solid rgba(255, 193, 7, 0.15);
        }
        
        .level-card.locked {
            border-color: rgba(239, 68, 68, 0.2);
            opacity: 0.75;
        }
        
        .invest-btn {
            background: linear-gradient(135deg, #FF8F00, #FF6F00, #FF5722);
            box-shadow: 0 4px 20px rgba(255, 143, 0, 0.4), 0 0 40px rgba(255, 143, 0, 0.1);
        }
        
        .nav-item { position: relative; }
        .nav-item.active { color: #FFD700; }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: linear-gradient(90deg, #FFD700, #FFA000);
            border-radius: 2px;
        }
        
        .progress-bar-gold {
            background: linear-gradient(90deg, #FFD700, #FFA000, #FF8F00);
            height: 4px;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        
        .progress-bar-red {
            background: linear-gradient(90deg, #EF5350, #E53935);
            height: 4px;
            border-radius: 2px;
        }
        
        .notification-badge {
            background: linear-gradient(135deg, #FF1744, #D50000);
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.4);
        }
        
        .star-icon { filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5)); }
        
        .robot-float {
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 143, 0, 0.4));
        }
        
        .glow-text {
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.2);
        }
        
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        
        .task-timer {
            font-variant-numeric: tabular-nums;
        }
        
        .proof-card {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.1), rgba(0, 200, 83, 0.05));
            border: 1px solid rgba(0, 230, 118, 0.2);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#050810',
                        darker: '#030508',
                        card: '#14192d',
                        gold: '#FFD700',
                        goldDark: '#FFA000',
                        green: '#00E676',
                        red: '#EF5350'
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ==================== UTILS ====================
        const formatNumber = (num) => {
            if (!num || isNaN(num)) return '0';
            if (num >= 1000000000000) return (num / 1000000000000).toFixed(2) + 'T';
            if (num >= 1000000000) return (num / 1000000000).toFixed(2) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(2) + 'K';
            return num.toLocaleString('en-DZ');
        };

        const generateReferralCode = () => {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        };

        // ==================== ICONS ====================
        const Icon = ({ name, size = 24, className = '' }) => {
            const icons = {

                tasks: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
                diamond: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 3h12l4 6-10 13L2 9l4-6z"/><path d="M11 3 5 9l6 13V3z"/><path d="m13 22 6-13-6-6V22z"/><path d="m2 9 10 4 10-4"/></svg>,
                user: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
                robot: <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}><rect x="4" y="4" width="16" height="12" rx="2"/><circle cx="9" cy="9" r="1.5" fill="#050810"/><circle cx="15" cy="9" r="1.5" fill="#050810"/><rect x="8" y="14" width="8" height="2" rx="1"/><path d="M12 2v2" stroke="currentColor" strokeWidth="2"/><circle cx="12" cy="2" r="1"/><path d="M7 20h10" stroke="currentColor" strokeWidth="2"/></svg>,
                bell: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
                lock: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,

                close: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
                send: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/></svg>,

                share: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>,
                arrowUp: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m18 15-6-6-6 6"/></svg>,
                arrowLeft: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>,
                calendar: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,

                money: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
                building: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9h1"/><path d="M9 13h1"/><path d="M9 17h1"/></svg>,
                users: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
                rocket: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>,

                logout: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
                settings: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                shield: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
                info: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>,
                play: <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>,

                x: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
                gift: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 2.5 2.5v5"/><path d="M16.5 8v-2.5a2.5 2.5 0 0 1 5 0 2.5 2.5 0 0 1-2.5 2.5h-5"/></svg>,
                trend: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
                award: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
                globe: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
                phone: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
                mail: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>,
                file: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
                credit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" x2="23" y1="10" y2="10"/></svg>,
            };
            return icons[name] || null;
        };

        // ==================== TOAST ====================
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]);
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[100] fade-in">
                    <div className={`px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : type === 'warning' ? 'bg-orange-500' : 'bg-blue-500'} text-white font-bold text-sm`}>
                        {type === 'success' && <Icon name="check" size={16} />}
                        {message}
                    </div>
                </div>
            );
        };

        // ==================== BOTTOM SHEET ====================
        const BottomSheet = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[80] flex items-end" onClick={onClose}>
                    <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
                    <div className="relative w-full bg-[#0d1220] rounded-t-3xl slide-up max-h-[85vh] overflow-y-auto hide-scrollbar border-t border-white/10" onClick={e => e.stopPropagation()}>
                        <div className="sticky top-0 bg-[#0d1220] pt-4 pb-2 px-4 rounded-t-3xl z-10 border-b border-white/5">
                            <div className="w-12 h-1 bg-white/20 rounded-full mx-auto mb-4" />
                            {title && <h3 className="text-white font-bold text-lg mb-2 text-center">{title}</h3>}
                        </div>
                        <div className="p-4 pb-8">{children}</div>
                    </div>
                </div>

        // ==================== TASKS SCREEN ====================
        const TasksScreen = ({ user, onUpdateUser, onShowToast }) => {
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem(`br_tasks_${user.id}`);
                if (saved) return JSON.parse(saved);
                return [
                    { id: 1, name: 'مهمة يومية 1', reward: 43, status: 'available', completedAt: null, failedAt: null },
                    { id: 2, name: 'مهمة يومية 2', reward: 43, status: 'locked', completedAt: null, failedAt: null },
                    { id: 3, name: 'مهمة يومية 3', reward: 43, status: 'locked', completedAt: null, failedAt: null },
                    { id: 4, name: 'مهمة يومية 4', reward: 43, status: 'locked', completedAt: null, failedAt: null },
                    { id: 5, name: 'مهمة يومية 5', reward: 43, status: 'locked', completedAt: null, failedAt: null },
                ];
            });

            const [activeTask, setActiveTask] = useState(null);
            const [countdown, setCountdown] = useState(40);
            const [showCancelConfirm, setShowCancelConfirm] = useState(false);
            const [cancelTaskId, setCancelTaskId] = useState(null);

            // Save tasks to localStorage
            useEffect(() => {
                localStorage.setItem(`br_tasks_${user.id}`, JSON.stringify(tasks));
            }, [tasks, user.id]);

            // Check daily reset
            useEffect(() => {
                const today = new Date().toDateString();
                if (user.lastTaskReset !== today) {
                    const resetTasks = tasks.map(t => ({
                        ...t,
                        status: t.id === 1 ? 'available' : 'locked',
                        completedAt: null,
                        failedAt: null
                    }));
                    setTasks(resetTasks);
                    onUpdateUser({ lastTaskReset: today });
                    onShowToast('🌅 تم تجديد المهام اليومية!', 'success');
                }
            }, []);

            // Countdown timer
            useEffect(() => {
                let interval;
                if (activeTask && countdown > 0) {
                    interval = setInterval(() => {
                        setCountdown(c => {
                            if (c <= 1) {
                                completeTask();
                                return 0;
                            }
                            return c - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [activeTask, countdown]);

            const startTask = (taskId) => {
                // Check if previous task is completed
                const taskIndex = tasks.findIndex(t => t.id === taskId);
                if (taskIndex > 0 && tasks[taskIndex - 1].status !== 'completed') {
                    onShowToast('⚠️ أكمل المهمة السابقة أولاً!', 'warning');
                    return;
                }

                setActiveTask(taskId);
                setCountdown(40);
                setTasks(tasks.map(t => t.id === taskId ? { ...t, status: 'active' } : t));
                onShowToast('⏱️ المهمة بدأت! انتظر 40 ثانية...', 'info');
            };

            const completeTask = () => {
                const task = tasks.find(t => t.id === activeTask);
                if (task) {
                    const updatedTasks = tasks.map(t => {
                        if (t.id === activeTask) {
                            return { ...t, status: 'completed', completedAt: new Date().toISOString() };
                        }
                        if (t.id === activeTask + 1) {
                            return { ...t, status: 'available' };
                        }
                        return t;
                    });
                    
                    setTasks(updatedTasks);
                    onUpdateUser({ 
                        balance: (user.balance || 0) + task.reward,
                        taskBalance: (user.taskBalance || 0) + task.reward,
                        tasksCompleted: (user.tasksCompleted || 0) + 1,
                        totalEarned: (user.totalEarned || 0) + task.reward
                    });
                    onShowToast(`🎉 تم إكمال المهمة! ربحت ${task.reward} DZD`, 'success');
                }
                setActiveTask(null);
            };

            const cancelTask = (taskId) => {
                setCancelTaskId(taskId);
                setShowCancelConfirm(true);
            };

            const confirmCancel = () => {
                const updatedTasks = tasks.map(t => {
                    if (t.id === cancelTaskId) {
                        return { ...t, status: 'failed', failedAt: new Date().toISOString() };
                    }
                    return t;
                });
                setTasks(updatedTasks);
                setShowCancelConfirm(false);
                setActiveTask(null);
                setCancelTaskId(null);
                onShowToast('❌ تم إلغاء المهمة! ستُعاد غداً', 'error');
            };

            const getTaskProgress = (task) => {
                if (task.status === 'completed') return 100;
                if (task.status === 'active') return ((40 - countdown) / 40) * 100;
                return 0;
            };

            return (
                <div className="h-screen overflow-y-auto hide-scrollbar bg-[#050810] pb-28">
                    <div className="sticky top-0 z-40 bg-[#050810]/95 backdrop-blur-xl px-4 py-4 border-b border-white/5">
                        <h2 className="text-white font-bold text-xl text-center">⚡ المهام اليومية</h2>
                    </div>

                            <div className="glass-card rounded-xl p-4">
                                <p className="text-white/70 text-sm leading-relaxed text-center">
                                    تقر شركة <span className="text-green-400 font-bold">BlackRock, Inc</span> المسجلة في نيويورك بالولايات المتحدة الأمريكية عام <span className="text-yellow-400 font-bold">1988</span>، بأنها أبرمت عقداً رسمياً مع الجانب الجزائري في <span className="text-yellow-400 font-bold">يناير 2025</span> لمدة <span className="text-yellow-400 font-bold">3 سنوات</span> (تنتهي ديسمبر 2028).
                                </p>
                            </div>
                        </div>
                    </BottomSheet>

                    <BottomSheet isOpen={showCompany} onClose={() => setShowCompany(false)} title="🏢 معلومات الشركة">
                        <div className="space-y-3">
                            {[
                                { label: 'الاسم القانوني', value: 'BlackRock, Inc' },
                                { label: 'المقر الرئيسي', value: '🇺🇸 New York, USA' },
                                { label: 'سنة التأسيس', value: '1988' },
                                { label: 'المجال', value: 'إدارة الأصول والاستثمار' },
                                { label: 'عقد الجزائر', value: 'يناير 2025 ✅' },
                                { label: 'انتهاء العقد', value: 'ديسمبر 2028' },
                            ].map((item, i) => (
                                <div key={i} className="glass-card rounded-xl p-4 flex items-center justify-between">
                                    <span className="text-white/60 text-sm">{item.label}</span>
                                    <span className="text-white font-bold text-sm">{item.value}</span>
                                </div>
                            ))}
                            <button onClick={() => window.open('https://www.blackrock.com', '_blank')} className="w-full invest-btn text-white font-bold py-3 rounded-xl hover:opacity-90 transition-all">
                                🌐 الموقع الرسمي
                            </button>
                        </div>
                    </BottomSheet>

                    <BottomSheet isOpen={showSettings} onClose={() => setShowSettings(false)} title="⚙️ الإعدادات">
                        <div className="space-y-3">
                            <div className="glass-card rounded-xl p-4">
                                <h4 className="text-white font-bold mb-3">معلومات الحساب</h4>
                                <div className="space-y-3">
                                    <div className="flex justify-between">
                                        <span className="text-white/60 text-sm">اسم المستخدم</span>
                                        <span className="text-white text-sm font-bold">{user.username}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-white/60 text-sm">الرصيد</span>
                                        <span className="text-yellow-400 text-sm font-bold">{formatNumber(user.balance)} DZD</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-white/60 text-sm">الإحالات</span>
                                        <span className="text-white text-sm font-bold">{user.teamCount || 0}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-white/60 text-sm">تاريخ الانضمام</span>
                                        <span className="text-white text-sm">{new Date(user.joinedAt).toLocaleDateString('ar-DZ')}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <button onClick={() => { localStorage.clear(); onShowToast('تم مسح جميع البيانات', 'success'); window.location.reload(); }} className="w-full glass-card rounded-xl p-4 text-red-400 font-bold hover:bg-red-500/10 transition-all border border-red-500/20">
                                🗑️ مسح جميع البيانات
                            </button>
                        </div>
                    </BottomSheet>

                    <LuckyWheel isOpen={showWheel} onClose={() => setShowWheel(false)} user={user} onUpdateUser={onUpdateUser} onShowToast={onShowToast} />
                </div>
            );
        };

        // ==================== MAIN APP ====================
        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('home');
            const [toast, setToast] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                const saved = localStorage.getItem('br_current');
                if (saved) {
                    try { setUser(JSON.parse(saved)); } catch (e) {}
                }
                setTimeout(() => setIsLoading(false), 1500);
            }, []);

            useEffect(() => {
                if (user) {
                    localStorage.setItem('br_current', JSON.stringify(user));
                    const users = JSON.parse(localStorage.getItem('br_users') || '[]');
                    const updated = users.map(u => u.id === user.id ? user : u);
                    localStorage.setItem('br_users', JSON.stringify(updated));
                }
            }, [user]);

            const showToast = (message, type = 'info') => setToast({ message, type });
            
            const updateUser = (updates) => {
                setUser(prev => {
                    const updated = { ...prev, ...updates };
                    return updated;
                });
            };

            const handleLogin = (userData) => setUser(userData);

            const handleLogout = () => {
                localStorage.removeItem('br_current');
                setUser(null);
                setActiveTab('home');
                showToast('تم تسجيل الخروج بنجاح', 'success');
            };

            if (isLoading) {
                return (
                    <div className="h-screen bg-[#050810] flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-24 h-24 bg-gradient-to-br from-yellow-400 via-orange-500 to-red-500 rounded-3xl mx-auto mb-6 flex items-center justify-center animate-pulse shadow-2xl shadow-orange-500/30">
                                <Icon name="diamond" size={50} className="text-white" />
                            </div>
                            <h1 className="text-3xl font-black gold-gradient mb-2">BLACKROCK</h1>
                            <p className="text-white/40 text-sm">جاري التحميل...</p>
                            <div className="mt-4 w-48 h-1 bg-white/10 rounded-full mx-auto overflow-hidden">
                                <div className="h-full bg-gradient-to-r from-yellow-400 to-orange-500 rounded-full animate-pulse" style={{ width: '60%' }}></div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <AuthScreen onLogin={handleLogin} onShowToast={showToast} />;
            }

            const tabs = [
                { id: 'home', icon: 'home', label: 'الرئيسية', badge: 0 },
                { id: 'tasks', icon: 'tasks', label: 'المهام', badge: 5 },
                { id: 'upgrade', icon: 'diamond', label: 'الترقية', badge: 0 },
                { id: 'profile', icon: 'user', label: 'حسابي', badge: 0 },
            ];

            const renderContent = () => {
                switch(activeTab) {
                    case 'home': return <HomeScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} onNavigate={setActiveTab} />;
                    case 'tasks': return <TasksScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} />;
                    case 'upgrade': return <UpgradeScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} />;
                    case 'profile': return <ProfileScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} onLogout={handleLogout} />;
                    default: return <HomeScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} onNavigate={setActiveTab} />;
                }
            };

            return (
                <div className="relative h-screen w-full max-w-md mx-auto bg-[#050810] overflow-hidden shadow-2xl">
                    {renderContent()}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* Bottom Navigation */}
                    <div className="absolute bottom-0 left-0 right-0 bg-[#050810]/95 backdrop-blur-xl border-t border-white/5 z-50">
                        <div className="flex justify-around items-center py-2">
                            {tabs.map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`nav-item relative flex flex-col items-center gap-1 p-2 transition-all ${activeTab === tab.id ? 'active' : 'text-white/40 hover:text-white/70'}`}
                                >
                                    <div className="relative">
                                        <Icon name={tab.icon} size={24} />
                                        {tab.badge > 0 && (
                                            <span className="absolute -top-2 -right-2 w-5 h-5 notification-badge rounded-full text-white text-[10px] font-bold flex items-center justify-center animate-pulse">
                                                {tab.badge}
                                            </span>
                                        )}
                                    </div>
                                    <span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="h-1.5 bg-[#050810]"></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
