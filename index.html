<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020509">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BlackRock — Investment Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   BLACKROCK v5 — DESIGN SYSTEM
══════════════════════════════════════ */
:root{
  --bg:#020509;
  --bg2:#040810;
  --bg3:#070c18;
  --c1:#0a1020;
  --c2:#0d1428;
  --gold:#D4AF37;
  --gold2:#C9992C;
  --gold3:#B8860B;
  --goldL:#E8CC6A;
  --white:#FFFFFF;
  --gray1:rgba(255,255,255,.85);
  --gray2:rgba(255,255,255,.55);
  --gray3:rgba(255,255,255,.28);
  --gray4:rgba(255,255,255,.1);
  --gray5:rgba(255,255,255,.05);
  --grn:#22C55E;
  --red:#EF4444;
  --blu:#3B82F6;
  --border:rgba(212,175,55,.15);
  --border2:rgba(255,255,255,.06);
  --sh:0 4px 24px rgba(0,0,0,.6);
}
*{font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--white);}
#root{height:100%;display:flex;justify-content:center;align-items:center;}
.app{width:100%;max-width:420px;height:100%;position:relative;overflow:hidden;background:var(--bg);}

/* Scrollable areas */
.scr,.sh,.auth-s{-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.scr::-webkit-scrollbar,.sh::-webkit-scrollbar,.auth-s::-webkit-scrollbar{display:none;}
.scr{position:absolute;top:0;left:0;right:0;bottom:72px;overflow-y:auto;overflow-x:hidden;}
.auth-s{position:absolute;inset:0;overflow-y:auto;}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes sheetUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes tdot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes countUp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes borderGlow{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}50%{box-shadow:0 0 20px 4px rgba(212,175,55,.3)}}
@keyframes progressBar{from{width:0}to{width:100%}}
@keyframes loadProg{from{width:0}to{width:75%}}

.fu{animation:fadeUp .25s cubic-bezier(.16,1,.3,1) both;}
.fi{animation:fadeIn .2s ease both;}
.floatY{animation:floatY 3s ease-in-out infinite;}
.pulse{animation:pulse 2s infinite;}
.cUp{animation:countUp .35s cubic-bezier(.34,1.56,.64,1) both;}

/* ── Typography ── */
.t-hero{font-family:'Montserrat',sans-serif;font-weight:900;font-size:28px;letter-spacing:3px;}
.t-lg{font-size:18px;font-weight:800;}
.t-md{font-size:15px;font-weight:700;}
.t-sm{font-size:12px;font-weight:600;}
.t-xs{font-size:10.5px;font-weight:600;}
.money{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-.5px;}

/* ── Gold gradient text ── */
.gt{background:linear-gradient(135deg,#E8CC6A,#D4AF37,#C9992C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ── Cards ── */
.card{
  background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));
  border:1px solid var(--border2);
  border-radius:16px;
}
.card-gold{border-color:var(--border);}
.card-glow{box-shadow:0 0 0 1px rgba(212,175,55,.12),0 8px 32px rgba(0,0,0,.5);}

/* ── Gold shimmer card ── */
.shimmer-card{
  background:linear-gradient(160deg,rgba(15,22,42,.98),rgba(10,16,32,.99));
  border:1px solid rgba(212,175,55,.18);
  border-radius:16px;
  position:relative;
  overflow:hidden;
}
.shimmer-card::before{
  content:'';
  position:absolute;
  top:0;left:-100%;width:80%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.05),transparent);
  animation:shimmer 3s infinite;
}

/* ── Buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:800;border-radius:12px;padding:13px 16px;font-size:14px;width:100%;transition:transform .1s,opacity .1s;position:relative;overflow:hidden;}
.btn:active{transform:scale(.97);opacity:.88;}
.btn-primary{
  background:linear-gradient(135deg,#D4AF37,#C9992C,#B8860B);
  color:#020509;
  box-shadow:0 4px 20px rgba(212,175,55,.3),inset 0 1px 0 rgba(255,255,255,.15);
}
.btn-secondary{background:rgba(255,255,255,.07);border:1px solid var(--border2);color:var(--white);}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#EF4444;}
.btn-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:#22C55E;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--gold);}

/* ── Nav ── */
.nav{
  position:absolute;bottom:0;left:0;right:0;height:72px;
  background:rgba(2,5,9,.96);
  border-top:1px solid rgba(212,175,55,.1);
  display:flex;justify-content:space-around;align-items:center;
  z-index:100;
  backdrop-filter:blur(20px);
}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;color:var(--gray3);padding:4px 14px;position:relative;}
.nb.on{color:var(--gold);}
.nb.on::after{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:20px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:0 0 2px 2px;}
.nl{font-size:10px;font-weight:700;margin-top:1px;}
.bdg{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:var(--red);border-radius:8px;border:2px solid var(--bg);font-size:8.5px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ── Input ── */
.inp{background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:12px;color:var(--white);padding:13px 16px;font-size:14px;font-family:'Tajawal',sans-serif;font-weight:700;outline:none;width:100%;transition:border-color .2s;}
.inp:focus{border-color:rgba(212,175,55,.5);background:rgba(255,255,255,.07);}
.inp::placeholder{color:var(--gray3);}

/* ── Sheet ── */
.sho{position:fixed;inset:0;background:rgba(2,5,9,.85);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;}
.sh{
  background:linear-gradient(180deg,rgba(10,16,32,1),rgba(4,8,16,1));
  border-radius:24px 24px 0 0;
  border-top:1px solid rgba(212,175,55,.15);
  border-left:1px solid var(--border2);
  border-right:1px solid var(--border2);
  width:100%;max-height:92vh;
  overflow-y:auto;
  animation:sheetUp .3s cubic-bezier(.16,1,.3,1);
}

/* ── Badges ── */
.badge-gold{background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(201,153,44,.1));border:1px solid rgba(212,175,55,.3);border-radius:100px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;}
.badge-green{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);border-radius:100px;padding:3px 10px;}
.badge-red{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:100px;padding:3px 10px;}

/* ── Stats ── */
.stat-card{
  background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));
  border:1px solid var(--border2);
  border-radius:14px;padding:12px 8px;text-align:center;
}

/* ── Progress ── */
.prog{background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.pg{height:100%;border-radius:4px;transition:width .4s ease;}
.pg-gold{background:linear-gradient(90deg,#D4AF37,#C9992C);}
.pg-green{background:linear-gradient(90deg,#22C55E,#16A34A);}
.pg-red{background:linear-gradient(90deg,#EF4444,#DC2626);}
.pg-blue{background:linear-gradient(90deg,#3B82F6,#2563EB);}

/* ── Task cards ── */
.tc{border-radius:14px;padding:13px;margin-bottom:8px;transition:border-color .2s,background .2s;}
.tc-a{border-color:rgba(212,175,55,.25)!important;}
.tc-r{border-color:rgba(212,175,55,.5)!important;background:linear-gradient(135deg,rgba(22,17,3,.5),rgba(7,12,24,.99))!important;}
.tc-d{border-color:rgba(34,197,94,.3)!important;background:linear-gradient(135deg,rgba(0,20,10,.3),rgba(7,12,24,.99))!important;}
.tc-f{border-color:rgba(239,68,68,.2)!important;opacity:.7;}

/* ── Level cards ── */
.lvc{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));border:1px solid rgba(212,175,55,.1);border-radius:14px;padding:13px;margin-bottom:9px;}
.lvc.lk{border-color:rgba(239,68,68,.08);opacity:.65;}
.lvc.cu{border-color:rgba(34,197,94,.35);background:linear-gradient(160deg,rgba(0,25,12,.25),rgba(7,12,24,.99));}

/* ── AI chat ── */
.bai{background:rgba(10,16,32,.97);border:1px solid var(--border2);border-radius:14px;border-top-left-radius:4px;padding:10px 13px;max-width:84%;font-size:12.5px;line-height:1.7;color:var(--gray1);white-space:pre-wrap;}
.bu{background:linear-gradient(135deg,#D4AF37,#C9992C);border-radius:14px;border-top-right-radius:4px;padding:10px 13px;max-width:84%;font-size:12.5px;line-height:1.7;color:#020509;font-weight:700;white-space:pre-wrap;}
.tdd span{display:inline-block;width:6px;height:6px;background:var(--gray3);border-radius:50%;margin:0 2px;}
.tdd span:nth-child(1){animation:tdot 1.2s 0s infinite ease}
.tdd span:nth-child(2){animation:tdot 1.2s .2s infinite ease}
.tdd span:nth-child(3){animation:tdot 1.2s .4s infinite ease}

/* ── FAB ── */
.fab{position:absolute;bottom:80px;left:12px;z-index:99;width:50px;height:50px;background:linear-gradient(135deg,#D4AF37,#C9992C);border-radius:15px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 6px 24px rgba(212,175,55,.4);}
.fdot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;background:var(--grn);border-radius:50%;border:2.5px solid var(--bg);animation:dp 1.5s infinite;}

/* ── Avatar ── */
.avr{background:linear-gradient(135deg,#D4AF37,#C9992C,#B8860B);padding:2.5px;border-radius:50%;display:inline-block;}

/* ── Wheel ── */
.wo{width:268px;height:268px;border-radius:50%;position:relative;box-shadow:0 0 60px rgba(212,175,55,.2);}
.wp{position:absolute;top:-12px;left:50%;transform:translateX(-50%);border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #EF4444;z-index:10;filter:drop-shadow(0 0 6px rgba(239,68,68,.6));}
.wh{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:linear-gradient(135deg,#08101e,#02050a);border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 16px rgba(212,175,55,.35);}

/* ── Toast ── */
.toast-el{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:800;color:#fff;white-space:nowrap;max-width:88vw;text-overflow:ellipsis;overflow:hidden;display:none;animation:fadeUp .18s ease;}

/* ── Save indicator ── */
.sv{position:fixed;top:12px;right:12px;z-index:9998;font-size:9.5px;font-weight:800;color:var(--grn);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:100px;padding:2px 8px;opacity:0;transition:opacity .3s;}
.sv.on{opacity:1;}

/* ── Header logo area ── */
.hdr-logo{
  display:flex;align-items:center;gap:8px;
}
.hdr-logo .logo-icon{
  width:32px;height:32px;
  background:linear-gradient(135deg,#D4AF37,#B8860B);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}

/* ── Market ticker ── */
.ticker{
  background:rgba(212,175,55,.06);
  border-bottom:1px solid rgba(212,175,55,.08);
  padding:6px 14px;
  display:flex;gap:16px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.ticker::-webkit-scrollbar{display:none;}
.tick-item{display:flex;align-items:center;gap:5px;flex-shrink:0;}

/* ── Join card ── */
.join-card{
  background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(201,153,44,.07));
  border:1.5px solid rgba(212,175,55,.35);
  border-radius:16px;padding:18px;text-align:center;margin-bottom:18px;
  animation:borderGlow 3s infinite;
}

/* ── Divider ── */
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:12px 0;}

/* ── Section header ── */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sec-ttl{font-size:15px;font-weight:800;color:var(--white);}
.sec-link{font-size:11.5px;font-weight:700;color:var(--gold);cursor:pointer;background:none;border:none;}
</style>
</head>
<body>
<div id="root"><div class="app" id="app"></div></div>
<div class="toast-el" id="toast"></div>
<div class="sv" id="sv">محفوظ ✓</div>

<script>
// ════════════════════════════════════════════
//  BLACKROCK v5 — Professional App
// ════════════════════════════════════════════

// ── Storage ──
let _svT;
const DB={
  g(k){try{const v=localStorage.getItem('br5_'+k);return v?JSON.parse(v):null;}catch{return null;}},
  s(k,v){
    try{localStorage.setItem('br5_'+k,JSON.stringify(v));}catch{}
    clearTimeout(_svT);
    const el=document.getElementById('sv');
    if(el){el.classList.add('on');_svT=setTimeout(()=>el.classList.remove('on'),1500);}
  },
  d(k){try{localStorage.removeItem('br5_'+k);}catch{}}
};

// ── App State ──
const S={
  user:null,tab:'home',
  activeTask:null,cdVal:40,cdTimer:null,tasks:null,
  sheetEl:null,wheelRot:0,wheelSpinning:false,
  aiMsgs:[],aiTyping:false,joinCode:null,
  mktTick:0
};

// ── Utils ──
function fmt(n){n=parseFloat(n)||0;if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDZD(n){return fmt(n)+' DZD';}
function genCode(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');}
function today(){return new Date().toDateString();}
function $(id){return document.getElementById(id);}
function now(){return new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});}
function detectRef(){const h=location.hash;if(h.includes('ref='))S.joinCode=h.split('ref=')[1]?.split('&')[0]||null;const p=new URLSearchParams(location.search);if(p.get('ref'))S.joinCode=p.get('ref');}

// ── Toast ──
let _tt;
function toast(msg,type='info'){
  clearTimeout(_tt);
  const c={success:'#16A34A',error:'#DC2626',warning:'#D97706',info:'#1D4ED8'};
  const ic={success:'✓',error:'✗',warning:'⚠',info:'ℹ'};
  const el=$('toast');if(!el)return;
  el.style.cssText=`position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:800;color:#fff;background:${c[type]||c.info};display:block;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fadeUp .18s ease;`;
  el.textContent=ic[type]+' '+msg;
  _tt=setTimeout(()=>{el.style.display='none';},2800);
}

// ── User management ──
function saveUser(){
  if(!S.user)return;
  DB.s('cur',S.user);
  const users=DB.g('users')||[];
  const i=users.findIndex(u=>u.id===S.user.id);
  if(i>=0)users[i]=S.user;else users.push(S.user);
  DB.s('users',users);
}
function upd(ch){Object.assign(S.user,ch);saveUser();}

// ── Tasks ──
function loadTasks(){
  const saved=DB.g('tk_'+S.user.id);
  if(saved&&saved.date===today())return saved.tasks;
  const t=[1,2,3,4,5].map(id=>({id,status:'available'}));
  DB.s('tk_'+S.user.id,{date:today(),tasks:t});
  return t;
}
function saveTasks(){DB.s('tk_'+S.user.id,{date:today(),tasks:S.tasks});}

// ── Levels ──
const LVS=[
  {id:'trial',n:'Starter Trial',p:0,d:3,dy:43,tot:215,mo:'—'},
  {id:'m1',n:'M1 — Basic',p:7000,d:5,dy:43,tot:215,mo:6450},
  {id:'m2',n:'M2 — Standard',p:26600,d:10,dy:86,tot:860,mo:25800},
  {id:'m3',n:'M3 — Advanced',p:95000,d:25,dy:131,tot:3275,mo:98250},
  {id:'m4',n:'M4 — Premium',p:300000,d:50,dy:222,tot:11100,mo:333000},
  {id:'m5',n:'M5 — Elite',p:780000,d:80,dy:390,tot:31200,mo:936000},
  {id:'m6',n:'M6 — Executive',p:1950000,d:130,dy:652,tot:84760,mo:2542800},
  {id:'g7',n:'G7 — Platinum',p:4485000,d:200,dy:1068,tot:213600,mo:6408000},
];
function lvN(id){return LVS.find(l=>l.id===id)?.n||'Starter Trial';}

// ── Market data (simulated) ──
const MARKETS=[
  {sym:'BLK',name:'BlackRock',val:865.42,chg:+1.24},
  {sym:'DZD/USD',name:'الدينار',val:134.20,chg:-0.15},
  {sym:'GOLD',name:'الذهب',val:2342.80,chg:+0.82},
  {sym:'S&P 500',name:'S&P 500',val:5248.49,chg:+0.45},
];

// ── AI ──
const KB=[
  {k:['مرحبا','هلا','اهلا','السلام','hello','hi'],r:`أهلاً وسهلاً بك في BlackRock! 🌟\n\nأنا مساعدك الذكي المالي المتخصص. يمكنني مساعدتك في:\n\n📈 استراتيجيات الاستثمار\n💰 حساب أرباحك اليومية\n🏢 معلومات الشركة والعقد الرسمي\n🎯 نظام الإحالات ومضاعفة الدخل\n⏱️ نظام المهام اليومية\n💳 السحب والمعاملات\n\nما الذي تودّ معرفته؟`},
  {k:['شركة','blackrock','بلاك','عن التطبيق'],r:`🏢 BlackRock, Inc\n\nالشركة الأولى عالمياً في إدارة الأصول:\n\n• تأسست: 1988، نيويورك\n• الأصول المُدارة: 10.2 تريليون دولار\n• التداول: NYSE — رمز BLK\n• EIN: 32-0174431\n• التواجد: 38 دولة، +19,000 موظف\n\n🇩🇿 عقد الجزائر الرسمي:\n• بدء: يناير 2025\n• انتهاء: ديسمبر 2027 (3 سنوات)\n• مسجّل رسمياً لدى السلطات الجزائرية\n\n🛡️ الأمان:\n• تشفير AES-256 + SSL/TLS 3.0\n• أموالك محمية 100%`},

  sh.innerHTML=`<div style="width:40px;height:4px;background:rgba(212,175,55,.2);border-radius:2px;margin:14px auto 10px"></div>${title?`<div style="text-align:center;font-size:16px;font-weight:800;color:var(--white);padding:0 16px 12px;border-bottom:1px solid var(--border2)">${title}</div>`:''}<div style="padding:16px 16px 50px">${html}</div>`;

}

window.startTask=function(id){
  if(S.activeTask!==null){toast('هناك مهمة جارية!','warning');return;}
  const t=S.tasks.find(x=>x.id===id);if(!t||t.status!=='available')return;
  t.status='active';S.activeTask=id;S.cdVal=40;saveTasks();render();
  toast('⏱️ Task started! Wait 40 seconds...','info');
  S.cdTimer=setInterval(()=>{
    S.cdVal--;
    const cd=$('cd-'+id),cb=$('cb-'+id);
    if(cd)cd.textContent=S.cdVal;
    if(cb)cb.style.width=((40-S.cdVal)/40*100)+'%';
    if(S.cdVal<=0){clearInterval(S.cdTimer);S.cdTimer=null;completeTask(id);}
  },1000);
};
function completeTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.status='done';S.activeTask=null;saveTasks();
  upd({balance:(S.user.balance||0)+43,taskBal:(S.user.taskBal||0)+43,totalEarned:(S.user.totalEarned||0)+43});

}

window.spinWheel=function(){
  if(S.wheelSpinning||(S.user.wheelSpins||0)<=0)return;
  S.wheelSpinning=true;
  const btn=$('w-btn');btn.textContent='🎡 Spinning...';btn.disabled=true;
  const add=1800+Math.random()*1800,nr=S.wheelRot+add;
  const el=$('wheel-el');
  el.style.transition='transform 4s cubic-bezier(.17,.67,.12,.99)';
  el.style.transform=`rotate(${nr}deg)`;
  S.wheelRot=nr;
  setTimeout(()=>{
    const seg=360/7,wi=Math.floor(((360-(nr%360))+seg/2)%360/seg)%7,prize=WP[wi];
    S.wheelSpinning=false;
    const ns=Math.max(0,(S.user.wheelSpins||0)-1);
    if(prize.v>0){upd({balance:(S.user.balance||0)+prize.v,totalEarned:(S.user.totalEarned||0)+prize.v,wheelSpins:ns});toast('🎉 Won '+prize.v+' DZD!','success');}
    else{upd({wheelSpins:ns+1});toast('🎁 Extra free spin!','warning');}
    const res=$('w-result');
    if(res)res.innerHTML=`<div class="shimmer-card" style="border-radius:12px;padding:12px 20px;text-align:center;width:100%"><div style="color:var(--gray3);font-size:11px;font-family:Montserrat,sans-serif;margin-bottom:3px">PRIZE</div><div class="money gt" style="font-size:26px">${prize.v>0?'+'+prize.v+' DZD':prize.l}</div></div>`;
    const sw=$('w-spins');if(sw)sw.textContent=S.user.wheelSpins||0;
    if(btn){btn.textContent=(S.user.wheelSpins||0)>0?'🎯 SPIN AGAIN':'No Spins Left';btn.disabled=(S.user.wheelSpins||0)<=0;}
    render();
  },4100);
};

      <button onclick="$('ai-screen')?.remove()" style="width:36px;height:36px;background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray3)">${I.x}</button>
      <div style="text-align:center">
        <div style="font-family:Montserrat,sans-serif;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:1.5px">AI ASSISTANT</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px"><span style="width:6px;height:6px;background:var(--grn);border-radius:50%;animation:dp 1.5s infinite"></span><span style="color:var(--grn);font-size:10px;font-weight:700">Online</span></div>
      </div>
      <div style="width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--bg)">${I.robot}</div>
    </div>
    <div id="ai-msgs" style="flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch"></div>
    <div style="flex-shrink:0;padding:7px 13px 0;border-top:1px solid rgba(212,175,55,.06)">
      <div id="ai-q" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;-webkit-overflow-scrolling:touch"></div>
      <div style="display:flex;gap:7px;align-items:center;padding-bottom:14px">
        <input class="inp" id="ai-inp" placeholder="Ask me anything..." style="flex:1;border-radius:11px;padding:10px 13px;font-size:12.5px" onkeydown="if(event.key==='Enter')sendAI()">
        <button onclick="sendAI()" style="width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold),var(--gold2));flex-shrink:0;color:var(--bg)">${I.send}</button>
      </div>
    </div>
  `;
  document.body.appendChild(ov);
  renderAIMsgs();
  const q=$('ai-q');
  if(q)q.innerHTML=['كيف أربح؟','عن الشركة','المهام','الإحالات','الأمان','عجلة الحظ'].map(t=>`<button onclick="quickAI('${t}')" style="padding:4px 11px;background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.15);border-radius:100px;color:var(--gold);font-size:10.5px;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:Tajawal,sans-serif">${t}</button>`).join('');
}
window.openAI=openAI;
function renderAIMsgs(){
  const c=$('ai-msgs');if(!c)return;
  c.innerHTML=S.aiMsgs.map(m=>`<div style="display:flex;justify-content:${m.t==='user'?'flex-end':'flex-start'};gap:7px;align-items:flex-start">${m.t==='ai'?`<div style="width:28px;height:28px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;color:var(--bg)">${I.robot.replace('20','14')}</div>`:''}<div class="${m.t==='ai'?'bai':'bu'}">${m.text}</div></div>`).join('');
  if(S.aiTyping)c.innerHTML+=`<div style="display:flex;gap:7px;align-items:center"><div style="width:28px;height:28px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--bg)">${I.robot.replace('20','14')}</div><div class="bai tdd" style="padding:12px 14px"><span></span><span></span><span></span></div></div>`;
  c.scrollTop=c.scrollHeight;
}
window.quickAI=function(t){const i=$('ai-inp');if(i)i.value=t;sendAI();};
window.sendAI=function(){
  const inp=$('ai-inp'),txt=inp?.value.trim();
  if(!txt||S.aiTyping)return;
  S.aiMsgs.push({id:Date.now(),t:'user',text:txt});inp.value='';S.aiTyping=true;renderAIMsgs();
  setTimeout(()=>{S.aiMsgs.push({id:Date.now()+1,t:'ai',text:aiR(txt)});S.aiTyping=false;renderAIMsgs();},700+Math.random()*800);
};

// ════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════
function renderAuth(){
  const app=$('app');
  const jb=S.joinCode?`<div class="join-card"><div style="font-size:28px;margin-bottom:8px">🎁</div><div style="font-family:Montserrat,sans-serif;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-bottom:5px">YOU'VE BEEN INVITED</div><div style="color:var(--gray2);font-size:12px;margin-bottom:8px">سجّل الآن وستحصل على:</div><div style="color:var(--gold);font-weight:800;font-size:12.5px">🎡 Lucky Wheel Spin — Free</div><div style="color:var(--grn);font-weight:800;font-size:12.5px;margin-top:3px">✅ Priority Account Access</div></div>`:'';
  app.innerHTML=`
  <div class="auth-s" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;min-height:100%">
    <div style="position:absolute;top:0;left:0;right:0;height:50%;background:radial-gradient(ellipse at 50% -20%,rgba(212,175,55,.07) 0%,transparent 70%);pointer-events:none"></div>
    <div style="position:relative;z-index:1;width:100%;max-width:340px" class="fu">
      ${jb}
      <div style="text-align:center;margin-bottom:28px">
        <div style="width:80px;height:80px;background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold3));border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 32px rgba(212,175,55,.3)">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9l4-6z"/><path d="M11 3 5 9l6 13V3z"/><path d="m13 22 6-13-6-6V22z"/><path d="m2 9 10 4 10-4"/></svg>
        </div>
        <div style="font-family:Montserrat,sans-serif;font-size:28px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--goldL),var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px">BLACKROCK</div>
        <div style="color:var(--gray3);font-size:11px;letter-spacing:.5px">INVESTMENT PLATFORM</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px">
          <div style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:100px;padding:2px 10px;display:flex;align-items:center;gap:3px">${I.shield}<span style="color:var(--grn);font-size:9px;font-weight:800">SECURE SSL</span></div>
          <div style="background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.18);border-radius:100px;padding:2px 10px"><span style="color:var(--gold);font-size:9px;font-weight:800">NYSE: BLK</span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div>
          <div style="color:var(--gray3);font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:5px;padding-right:2px">USERNAME</div>
          <input class="inp" id="a-un" placeholder="Enter username">
        </div>
        <div style="position:relative">
          <div style="color:var(--gray3);font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:5px;padding-right:2px">PASSWORD</div>
          <input class="inp" id="a-pw" type="password" placeholder="Enter password" style="width:100%">
          <button onclick="atPw()" id="pw-tog" style="position:absolute;left:12px;bottom:14px;background:none;border:none;color:var(--gray3);font-size:11px;font-weight:700;cursor:pointer">Show</button>
        </div>
        <div id="cp-w" style="display:none">
          <div style="color:var(--gray3);font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:5px;padding-right:2px">CONFIRM PASSWORD</div>
          <input class="inp" id="a-cp" type="password" placeholder="Confirm password">
        </div>
        <button class="btn btn-primary" id="auth-btn" onclick="doAuth()" style="margin-top:4px;font-size:15px;color:var(--bg);font-weight:900">Sign In</button>
      </div>
      <button onclick="atMode()" id="mode-btn" style="display:block;margin:12px auto 0;background:none;border:none;color:var(--gray2);font-size:12px;cursor:pointer;font-weight:700">Don't have an account? Sign up free</button>
      <div style="margin-top:16px;padding:13px;background:rgba(212,175,55,.04);border:1px solid rgba(212,175,55,.1);border-radius:12px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">${I.shield}<span style="color:var(--grn);font-size:12px;font-weight:800">Platform Security</span></div>
        <div style="color:var(--gray3);font-size:10px;line-height:1.75">• Algeria Official Contract: Jan 2025 → Dec 2027<br>• AES-256 + SSL/TLS 3.0 Encryption<br>• NYSE Listed: BLK — EIN: 32-0174431</div>
      </div>
    </div>
  </div>`;
  let lm=true;
  window.atPw=()=>{const i=$('a-pw'),b=$('pw-tog');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide';};
  window.atMode=()=>{
    lm=!lm;
    $('cp-w').style.display=lm?'none':'block';
    $('auth-btn').textContent=lm?'Sign In':'Create Account';
    $('mode-btn').textContent=lm?`Don't have an account? Sign up free`:'Already have account? Sign in';
  };
  window.doAuth=()=>{
    const un=($('a-un').value||'').trim(),pw=($('a-pw').value||'').trim(),cp=($('a-cp')?.value||'').trim();
    if(!un||!pw){toast('Please fill all fields','error');return;}
    if(!lm&&pw!==cp){toast('Passwords do not match','error');return;}
    $('auth-btn').textContent='Loading...';$('auth-btn').disabled=true;
    setTimeout(()=>{
      const users=DB.g('users')||[];
      if(lm){
        const u=users.find(x=>x.un===un&&x.pw===pw);
        if(u){DB.s('cur',u);S.user=u;toast('Welcome back! 🎉','success');launchApp();}
        else{toast('Invalid credentials','error');$('auth-btn').textContent='Sign In';$('auth-btn').disabled=false;}
      } else {
        if(users.find(x=>x.un===un)){toast('Username already taken','error');$('auth-btn').textContent='Create Account';$('auth-btn').disabled=false;return;}
        const code=genCode();
        if(S.joinCode){
          const ru=users.find(x=>x.code===S.joinCode);
          if(ru){ru.wheelSpins=(ru.wheelSpins||0)+1;ru.teamCount=(ru.teamCount||0)+1;const ri=users.findIndex(x=>x.id===ru.id);if(ri>=0)users[ri]=ru;DB.s('users',users);}
        }

            {id:2,title:'💡 Pro Tip',desc:'Invite friends with your referral link and earn 5% of their daily income for life!',t:'Now',r:false},
          ]};
        users.push(u);DB.s('users',users);DB.s('cur',u);S.user=u;
        toast(S.joinCode?'Account created + Free spin! 🎡':'Account created successfully! 🎉','success');
        S.joinCode=null;launchApp();
      }
    },450);
  };
}

function launchApp(){S.tasks=loadTasks();render();}
function boot(){const app=$('app');if(!app)return;const u=DB.g('cur');if(u){S.user=u;launchApp();}else renderAuth();}
