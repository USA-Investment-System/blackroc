<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>سوشال إكس - أعظم تطبيق</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            direction: rtl;
        }

        /* التطبيق الرئيسي */
        .app {
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* شاشات */
        .screen {
            display: none;
            padding: 20px 16px 80px;
            animation: slideUp 0.3s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* شريط سفلي */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(10,10,15,0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px 22px;
            border-top: 0.5px solid #2a2a3a;
            z-index: 100;
        }

        .bottom-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
        }

        .bottom-item.active {
            color: #3b82f6;
            font-weight: 600;
        }

        .bottom-icon {
            font-size: 24px;
        }

        /* بطاقة المنشور */
        .post {
            background: #111116;
            border-radius: 28px;
            margin-bottom: 16px;
            padding: 16px;
            border: 0.5px solid #22222a;
        }

        .post-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6, #ec489a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .post-name {
            font-weight: 700;
        }

        .post-time {
            font-size: 11px;
            color: #aaa;
        }

        .post-content {
            margin: 12px 0;
            line-height: 1.5;
        }

        .post-stats {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            color: #aaa;
        }

        .stat-btn {
            background: none;
            border: none;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* فيديو شورتس */
        .shorts-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .short-card {
            background: #0a0a0a;
            border-radius: 32px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .short-card video {
            width: 100%;
            max-height: 500px;
            border-radius: 28px;
            background: #000;
        }

        /* شات */
        .chat-bubble {
            background: #1c1c26;
            border-radius: 24px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .chat-name {
            color: #3b82f6;
            font-weight: bold;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            position: sticky;
            bottom: 80px;
            background: #000;
            padding: 10px 0;
        }

        .chat-input {
            flex: 1;
            background: #1c1c26;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
        }

        .chat-send {
            background: #3b82f6;
            border: none;
            border-radius: 40px;
            padding: 0 24px;
            color: white;
            font-weight: bold;
        }

        /* أزرار عامة */
        .input-field {
            background: #1c1c26;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            width: 100%;
            margin: 8px 0;
        }

        .btn-primary {
            background: #3b82f6;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
        }

        h2 {
            margin-bottom: 16px;
            font-size: 24px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- شاشة المنشورات (فيسبوك + تويتر) -->
    <div id="feedScreen" class="screen active">
        <h2>✨ الخلاصة</h2>
        <div id="feedList"></div>
        <div style="margin-top: 20px;">
            <textarea id="postInput" class="input-field" rows="2" placeholder="ما الذي تفكر فيه؟"></textarea>
            <button id="postBtn" class="btn-primary">انشر</button>
        </div>
    </div>

    <!-- شاشة الفيديوهات (تيك توك) -->
    <div id="shortsScreen" class="screen">
        <h2>🎬 شورتس</h2>
        <div id="shortsList" class="shorts-container"></div>
        <div>
            <input type="text" id="videoUrl" class="input-field" placeholder="رابط فيديو MP4">
            <button id="addShortBtn" class="btn-primary">إضافة فيديو</button>
        </div>
    </div>

    <!-- شاشة الشات (مسنجر + تلغرام) -->
    <div id="chatScreen" class="screen">
        <h2>💬 الدردشة</h2>
        <div id="chatList" style="max-height: 60vh; overflow-y: auto;"></div>
        <div class="chat-input-area">
            <input type="text" id="chatUser" class="chat-input" placeholder="اسمك" value="مستخدم">
            <input type="text" id="chatMsg" class="chat-input" placeholder="رسالة...">
            <button id="sendChat" class="chat-send">إرسال</button>
        </div>
    </div>

    <!-- شاشة الملف الشخصي -->
    <div id="profileScreen" class="screen">
        <h2>👤 الإمبراطورية</h2>
        <div style="background:#111116; border-radius:32px; padding:20px;">
            <p>🔥 إجمالي التفاعلات: <span id="totalCount">0</span></p>
            <p>📝 منشورات: <span id="postCount">0</span></p>
            <p>🎥 فيديوهات: <span id="videoCount">0</span></p>
            <p>💬 رسائل: <span id="msgCount">0</span></p>
            <button id="resetBtn" style="background:#e11d48; margin-top:20px;">إعادة ضبط</button>
        </div>
    </div>

    <!-- القائمة السفلية -->
    <div class="bottom-bar">
        <div class="bottom-item active" data-screen="feed">
            <span class="bottom-icon">🏠</span>
            <span>الرئيسية</span>
        </div>
        <div class="bottom-item" data-screen="shorts">
            <span class="bottom-icon">🎵</span>
            <span>شورتس</span>
        </div>
        <div class="bottom-item" data-screen="chat">
            <span class="bottom-icon">💬</span>
            <span>شات</span>
        </div>
        <div class="bottom-item" data-screen="profile">
            <span class="bottom-icon">👤</span>
            <span>أنا</span>
        </div>
    </div>
</div>

<script>
    // === بيانات التطبيق مع حفظ في localStorage ===
    let posts = [];
    let shorts = [];
    let chats = [];

    // تحميل بيانات اولية
    function loadData() {
        if(localStorage.getItem('socialx_posts')) {
            posts = JSON.parse(localStorage.getItem('socialx_posts'));
            shorts = JSON.parse(localStorage.getItem('socialx_shorts'));
            chats = JSON.parse(localStorage.getItem('socialx_chats'));
        } else {
            posts = [
                { id: 1, author: "المطور الأسطوري", content: "تطبيقنا سيتفوق على الجميع 💪", time: "الآن", likes: 120, comments: 34 },
                { id: 2, author: "ثائر تقني", content: "شات آمن + فيديوهات لا نهائية", time: "منذ ساعة", likes: 89, comments: 12 }
            ];
            shorts = [
                { id: 101, url: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4", title: "فيديو تجريبي 1" },
                { id: 102, url: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4", title: "فيديو تجريبي 2" }
            ];
            chats = [
                { id: 1, sender: "النظام", text: "مرحباً بك في أعظم تطبيق", time: "الآن" },
                { id: 2, sender: "مستخدم", text: "هذا سيهزم فيسبوك", time: "منذ 5 د" }
            ];
            saveAll();
        }
        updateStats();
        renderFeed();
        renderShorts();
        renderChat();
    }

    function saveAll() {
        localStorage.setItem('socialx_posts', JSON.stringify(posts));
        localStorage.setItem('socialx_shorts', JSON.stringify(shorts));
        localStorage.setItem('socialx_chats', JSON.stringify(chats));
    }

    function updateStats() {
        document.getElementById('totalCount').innerText = posts.length + shorts.length + chats.length;
        document.getElementById('postCount').innerText = posts.length;
        document.getElementById('videoCount').innerText = shorts.length;
        document.getElementById('msgCount').innerText = chats.length;
    }

    // عرض المنشورات
    function renderFeed() {
        const container = document.getElementById('feedList');
        if(!container) return;
        if(posts.length === 0) {
            container.innerHTML = '<div class="post" style="text-align:center;">لا منشورات بعد، كن الأول!</div>';
            return;
        }
        container.innerHTML = posts.map(p => `
            <div class="post">
                <div class="post-header">
                    <div class="avatar">👤</div>
                    <div>
                        <div class="post-name">${escapeHtml(p.author)}</div>
                        <div class="post-time">${p.time}</div>
                    </div>
                </div>
                <div class="post-content">${escapeHtml(p.content)}</div>
                <div class="post-stats">
                    <button class="stat-btn" onclick="likePost(${p.id})">❤️ ${p.likes}</button>
                    <button class="stat-btn">💬 ${p.comments}</button>
                    <button class="stat-btn">🔁 مشاركة</button>
                </div>
            </div>
        `).join('');
    }

    window.likePost = function(id) {
        const post = posts.find(p => p.id === id);
        if(post) {
            post.likes++;
            saveAll();
            renderFeed();
            updateStats();
        }
    }

    function addPost(content, author = "ثائر") {
        if(!content.trim()) return;
        posts.unshift({
            id: Date.now(),
            author: author,
            content: content,
            time: "الآن",
            likes: 0,
            comments: 0
        });
        saveAll();
        renderFeed();
        updateStats();
    }

    // عرض الفيديوهات
    function renderShorts() {
        const container = document.getElementById('shortsList');
        if(!container) return;
        if(shorts.length === 0) {
            container.innerHTML = '<div class="short-card" style="text-align:center;">أضف فيديو لبدء الشورتس</div>';
            return;
        }
        container.innerHTML = shorts.map(s => `
            <div class="short-card">
                <video controls src="${escapeHtml(s.url)}" playsinline></video>
                <div style="padding:12px;">${escapeHtml(s.title)}</div>
            </div>
        `).join('');
    }

    function addShort(url, title) {
        if(!url.trim()) return;
        shorts.push({ id: Date.now(), url: url, title: title || "شورت جديد" });
        saveAll();
        renderShorts();
        updateStats();
    }

    // عرض الشات
    function renderChat() {
        const container = document.getElementById('chatList');
        if(!container) return;
        if(chats.length === 0) {
            container.innerHTML = '<div class="chat-bubble">لا رسائل بعد</div>';
            return;
        }
        container.innerHTML = chats.map(c => `
            <div class="chat-bubble">
                <span class="chat-name">${escapeHtml(c.sender)}</span> <span style="font-size:10px; color:#888">${c.time}</span>
                <div style="margin-top:6px;">${escapeHtml(c.text)}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    function addChat(sender, text) {
        if(!text.trim()) return;
        chats.push({
            id: Date.now(),
            sender: sender || "مجهول",
            text: text,
            time: "الآن"
        });
        saveAll();
        renderChat();
        updateStats();
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // أحداث الأزرار
    document.getElementById('postBtn')?.addEventListener('click', () => {
        const txt = document.getElementById('postInput')?.value;
        if(txt) addPost(txt, "مستخدم خارق");
        document.getElementById('postInput').value = '';
    });

    document.getElementById('addShortBtn')?.addEventListener('click', () => {
        const url = document.getElementById('videoUrl')?.value;
        if(url) addShort(url, "فيديو جديد");
        document.getElementById('videoUrl').value = '';
    });

    document.getElementById('sendChat')?.addEventListener('click', () => {
        const msg = document.getElementById('chatMsg')?.value;
        const name = document.getElementById('chatUser')?.value;
        if(msg) addChat(name, msg);
        document.getElementById('chatMsg').value = '';
    });

    document.getElementById('resetBtn')?.addEventListener('click', () => {
        localStorage.clear();
        posts = [];
        shorts = [];
        chats = [];
        loadData();
    });

    // التنقل بين الشاشات
    const screens = {
        feed: document.getElementById('feedScreen'),
        shorts: document.getElementById('shortsScreen'),
        chat: document.getElementById('chatScreen'),
        profile: document.getElementById('profileScreen')
    };
    const bottomItems = document.querySelectorAll('.bottom-item');
    bottomItems.forEach(item => {
        item.addEventListener('click', () => {
            const screenId = item.getAttribute('data-screen');
            Object.keys(screens).forEach(id => screens[id].classList.remove('active'));
            screens[screenId].classList.add('active');
            bottomItems.forEach(bi => bi.classList.remove('active'));
            item.classList.add('active');
        });
    });

    loadData();
</script>
</body>
</html>
