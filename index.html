<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlackRock Investment Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0e1a; overflow: hidden; color: white; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(255, 193, 7, 0.3); } 50% { box-shadow: 0 0 40px rgba(255, 193, 7, 0.6); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes typing { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes progress-fill { from { width: 0%; } to { width: 100%; } }
        
        .slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in { animation: fade-in 0.3s ease-out; }
        .pulse-glow { animation: pulse-glow 2s infinite; }
        .float { animation: float 3s ease-in-out infinite; }
        .typing-dot { animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(30, 35, 60, 0.9), rgba(20, 25, 45, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .gold-gradient {
            background: linear-gradient(135deg, #FFD700, #FFA000, #FF8F00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .green-glow {
            background: linear-gradient(135deg, #00E676, #00C853);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }
        
        .btn-press:active { transform: scale(0.97); }
        .ripple { position: relative; overflow: hidden; }
        
        .chat-bubble {
            background: linear-gradient(135deg, #1a1f3a, #252b4a);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .user-bubble {
            background: linear-gradient(135deg, #FF6F00, #FF8F00);
        }
        
        .secure-badge {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.2), rgba(0, 200, 83, 0.1));
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        
        .level-card {
            background: linear-gradient(135deg, rgba(30, 35, 60, 0.95), rgba(25, 30, 50, 0.98));
            border: 1px solid rgba(255, 193, 7, 0.2);
        }
        
        .level-card.locked {
            border-color: rgba(239, 68, 68, 0.3);
            opacity: 0.7;
        }
        
        .invest-btn {
            background: linear-gradient(135deg, #FF8F00, #FF6F00);
            box-shadow: 0 4px 20px rgba(255, 143, 0, 0.4);
        }
        
        .nav-item.active {
            color: #FFD700;
        }
        
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #FFD700;
            border-radius: 2px;
        }
        
        .progress-bar-gold {
            background: linear-gradient(90deg, #FFD700, #FFA000);
            height: 4px;
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        
        .progress-bar-red {
            background: linear-gradient(90deg, #EF5350, #E53935);
            height: 4px;
            border-radius: 2px;
        }
        
        .table-row:nth-child(even) {
            background: rgba(255, 255, 255, 0.03);
        }
        
        .notification-badge {
            background: linear-gradient(135deg, #FF1744, #D50000);
        }
        
        .star-icon {
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
        }
        
        .robot-float {
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 143, 0, 0.4));
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {

</head>

                x: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,

            return icons[name] || null;
        };

        // ==================== TOAST ====================
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]);
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[100] fade-in">
                    <div className={`px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'} text-white font-bold text-sm`}>
                        {type === 'success' && <Icon name="check" size={16} />}
                        {message}
                    </div>

            );

        const BottomSheet = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[80] flex items-end" onClick={onClose}>
                    <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
                    <div className="relative w-full bg-[#1a1f3a] rounded-t-3xl slide-up max-h-[85vh] overflow-y-auto hide-scrollbar border-t border-white/10" onClick={e => e.stopPropagation()}>

        // ==================== DATA ====================

            { id: 'm2', name: 'M2', price: 26600, days: 10, dailyProfit: 86, totalProfit: 860, monthly: 25800, yearly: 309600, memberLevel: 'M2', sellLevel: 26600 },

        const AI_RESPONSES = {
            'مرحبا': 'مرحباً بك! 👋 أنا مساعد BlackRock الذكي. كيف يمكنني مساعدتك اليوم في استثماراتك؟',

        // ==================== AUTH SYSTEM ====================
        const AuthScreen = ({ onLogin, onShowToast }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPass, setConfirmPass] = useState('');
            const [showPassword, setShowPassword] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!username.trim() || !password.trim()) {
                    onShowToast('يرجى ملء جميع الحقول', 'error');
                    return;
                }
                if (!isLogin && password !== confirmPass) {
                    onShowToast('كلمتا المرور غير متطابقتين', 'error');
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('blackrock_users') || '[]');
                if (isLogin) {
                    const user = users.find(u => u.username === username && u.password === password);
                    if (user) {
                        localStorage.setItem('blackrock_current_user', JSON.stringify(user));
                        onShowToast('تم تسجيل الدخول بنجاح! 🎉', 'success');
                        onLogin(user);
                    } else {
                        onShowToast('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
                    }
                } else {
                    if (users.find(u => u.username === username)) {
                        onShowToast('اسم المستخدم موجود بالفعل', 'error');
                        return;
                    }
                    const referralCode = generateReferralCode();
                    const newUser = {
                        id: Date.now(),
                        username,
                        password,
                        referralCode,
                        balance: 555555555555555550000000,
                        referralEarnings: 0,
                        teamCount: 0,
                        teamEarnings: 0,
                        investmentLevel: null,
                        dailyProfit: 0,
                        tasksCompleted: 0,
                        totalEarned: 0,
                        joinedAt: new Date().toISOString()

                    users.push(newUser);
                    localStorage.setItem('blackrock_users', JSON.stringify(users));

            const [isLoading, setIsLoading] = useState(true);

            // Load user from localStorage on mount
            useEffect(() => {
                const saved = localStorage.getItem('blackrock_current_user');
                if (saved) {
                    try {
                        setUser(JSON.parse(saved));
                    } catch (e) { console.error(e); }
                }
                setTimeout(() => setIsLoading(false), 1000);
            }, []);

            // Auto-save user data
            useEffect(() => {
                if (user) {
                    localStorage.setItem('blackrock_current_user', JSON.stringify(user));
                    const users = JSON.parse(localStorage.getItem('blackrock_users') || '[]');
                    const updated = users.map(u => u.id === user.id ? user : u);
                    localStorage.setItem('blackrock_users', JSON.stringify(updated));

                    case 'upgrade': return <UpgradeScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} />;
                    case 'profile': return <ProfileScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} onLogout={handleLogout} />;
                    default: return <HomeScreen user={user} onUpdateUser={updateUser} onShowToast={showToast} onNavigate={setActiveTab} />;
                }
            };

            return (
                <div className="relative h-screen w-full max-w-md mx-auto bg-[#0a0e1a] overflow-hidden shadow-2xl">
                    {renderContent()}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* Bottom Navigation */}
                    <div className="absolute bottom-0 left-0 right-0 bg-[#0a0e1a]/95 backdrop-blur-xl border-t border-white/5 z-50">
                        <div className="flex justify-around items-center py-2">
                            {tabs.map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`nav-item relative flex flex-col items-center gap-1 p-2 transition-all ${activeTab === tab.id ? 'active' : 'text-white/40 hover:text-white/70'}`}
                                >
                                    <div className="relative">
                                        <Icon name={tab.icon} size={24} />
                                        {tab.badge > 0 && (
                                            <span className="absolute -top-2 -right-2 w-5 h-5 notification-badge rounded-full text-white text-[10px] font-bold flex items-center justify-center">
                                                {tab.badge}
                                            </span>
                                        )}
                                    </div>
                                    <span className="text-[10px] font-medium">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="h-1.5 bg-[#0a0e1a]"></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
