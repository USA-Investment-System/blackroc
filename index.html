    if (isNaN(n) || n === null || n === undefined) return '0';
    const abs = Math.abs(n);
    if (abs >= 1e12) return (n/1e12).toFixed(2) + 'T';
    if (abs >= 1e9) return (n/1e9).toFixed(2) + 'B';
    if (abs >= 1e6) return (n/1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return parseFloat(n).toLocaleString('en', {minimumFractionDigits:0, maximumFractionDigits:2});
};

// ---------- WHEEL ----------
const Wheel = ({ open, onClose, user, onUpdate, toast }) => {
    const [spinning, setSpinning] = useState(false);
    const [rot, setRot] = useState(0);
    const [result, setResult] = useState(null);
    const [shown, setShown] = useState(false);
    const prizes = [{label:'43 DZD',val:43},{label:'86 DZD',val:86},{label:'215 DZD',val:215},{label:'عجلة أخرى',val:0},{label:'430 DZD',val:430},{label:'86 DZD',val:86},{label:'215 DZD',val:215}];
    const spin = () => {
        if(spinning) return;
        if((user.spins||0) <= 0 && (user.balance||0) < 43) {
            toast('⚠️ ليس لديك دورات متاحة! ادعُ صديقاً للحصول على دورة مجانية.','warning');
            return;
        }
        setSpinning(true); setShown(false);
        // consume spin if not free (but we'll always consume one spin)
        if((user.spins||0) > 0) onUpdate({spins: (user.spins||0) - 1});
        const add = 1800 + Math.random()*1800;
        const nr = rot + add;
        setRot(nr);
        setTimeout(()=>{
            const seg = 360/prizes.length;
            const wi = Math.floor(((360 - (nr%360)) + seg/2) % 360 / seg) % prizes.length;
            const p = prizes[wi];
            setResult(p); setShown(true); setSpinning(false);
            if(p.val>0){
                onUpdate({balance:(user.balance||0)+p.val, totalEarned:(user.totalEarned||0)+p.val});
                toast(`🎉 ربحت ${p.val} DZD من عجلة الحظ!`,'success');
            } else {
                onUpdate({spins: (user.spins||0) + 1});
                toast('🎁 دورة مجانية إضافية!','warning');
            }
        },4000);
    };
    if(!open) return null;
    return (
        <div className="overlay-bg fi" style={{position:'fixed',inset:0,zIndex:90,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'20px 16px'}}>
            <button onClick={onClose} className="gc" style={{position:'absolute',top:50,right:16,width:40,height:40,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n="x" s={18}/></button>
            <div style={{textAlign:'center',marginBottom:20}}><div style={{fontSize:22,fontWeight:900}}>🎡 عجلة الحظ</div><div style={{fontSize:13,color:'rgba(255,255,255,.5)'}}>ادعُ صديقاً واربح من العجلة!</div><div style={{marginTop:4,fontSize:12}}>📦 دورات متاحة: <span className="gt" style={{fontWeight:900}}>{user.spins||0}</span></div></div>
            <div style={{position:'relative',marginBottom:24}}>
                <div className="wheel-ptr"/>
                <div className="wheel-wrap" style={{transform:`rotate(${rot}deg)`,transition:spinning?'transform 4s cubic-bezier(.17,.67,.12,.99)':'none'}}>
                    {prizes.map((p,i)=> <div key={i} style={{position:'absolute',transform:`rotate(${i*(360/prizes.length)}deg) translateY(-85px)`,width:80,textAlign:'center'}}><span style={{color:'white',fontSize:11,fontWeight:800,textShadow:'0 1px 4px black'}}>{p.label}</span></div>)}
                    <div className="wheel-hub"><Ic n="diamond" s={24}/></div>
                </div>
            </div>
            {shown&&result&&<div className="gc gc-gold" style={{borderRadius:14,padding:'12px 24px',textAlign:'center',marginBottom:16}}><div style={{fontSize:12}}>النتيجة:</div><div className="gt money-display" style={{fontSize:28,fontWeight:900}}>{result.val>0?`+${result.val} DZD`:result.label}</div></div>}
            <button onClick={spin} disabled={spinning} className="btn-gold" style={{width:'100%',maxWidth:320,padding:'15px 0',borderRadius:14,fontSize:16,opacity:spinning?.7:1}}>{spinning?'🎡 جاري الدوران...':'🎯 اضغط للدوران'}</button>
            <div style={{fontSize:11,color:'rgba(255,255,255,.35)',marginTop:12}}>كل صديق يدخل برابطك = دورة واحدة مجانية!</div>
        </div>
    );
};

// ---------- AUTH (START BALANCE 0, REFERRAL SUPPORT) ----------
const Auth = ({ onLogin, toast }) => {
    const [mode, setMode] = useState(true);
    const [un, setUn] = useState(''); const [pw, setPw] = useState(''); const [cp, setCp] = useState('');
    const [sp, setSp] = useState(false); const [ld, setLd] = useState(false);
    const getReferral = () => { const urlParams = new URLSearchParams(window.location.search); return urlParams.get('ref') || localStorage.getItem('pending_ref'); };
    useEffect(()=>{ const ref=getReferral(); if(ref) localStorage.setItem('pending_ref', ref); },[]);
    const go = () => {
        if(!un.trim()||!pw.trim()){toast('يرجى ملء جميع الحقول','error');return;}
        if(!mode&&pw!==cp){toast('كلمتا المرور غير متطابقتين','error');return;}
        setLd(true);
        setTimeout(()=>{
            const users = JSON.parse(localStorage.getItem('br_u')||'[]');
            if(mode){
                const u=users.find(x=>x.un===un&&x.pw===pw);
                if(u){ localStorage.setItem('br_cu',JSON.stringify(u)); toast('تم تسجيل الدخول بنجاح!','success'); onLogin(u); }
                else{ toast('اسم المستخدم أو كلمة المرور غير صحيحة','error'); setLd(false); }
            } else {
                if(users.find(x=>x.un===un)){ toast('اسم المستخدم موجود بالفعل','error'); setLd(false); return; }
                const code=genCode();
                const refCode=localStorage.getItem('pending_ref');
                let referrer=null;
                if(refCode) referrer=users.find(u=>u.code===refCode);
                const newUser = {
                    id:Date.now(), un, pw, code, ref:`blackrock.app?ref=${code}`,
                    balance:0, taskBal:0, refEarn:0, team:[], teamCount:0, level:null, dailyP:0,
                    tasksDone:0, totalEarned:0, spins: referrer ? 1 : 0, lastReset:new Date().toDateString(),
                    joined:new Date().toISOString(), avatar:null, referrer:referrer?referrer.id:null,
                    notifs:[
                        {id:1, title:'مرحباً بك في BlackRock!', desc:'ابدأ رحلتك الاستثمارية. أكمل المهام اليومية وادعُ أصدقاءك!', t:'الآن', r:false},
                        {id:2, title:'💡 نصيحة ذهبية', desc:'ادعُ أصدقاءك برابطك الخاص واربح 5% من دخلهم مدى الحياة + دورة عجلة حظ لكل صديق!', t:'الآن', r:false},
                    ]
                };
                users.push(newUser);
                if(referrer){
                    const idx=users.findIndex(u=>u.id===referrer.id);
                    if(idx!==-1){
                        users[idx].teamCount=(users[idx].teamCount||0)+1;
                        users[idx].team.push(newUser.id);
                        users[idx].spins=(users[idx].spins||0)+1;
                        users[idx].notifs.push({id:Date.now(), title:'🎉 صديق جديد!', desc:`${newUser.un} سجل عبر رابطك! حصلت على دورة عجلة حظ مجانية.`, t:'الآن', r:false});
                    }
                }
                localStorage.setItem('br_u',JSON.stringify(users));
                localStorage.setItem('br_cu',JSON.stringify(newUser));
                localStorage.removeItem('pending_ref');
                toast('تم إنشاء الحساب بنجاح! 🎉','success');
                onLogin(newUser);
            }
        },900);
    };
    return (
        <div style={{height:'100%',background:'var(--bg)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 20px'}}>
            <div style={{width:'100%',maxWidth:360}}>
                <div style={{textAlign:'center',marginBottom:32}}>
                    <div className="pp" style={{width:88,height:88,background:'linear-gradient(135deg,#F5C518,#FF9800,#FF6D00)',borderRadius:24,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}><Ic n="diamond" s={46}/></div>
                    <div style={{fontFamily:'Montserrat',fontSize:34,fontWeight:900,letterSpacing:2}} className="gt">BLACKROCK</div>
                    <div style={{fontSize:12,color:'rgba(255,255,255,.35)'}}>BlackRock, Inc — Investment Platform</div>
                    <div className="sec-badge" style={{display:'inline-flex',gap:5,borderRadius:100,padding:'4px 12px',marginTop:8}}><Ic n="shield" s={11}/><span style={{color:'#00E676',fontSize:10,fontWeight:900}}>SECURE V3</span></div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                    <input className="inp" value={un} onChange={e=>setUn(e.target.value)} placeholder="اسم المستخدم" style={{borderRadius:14,padding:'13px 16px',fontSize:14,textAlign:'center'}}/>
                    <div style={{position:'relative'}}><input className="inp" type={sp?"text":"password"} value={pw} onChange={e=>setPw(e.target.value)} placeholder="كلمة المرور" style={{borderRadius:14,padding:'13px 16px',fontSize:14,textAlign:'center',width:'100%'}}/><button onClick={()=>setSp(!sp)} style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'rgba(255,255,255,.3)',fontSize:11,cursor:'pointer'}}>{sp?'إخفاء':'عرض'}</button></div>
                    {!mode&&<input className="inp" type="password" value={cp} onChange={e=>setCp(e.target.value)} placeholder="تأكيد كلمة المرور" style={{borderRadius:14,padding:'13px 16px',fontSize:14,textAlign:'center'}}/>}
                    <button onClick={go} disabled={ld} className="btn-gold" style={{borderRadius:14,padding:'14px',fontSize:16}}>{ld?'جاري...':(mode?'تسجيل الدخول':'إنشاء حساب مجاني')}</button>
                </div>
                <button onClick={()=>{setMode(!mode); setCp('');}} style={{display:'block',margin:'14px auto 0',background:'none',border:'none',color:'rgba(255,255,255,.4)',fontSize:12,cursor:'pointer'}}>{mode?'ليس لديك حساب؟ سجل الآن مجاناً':'لديك حساب؟ سجل الدخول'}</button>
            </div>
        </div>
    );
};

// ---------- TASKS (INDEPENDENT, NO PREVIOUS REQUIREMENT) ----------
const Tasks = ({ user, upd, toast }) => {
    const initTasks = () => { try{ const s=localStorage.getItem(`br_tk_${user.id}`); if(s) return JSON.parse(s); }catch(e){} return [1,2,3,4,5].map(id=>({id,name:`مهمة يومية ${id}`,reward:43,status:'available',done:null,failed:null})); };
    const [tasks, setTasks] = useState(initTasks);
    const [active, setActive] = useState(null);
    const [cd, setCd] = useState(40);
    const [confirmCancel, setConfirmCancel] = useState(false);
    const cdRef = useRef(null);
    useEffect(()=>{ localStorage.setItem(`br_tk_${user.id}`,JSON.stringify(tasks)); },[tasks]);
    useEffect(()=>{ const today=new Date().toDateString(); if(user.lastReset!==today){ setTasks([1,2,3,4,5].map(id=>({id,name:`مهمة يومية ${id}`,reward:43,status:'available',done:null,failed:null}))); upd({lastReset:today}); toast('🌅 تم تجديد المهام!','success'); } },[]);
    useEffect(()=>{ if(active&&cd>0){ cdRef.current=setTimeout(()=>setCd(c=>c-1),1000); } else if(active&&cd===0){ completeTask(); } return()=>clearTimeout(cdRef.current); },[active,cd]);
    const startTask = (id) => { setActive(id); setCd(40); setTasks(ts=>ts.map(t=>t.id===id?{...t,status:'active'}:t)); toast('⏱️ المهمة بدأت! انتظر 40 ثانية...','info'); };
    const completeTask = () => { const task=tasks.find(t=>t.id===active); if(!task) return; setTasks(ts=>ts.map(t=>t.id===active?{...t,status:'completed',done:new Date()}:t)); upd({balance:(user.balance||0)+task.reward, taskBal:(user.taskBal||0)+task.reward, tasksDone:(user.tasksDone||0)+1, totalEarned:(user.totalEarned||0)+task.reward}); toast(`🎉 ربحت ${task.reward} DZD`,'success'); setActive(null); };
    const doCancel = () => { setTasks(ts=>ts.map(t=>t.id===active?{...t,status:'failed',failed:new Date()}:t)); clearTimeout(cdRef.current); setActive(null); setConfirmCancel(false); toast('❌ تم إلغاء المهمة! تُعاد غداً','error'); };
    const doneCount = tasks.filter(t=>t.status==='completed').length;
    return (
        <div className="hs" style={{height:'100%',overflowY:'auto',paddingBottom:90}}>
            <div style={{position:'sticky',top:0,background:'rgba(6,9,18,.96)',padding:'12px 16px',textAlign:'center',borderBottom:'1px solid rgba(255,255,255,.05)'}}><div style={{fontWeight:900,fontSize:18}}>⚡ المهام اليومية</div></div>
            <div style={{padding:'14px'}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
                    <div className="gc" style={{borderRadius:14,padding:'12px',textAlign:'center'}}><Ic n="check" s={20}/><div style={{color:'#00E676',fontWeight:900,fontSize:14}}>{doneCount}/5</div><div style={{fontSize:10}}>المكتملة</div></div>
                    <div className="gc" style={{borderRadius:14,padding:'12px',textAlign:'center'}}><Ic n="users" s={20}/><div style={{color:'#2979FF',fontWeight:900,fontSize:14}}>{user.teamCount||0}</div><div style={{fontSize:10}}>الفريق</div></div>
                    <div className="gc" style={{borderRadius:14,padding:'12px',textAlign:'center'}}><Ic n="profit" s={20}/><div style={{color:'#F5C518',fontWeight:900,fontSize:14}}>{doneCount*43} DZD</div><div style={{fontSize:10}}>المكسب اليوم</div></div>
                </div>
                {tasks.map(task=>{
                    const isActive = task.status==='active'&&active===task.id;
                    const isDone = task.status==='completed';
                    const isFailed = task.status==='failed';
                    const isAvail = task.status==='available';
                    const prog = isDone?100:isActive?((40-cd)/40*100):0;
                    return (
                        <div key={task.id} className={`gc ${isDone?'task-done':isFailed?'task-fail':isActive?'task-active':''}`} style={{borderRadius:16,padding:'14px',marginBottom:10}}>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}><div><div style={{fontWeight:800}}>{task.name}</div><div style={{fontSize:12,color:'rgba(255,255,255,.4)'}}>+DZD {task.reward}</div></div><div style={{fontSize:20,fontWeight:900,color:isDone?'#00E676':isFailed?'#FF1744':'#F5C518'}}>+{task.reward}</div></div>
                            <div style={{background:'rgba(255,255,255,.07)',borderRadius:6,height:6,marginBottom:10,overflow:'hidden'}}><div style={{width:`${prog}%`,height:'100%',background:isDone?'#00E676':isFailed?'#FF1744':'#F5C518',transition:isActive?'width 1s linear':'none'}}/></div>
                            {isActive&&<div><div className="gc gc-gold" style={{borderRadius:12,padding:'12px',textAlign:'center',marginBottom:8}}><div style={{fontSize:44,fontWeight:900}} className="gt">{cd}</div><div>ثانية</div></div><button onClick={()=>setConfirmCancel(true)} style={{width:'100%',padding:'11px',borderRadius:12,background:'rgba(255,23,68,.1)',border:'1px solid rgba(255,23,68,.25)',color:'#FF1744',fontWeight:800}}>إلغاء المهمة</button></div>}
                            {isAvail&&<button onClick={()=>startTask(task.id)} className="btn-gold" style={{width:'100%',padding:'12px',borderRadius:12}}>ابدأ المهمة (40 ثانية)</button>}
                            {isDone&&<div style={{padding:'11px',textAlign:'center',background:'rgba(0,230,118,.1)',borderRadius:12,color:'#00E676'}}>✅ تم الإكمال</div>}
                            {isFailed&&<div style={{padding:'11px',textAlign:'center',background:'rgba(255,23,68,.08)',borderRadius:12,color:'#FF1744'}}>❌ أُلغيت — تُعاد غداً</div>}
                        </div>
                    );
                })}
            </div>
            {confirmCancel&&<div className="overlay-bg fi" style={{position:'fixed',inset:0,zIndex:99,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}><div className="gc gc-red" style={{borderRadius:20,padding:24,maxWidth:320,width:'100%'}}><div style={{textAlign:'center',marginBottom:16}}><div style={{width:56,height:56,background:'rgba(255,23,68,.15)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}><Ic n="x" s={28}/></div><div style={{fontWeight:900,fontSize:17}}>تأكيد الإلغاء</div><div style={{fontSize:13,color:'rgba(255,255,255,.55)'}}>ستخسر 43 DZD ولا يمكن إعادتها إلا غداً!</div></div><div style={{display:'flex',gap:10}}><button onClick={()=>setConfirmCancel(false)} className="btn-ghost" style={{flex:1,padding:'12px',borderRadius:12}}>إكمال</button><button onClick={doCancel} style={{flex:1,padding:'12px',borderRadius:12,background:'#D50000',color:'white',fontWeight:900}}>إلغاء نهائي</button></div></div></div>}
        </div>
    );
};

// ---------- MAIN APP ----------
const App = () => {
    const [user, setUser] = useState(null);
    const [tab, setTab] = useState('home');
    const [toastMsg, setToastMsg] = useState(null);
    const [loading, setLoading] = useState(true);
    useEffect(()=>{ const saved=localStorage.getItem('br_cu'); if(saved) setUser(JSON.parse(saved)); setTimeout(()=>setLoading(false),800); },[]);
    useEffect(()=>{ if(user){ localStorage.setItem('br_cu',JSON.stringify(user)); const users=JSON.parse(localStorage.getItem('br_u')||'[]'); const updated=users.map(u=>u.id===user.id?user:u); localStorage.setItem('br_u',JSON.stringify(updated)); } },[user]);
    const showToast = useCallback((msg,type)=>setToastMsg({msg,type,id:Date.now()}),[]);
    const upd = useCallback((changes)=>setUser(prev=>({...prev,...changes})),[]);
    const login = (u)=>{ setUser(u); setTab('home'); };
    const logout = ()=>{ localStorage.removeItem('br_cu'); setUser(null); showToast('تم تسجيل الخروج','success'); };
    if(loading) return <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="pp"><Ic n="diamond" s={60}/></div></div>;
    if(!user) return <div style={{height:'100%'}}><Auth onLogin={login} toast={showToast}/>{toastMsg&&<Toast key={toastMsg.id} message={toastMsg.msg} type={toastMsg.type} onClose={()=>setToastMsg(null)}/>}</div>;
    const nav = [{id:'home',icon:'home',label:'الرئيسية'},{id:'tasks',icon:'tasks',label:'المهام',badge:5},{id:'up',icon:'diamond',label:'الترقية'},{id:'profile',icon:'user',label:'حسابي'}];
    return (
        <div style={{height:'100%',maxWidth:430,margin:'0 auto',position:'relative',background:'var(--bg)',overflow:'hidden'}}>
            <div style={{height:'100%'}}>
                {tab==='home'&&<Home user={user} upd={upd} toast={showToast} nav={setTab}/>}
                {tab==='tasks'&&<Tasks user={user} upd={upd} toast={showToast}/>}
                {tab==='up'&&<Upgrade user={user} upd={upd} toast={showToast}/>}
                {tab==='profile'&&<Profile user={user} upd={upd} toast={showToast} logout={logout}/>}
            </div>
            <div style={{position:'absolute',bottom:0,left:0,right:0,background:'rgba(6,9,18,.97)',backdropFilter:'blur(20px)',borderTop:'1px solid rgba(255,255,255,.06)',zIndex:50,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
                <div style={{display:'flex',justifyContent:'space-around',alignItems:'center',paddingTop:6,paddingBottom:8}}>
                    {nav.map(n=>{ const active=tab===n.id; return <button key={n.id} onClick={()=>setTab(n.id)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'4px 12px',background:'none',border:'none',color:active?'#F5C518':'rgba(255,255,255,.35)',position:'relative'}}><div style={{position:'relative'}}><Ic n={n.icon} s={23}/>{n.badge&&<span className="n-dot" style={{position:'absolute',top:-5,right:-6,width:16,height:16,fontSize:8,fontWeight:900,border:'1.5px solid var(--bg)'}}>{n.badge}</span>}</div><span style={{fontSize:10}}>{n.label}</span></button>; })}
                </div>
            </div>
            {toastMsg&&<Toast key={toastMsg.id} message={toastMsg.msg} type={toastMsg.type} onClose={()=>setToastMsg(null)}/>}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
