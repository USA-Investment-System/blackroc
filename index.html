function getUserByCode(code){return getUsers().find(u=>String(u.code).toUpperCase()===code.toUpperCase())||null}
function getUserByUsername(username){return getUsers().find(u=>u.un===username)||null}
function createUserLocal(user){const users=getUsers();users.push(user);saveUsers(users);return user}
function updateUserLocal(user){const users=getUsers();const i=users.findIndex(u=>u.id===user.id);if(i>=0){users[i]=user;saveUsers(users)}return user}
