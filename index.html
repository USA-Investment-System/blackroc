html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:Tajawal,sans-serif}
#root{height:100%;display:flex;justify-content:center}

.btn{border:none;border-radius:14px;padding:13px 14px;font-size:14px;font-weight:900;font-family:Tajawal,sans-serif;cursor:pointer}
.btn:active{transform:scale(.98);opacity:.9}
.gold{background:linear-gradient(135deg,#ffe69a,var(--gold),var(--gold3));color:#020509}
.card{background:linear-gradient(160deg,rgba(15,20,35,.98),rgba(8,12,22,.99));border:1px solid var(--line);border-radius:16px}

.mon{font-family:Montserrat,sans-serif}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.fade{animation:fade .22s ease}
.up{animation:up .25s cubic-bezier(.16,1,.3,1)}
.pulse{animation:pulse 1.4s infinite}
.float{animation:float 3s ease-in-out infinite}
.ticker{animation:ticker 28s linear infinite}
.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:linear-gradient(180deg,rgba(8,12,22,.9),rgba(2,5,9,.98));border-top:1px solid rgba(212,175,55,.14);display:flex;z-index:50}
.nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.35);font-family:Tajawal,sans-serif;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.nav button.on{color:var(--gold)}
.nav button.on:before{content:"";position:absolute;top:0;width:30px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:0 0 4px 4px}
.badge{position:absolute;top:9px;right:28%;min-width:18px;height:18px;border-radius:9px;background:var(--red);border:2px solid #020509;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:300;display:flex;align-items:flex-end}
.sheetPanel{width:100%;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1428,#050912);border-radius:24px 24px 0 0;border-top:1px solid rgba(212,175,55,.18);padding:14px 16px 50px}
.sheetPanel::-webkit-scrollbar{display:none}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 18px;border-radius:999px;background:#16a34a;color:#fff;font-weight:900;font-size:13px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;padding:14px 15px;font-size:15px;font-weight:800;font-family:Tajawal,sans-serif;outline:none}
.input:focus{border-color:rgba(212,175,55,.45)}
.small{font-size:11px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
</style>

function makeUser(un,pw,phone,wilaya,joinedVia){
 return {
  id:Date.now(), un,pw, code:code(), ref:"",
  phone:"+213"+normPhone(phone), wilaya,
  balance:0,taskBal:0,refEarn:0,teamCount:0,wheelSpins:joinedVia?1:0,m1Refs:0,level:null,totalEarned:0,

 }

function auth(login){
 let un=document.getElementById("un").value.trim();
 let pw=document.getElementById("pw").value.trim();
 let cp=document.getElementById("cpw")?.value.trim();
 let ph=document.getElementById("phone")?.value.trim();
 let wi=document.getElementById("wilaya")?.value;
 if(!un||!pw)return toast("املأ الحقول","error");
 let all=users();
 if(login){
  let u=all.find(x=>x.un===un&&x.pw===pw);
  if(!u)return toast("بيانات خاطئة","error");
  setCur(u); S.user=u; loadTasks(); render(); return toast("مرحباً "+un);
 }
 if(pw!==cp)return toast("كلمة المرور غير متطابقة","error");
 if(!validPhone(ph))return toast("رقم جزائري صحيح يبدأ بـ 05 أو 06 أو 07","error");
 if(!wi)return toast("اختر الولاية","error");
 if(all.find(x=>x.un===un))return toast("الاسم موجود","error");
 let rc=refCodeFromUrl();
 let nu=makeUser(un,pw,ph,wi,rc);
 nu.ref=refLink(nu);
 addNotif(nu,"مرحباً بك","ابدأ المهام اليومية واربح");
 if(rc)addNotif(nu,"🎡 عجلة مجانية","حصلت على دورة لأنك دخلت عبر رابط دعوة");
 all.push(nu);
 if(rc){
  let i=all.findIndex(x=>x.code===rc);
  if(i>=0){
   all[i].teamCount=(all[i].teamCount||0)+1;
   all[i].wheelSpins=(all[i].wheelSpins||0)+1;
   addNotif(all[i],"🎉 صديق جديد","دخل "+un+" عبر رابطك. +دورة عجلة");
   addAct(all[i],"referral","إحالة جديدة",0,true);
  }
 }
 saveUsers(all); setCur(nu); S.user=nu; loadTasks(); render(); toast(rc?"مرحباً + دورة مجانية":"تم إنشاء الحساب");
}

/* =========================
   TASKS
========================= */
function lv(){return LVS.find(x=>x.id===S.user?.level)||LVS[0]}
function loadTasks(){
 if(!S.user)return;
 let k="tasks_"+S.user.id;
 let saved=g(k,null);
 if(saved&&saved.date===today()){S.tasks=saved.tasks;return}
 let per=Math.max(43,Math.round(lv().dy/5));
 let arr=[...TASKS].sort(()=>Math.random()-.5).slice(0,5).map((t,i)=>({id:i+1,ar:t[0],sec:40,reward:per,status:"available"}));
 S.tasks=arr;s(k,{date:today(),tasks:arr});
}
function startTask(id){
 if(!S.user.level){S.user.level="trial"; setCur(S.user); toast("تم تفعيل التجربة تلقائياً")}
 if(S.activeTask)return toast("مهمة جارية","warning");
 let tk=S.tasks.find(x=>x.id===id); if(!tk||tk.status!=="available")return;
 tk.status="active";S.activeTask=id;S.cd=tk.sec;saveTaskState();render();
 S.timer=setInterval(()=>{S.cd--; if(S.cd<=0){clearInterval(S.timer);completeTask(id)} else render()},1000);
}
function completeTask(id){
 let tk=S.tasks.find(x=>x.id===id); if(!tk)return;
 tk.status="done";S.activeTask=null;
 S.user.balance+=tk.reward;S.user.taskBal+=tk.reward;S.user.totalEarned+=tk.reward;
 addAct(S.user,"task","✅ "+tk.ar,tk.reward,true);
 // 5% commission to referrer
 if(S.user.joinedVia){let all=users();let i=all.findIndex(x=>x.code===S.user.joinedVia);if(i>=0){let c=tk.reward*.05;all[i].balance+=c;all[i].refEarn=(all[i].refEarn||0)+c;all[i].totalEarned+=c;addNotif(all[i],"💰 عمولة إحالة","+ "+money(c)+" من أرباح "+S.user.un);saveUsers(all)}}
 setCur(S.user);saveTaskState();toast("+"+tk.reward+" د.ج");render();
}
function saveTaskState(){if(S.user)s("tasks_"+S.user.id,{date:today(),tasks:S.tasks})}

function openWheel(){
 if((S.user.wheelSpins||0)<=0)return toast("لا توجد دورات. ادع صديقاً لتحصل على دورة","warning");
 S.wheelOpen=true;render();
}
function spinWheel(){
 if((S.user.wheelSpins||0)<=0)return;
 let idx=Math.floor(Math.random()*WHEEL.length),p=WHEEL[idx];
 S.user.wheelSpins--;
 if(p.v>0){S.user.balance+=p.v;S.user.totalEarned+=p.v;addAct(S.user,"wheel","🎡 عجلة الحظ",p.v,true);toast("ربحت "+p.l)}
 else {S.user.wheelSpins++;toast("دورة إضافية")}
 setCur(S.user);S.wheelOpen=false;render();
}

].map(x=>`<button class="${S.tab===x[0]?'on':''}" onclick="S.tab='${x[0]}';render()"><div style="position:relative;font-size:24px">${x[1]}${x[3]?`<span class='badge'>${x[3]}</span>`:""}</div><span>${x[2]}</span></button>`).join("")}</nav>`}

function wheelOverlay(){let seg=360/WHEEL.length;let parts=WHEEL.map((p,i)=>`<div style="position:absolute;inset:0;transform:rotate(${i*seg}deg);clip-path:polygon(50% 50%,100% 0,100% 100%);background:${p.c}"></div>`).join("");document.body.insertAdjacentHTML("beforeend",`<div class='sheet' id='wheel'><div style='margin:auto;text-align:center'><button onclick='S.wheelOpen=false;document.getElementById(\"wheel\").remove()' class='btn' style='background:rgba(255,255,255,.08);color:#fff;margin-bottom:20px'>إغلاق</button><div style='width:270px;height:270px;border-radius:50%;position:relative;overflow:hidden;margin:auto;box-shadow:0 0 50px rgba(212,175,55,.3)'>${parts}<div style='position:absolute;inset:105px;background:#020509;border:3px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:900'>BLK</div></div><button class='btn gold' style='margin-top:20px;width:270px' onclick='spinWheel();document.getElementById(\"wheel\").remove()'>دوران 🎯</button></div></div>`)}
function openAI(){S.showAI=true;sheet("AI ASSISTANT",`<div style="min-height:280px;color:var(--muted);font-size:14px;line-height:2;text-align:center">أهلاً! اسألني عن المهام أو السحب أو الشحن أو الاستثمار.</div><input class="input" placeholder="اكتب سؤالك...">`)}

render();
</script>
</body>
