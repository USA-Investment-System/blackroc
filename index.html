<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>الملهم - أعظم تطبيق اجتماعي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #000000;
            color: white;
            direction: rtl;
        }

        /* شريط التطبيق السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px 20px;
            border-top: 0.5px solid #2c2c3e;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #8e8e9e;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            color: #3b82f6;
            font-weight: bold;
        }

        .nav-icon {
            font-size: 24px;
        }

        /* المحتوى الرئيسي */
        .screen {
            display: none;
            padding: 20px 16px 90px;
            animation: fade 0.25s ease;
        }

        .screen.active-screen {
            display: block;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(10px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* بطاقات المنشورات */
        .post-card {
            background: #12121c;
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #28283a;
        }

        .post-header {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #3b82f6, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .post-name {
            font-weight: bold;
        }

        .post-time {
            font-size: 11px;
            color: #8e8e9e;
        }

        .post-content {
            font-size: 16px;
            margin: 12px 0;
            line-height: 1.5;
        }

        .post-actions {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            color: #8e8e9e;
        }

        .action-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* فيديوهات تيك توك */
        .video-container {
            background: #0a0a0a;
            border-radius: 32px;
            overflow: hidden;
            margin-bottom: 24px;
            position: relative;
        }

        video {
            width: 100%;
            max-height: 500px;
            border-radius: 28px;
            background: black;
        }

        /* شات */
        .chat-message {
            background: #1e1e2c;
            border-radius: 24px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .chat-sender {
            font-weight: bold;
            color: #3b82f6;
        }

        .chat-text {
            margin-top: 6px;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            position: sticky;
            bottom: 80px;
            background: #000;
            padding: 8px 0;
        }

        .chat-input {
            flex: 1;
            background: #1e1e2c;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
        }

        .chat-send {
            background: #3b82f6;
            border: none;
            border-radius: 40px;
            padding: 0 20px;
            color: white;
            font-weight: bold;
        }

        /* إضافة فيديو */
        .input-field {
            background: #1e1e2c;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            width: 100%;
            margin: 8px 0;
        }

        .btn-primary {
            background: #3b82f6;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
        }

        h3 {
            margin: 20px 0 12px;
        }
    </style>
</head>
<body>

<!-- شاشات التطبيق -->
<div id="feedScreen" class="screen active-screen">
    <h2 style="margin-bottom: 16px;">🌍 الأحداث</h2>
    <div id="postsContainer"></div>
    <div style="background: #12121c; border-radius: 28px; padding: 16px; margin-top: 16px;">
        <textarea id="newPostText" class="input-field" rows="2" placeholder="اكتب منشوراً ..."></textarea>
        <button id="publishPostBtn" class="btn-primary">➕ انشر الآن</button>
    </div>
</div>

<div id="videosScreen" class="screen">
    <h2>🎬 فيديوهات قصيرة</h2>
    <div id="videosList"></div>
    <div style="margin-top: 20px;">
        <input type="text" id="videoUrlInput" class="input-field" placeholder="رابط فيديو (mp4)">
        <button id="addVideoBtn" class="btn-primary">➕ إضافة فيديو</button>
    </div>
</div>

<div id="chatScreen" class="screen">
    <h2>💬 مسنجر + تلغرام</h2>
    <div id="chatMessages" style="max-height: 60vh; overflow-y: auto;"></div>
    <div class="chat-input-area">
        <input type="text" id="chatNameInput" class="chat-input" placeholder="اسمك" value="مستخدم_ثوري">
        <input type="text" id="chatMsgInput" class="chat-input" placeholder="اكتب رسالة...">
        <button id="sendChatBtn" class="chat-send">إرسال</button>
    </div>
</div>

<div id="profileScreen" class="screen">
    <h2>👤 إحصائيات السيطرة</h2>
    <div style="background: #12121c; border-radius: 32px; padding: 20px;">
        <p>🔥 إجمالي التفاعلات: <span id="totalStats">0</span></p>
        <p>🚀 عدد المنشورات: <span id="postCount">0</span></p>
        <p>📹 عدد الفيديوهات: <span id="videoCount">0</span></p>
        <p>💬 رسائل الشات: <span id="msgCount">0</span></p>
        <button id="resetDataBtn" style="background:#ef4444; margin-top:20px;">إعادة تعيين تجريبي</button>
    </div>
</div>

<!-- القائمة السفلية -->
<div class="bottom-nav">
    <div class="nav-item active" data-screen="feed">
        <span class="nav-icon">📱</span>
        <span>رئيسي</span>
    </div>
    <div class="nav-item" data-screen="videos">
        <span class="nav-icon">🎥</span>
        <span>فيديوهات</span>
    </div>
    <div class="nav-item" data-screen="chat">
        <span class="nav-icon">💬</span>
        <span>شات</span>
    </div>
    <div class="nav-item" data-screen="profile">
        <span class="nav-icon">⚡</span>
        <span>سيطرة</span>
    </div>
</div>

<script>
    // ---------- قاعدة بيانات وهمية لكن قوية ----------
    let posts = [];
    let videos = [];
    let chatMessages = [];

    // بيانات أولية تجعل التطبيق حياً
    function loadInitialData() {
        if(localStorage.getItem("super_app_posts")) {
            posts = JSON.parse(localStorage.getItem("super_app_posts"));
            videos = JSON.parse(localStorage.getItem("super_app_videos"));
            chatMessages = JSON.parse(localStorage.getItem("super_app_chat"));
        } else {
            posts = [
                { id: 1, author: "مبرمج ملهم", content: "تطبيقنا سيتفوق على تيك توك وفيسبوك. هذه البداية 🔥", time: "الآن", likes: 45, comments: 12 },
                { id: 2, author: "ثورة التواصل", content: "شات آمن + فيديوهات بدون حدود", time: "منذ ساعة", likes: 89, comments: 23 }
            ];
            videos = [
                { id: 101, url: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4", title: "فيديو تجريبي رهيب" },
                { id: 102, url: "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4", title: "تيك توك لكن أفضل" }
            ];
            chatMessages = [
                { id: 1001, sender: "المؤسس", text: "مرحباً بكم في أعظم تطبيق", time: "الآن" },
                { id: 1002, sender: "مستخدم1", text: "هذا سيهزم الجميع", time: "منذ 5 دقائق" }
            ];
            saveToLocal();
        }
        updateAllStats();
        renderPosts();
        renderVideos();
        renderChat();
    }

    function saveToLocal() {
        localStorage.setItem("super_app_posts", JSON.stringify(posts));
        localStorage.setItem("super_app_videos", JSON.stringify(videos));
        localStorage.setItem("super_app_chat", JSON.stringify(chatMessages));
    }

    function updateAllStats() {
        document.getElementById("totalStats").innerText = posts.length + videos.length + chatMessages.length;
        document.getElementById("postCount").innerText = posts.length;
        document.getElementById("videoCount").innerText = videos.length;
        document.getElementById("msgCount").innerText = chatMessages.length;
    }

    // عرض المنشورات (فيسبوك + تويتر)
    function renderPosts() {
        const container = document.getElementById("postsContainer");
        if(!container) return;
        if(posts.length === 0) {
            container.innerHTML = `<div class="post-card">✨ كن أول من ينشر في عصر السيطرة ✨</div>`;
            return;
        }
        container.innerHTML = posts.map(post => `
            <div class="post-card">
                <div class="post-header">
                    <div class="avatar">👤</div>
                    <div>
                        <div class="post-name">${escapeHtml(post.author)}</div>
                        <div class="post-time">${post.time}</div>
                    </div>
                </div>
                <div class="post-content">${escapeHtml(post.content)}</div>
                <div class="post-actions">
                    <button class="action-btn" onclick="likePost(${post.id})">❤️ ${post.likes}</button>
                    <button class="action-btn">💬 ${post.comments}</button>
                    <button class="action-btn">🔁 مشاركة</button>
                </div>
            </div>
        `).join('');
    }

    window.likePost = function(id) {
        const post = posts.find(p => p.id === id);
        if(post) {
            post.likes += 1;
            saveToLocal();
            renderPosts();
            updateAllStats();
        }
    }

    function addPost(content, author = "ثائر رقمي") {
        if(!content.trim()) return;
        const newPost = {
            id: Date.now(),
            author: author,
            content: content,
            time: "الآن",
            likes: 0,
            comments: 0
        };
        posts.unshift(newPost);
        saveToLocal();
        renderPosts();
        updateAllStats();
    }

    // عرض الفيديوهات (نسخة تيك توك)
    function renderVideos() {
        const container = document.getElementById("videosList");
        if(!container) return;
        if(videos.length === 0) {
            container.innerHTML = `<div class="post-card">🎬 أضف فيديو لتنطلق المنافسة</div>`;
            return;
        }
        container.innerHTML = videos.map(v => `
            <div class="video-container">
                <video controls src="${escapeHtml(v.url)}" style="width:100%"></video>
                <div style="padding:12px"><b>${escapeHtml(v.title)}</b></div>
            </div>
        `).join('');
    }

    function addVideo(url, title) {
        if(!url.trim()) return;
        videos.push({ id: Date.now(), url: url, title: title || "فيديو جديد" });
        saveToLocal();
        renderVideos();
        updateAllStats();
    }

    // عرض الشات (مسنجر + تلغرام)
    function renderChat() {
        const container = document.getElementById("chatMessages");
        if(!container) return;
        if(chatMessages.length === 0) {
            container.innerHTML = `<div class="chat-message">💬 ابدأ المحادثة العالمية الآن</div>`;
            return;
        }
        container.innerHTML = chatMessages.map(m => `
            <div class="chat-message">
                <div class="chat-sender">${escapeHtml(m.sender)} <span style="font-size:10px; color:#8e8e9e">${m.time}</span></div>
                <div class="chat-text">${escapeHtml(m.text)}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    function sendChatMessage(sender, text) {
        if(!text.trim()) return;
        chatMessages.push({
            id: Date.now(),
            sender: sender || "مجهول",
            text: text,
            time: "الآن"
        });
        saveToLocal();
        renderChat();
        updateAllStats();
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // --- أحداث الأزرار ---
    document.getElementById("publishPostBtn")?.addEventListener("click", () => {
        const txt = document.getElementById("newPostText")?.value;
        if(txt) addPost(txt, "مستخدم_خارق");
        document.getElementById("newPostText").value = "";
    });

    document.getElementById("addVideoBtn")?.addEventListener("click", () => {
        const url = document.getElementById("videoUrlInput")?.value;
        if(url) addVideo(url, "فيديو تم إضافته");
        document.getElementById("videoUrlInput").value = "";
    });

    document.getElementById("sendChatBtn")?.addEventListener("click", () => {
        const msg = document.getElementById("chatMsgInput")?.value;
        const name = document.getElementById("chatNameInput")?.value;
        if(msg) sendChatMessage(name, msg);
        document.getElementById("chatMsgInput").value = "";
    });

    document.getElementById("resetDataBtn")?.addEventListener("click", () => {
        localStorage.clear();
        posts = [];
        videos = [];
        chatMessages = [];
        loadInitialData();
    });

    // التنقل بين الشاشات
    const navItems = document.querySelectorAll(".nav-item");
    const screens = {
        feed: document.getElementById("feedScreen"),
        videos: document.getElementById("videosScreen"),
        chat: document.getElementById("chatScreen"),
        profile: document.getElementById("profileScreen")
    };

    navItems.forEach(item => {
        item.addEventListener("click", () => {
            const screenId = item.getAttribute("data-screen");
            Object.keys(screens).forEach(id => {
                screens[id].classList.remove("active-screen");
            });
            screens[screenId].classList.add("active-screen");
            navItems.forEach(nav => nav.classList.remove("active"));
            item.classList.add("active");
        });
    });

    // بدء التطبيق
    loadInitialData();
</script>
</body>
</html>
