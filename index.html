<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>BlackRock ★ نجمتك ومستوى DZD/USD - تمرير سلس</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Tajawal', sans-serif;
}

:root {
  --bg: #020509;
  --g: #D4AF37;
  --g2: #C9992C;
  --w: #fff;
  --t2: rgba(255,255,255,0.6);
  --t3: rgba(255,255,255,0.3);
  --t5: rgba(255,255,255,0.05);
  --grn: #22C55E;
  --red: #EF4444;
  --blu: #3B82F6;
  --pur: #A855F7;
  --b2: rgba(255,255,255,0.07);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--w);
}

#root {
  height: 100%;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 480px;
  height: 100%;
  position: relative;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

/* ===== منطقة المحتوى القابلة للتمرير - الحل الجذري ===== */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 12px 20px 12px;
  /* إزالة أي transform أو animation تعيق التمرير */
  transform: none;
  animation: none;
}

/* لضمان ظهور شريط التمرير دائماً حتى لو كان المحتوى قليلاً */
.scroll-area {
  min-height: 0;
}

/* شريط التمرير جميل ومريح */
.scroll-area::-webkit-scrollbar {
  width: 4px;
}
.scroll-area::-webkit-scrollbar-track {
  background: var(--t5);
}
.scroll-area::-webkit-scrollbar-thumb {
  background: var(--g);
  border-radius: 4px;
}

/* ===== شريط التنقل السفلي ===== */
.nav {
  flex-shrink: 0;
  height: 72px;
  background: rgba(2,5,9,0.97);
  border-top: 1px solid rgba(212,175,55,0.15);
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--t3);
  font-weight: 800;
  font-size: 11px;
  padding: 6px 12px;
  cursor: pointer;
}

.nav button.on {
  color: var(--g);
}

/* ===== باقي الكاردات والأزرار (مصغرة لكن بنفس الجمال) ===== */
.card {
  background: linear-gradient(160deg, #0a1020, #070c18);
  border: 1px solid var(--b2);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}
.cg {
  border-color: rgba(212,175,55,0.25);
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 14px;
  padding: 12px 16px;
  font-weight: 800;
  font-size: 14px;
  width: 100%;
  cursor: pointer;
}
.bp {
  background: linear-gradient(135deg, var(--g), var(--g2));
  color: var(--bg);
}
.bs {
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--b2);
  color: var(--w);
}
.bd {
  background: rgba(239,68,68,0.1);
  border-color: rgba(239,68,68,0.2);
  color: var(--red);
}
.gt {
  background: linear-gradient(135deg, var(--g), var(--g2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.inp {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--b2);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--w);
  font-size: 14px;
  width: 100%;
}
.pgb {
  background: rgba(255,255,255,0.1);
  border-radius: 6px;
  height: 5px;
  overflow: hidden;
}
.pgf {
  height: 100%;
}
.pg-g {
  background: linear-gradient(90deg, var(--g), var(--g2));
}

/* شريط الأسعار المتحرك (نجمة كبيرة) */
.ticker-wrap {
  overflow: hidden;
  background: rgba(212,175,55,0.04);
  border-bottom: 1px solid rgba(212,175,55,0.1);
  margin-bottom: 12px;
}
.ticker {
  display: flex;
  animation: tickerMove 22s linear infinite;
  white-space: nowrap;
}
.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 22px;
  font-size: 16px;
  font-weight: 800;
  flex-shrink: 0;
}
@keyframes tickerMove {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* نجمة كبيرة */
.star-big {
  font-size: 32px;
  color: var(--g);
  display: inline-block;
}

/* مؤشر الحفظ */
#saveDot {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 10px;
  height: 10px;
  background: var(--grn);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 9999;
}
#saveDot.on {
  opacity: 1;
}

/* رسالة توست */
#toastMsg {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #16A34A;
  color: white;
  padding: 8px 20px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 800;
  z-index: 10000;
  display: none;
  white-space: nowrap;
}

/* عجلة الحظ - هيكل بسيط */
.wheel-overlay {
  position: fixed;
  inset: 0;
  background: rgba(2,5,9,0.95);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* Responsive */
@media (max-width: 450px) {
  .ticker-item { font-size: 14px; padding: 6px 16px; }
  .star-big { font-size: 28px; }
}
</style>
</head>
<body>
<div id="root">
  <div class="app" id="app"></div>
</div>
<div id="toastMsg"></div>
<div id="saveDot"></div>

<script>
// ======================== الترجمة والإعدادات ========================
let LANG = { code: 'ar' };
const TEXTS = {
  ar: {
    home: 'الرئيسية', tasks: 'المهام', upgrade: 'الترقية', account: 'حسابي',
    balance: 'الرصيد', team: 'الفريق', refTitle: 'الإحالة الذهبية', refDesc: '5% من دخل كل صديق مدى الحياة',
    copy: 'نسخ', share: 'مشاركة', portfolio: 'المحفظة', company: 'الشركة',
    earned: 'إجمالي الأرباح', refEarn: 'أرباح الإحالات', todayProfit: 'أرباح اليوم',
    dailyTasks: 'المهام اليومية', reward: 'المكافأة', start: 'ابدأ', seconds: 'ثانية',
    cancel: 'إلغاء', plans: 'خطط الاستثمار', available: 'الرصيد المتاح',
    free: 'مجاني', active: 'مفعّل', upgradeBtn: 'ترقية', daily: 'يومي', days: 'أيام', total: 'الإجمالي', monthly: 'شهري',
    myAccount: 'حسابي', refCode: 'كود الدعوة', security: 'الأمان', about: 'عن الشركة',
    wheel: 'عجلة الحظ', settings: 'الإعدادات', logout: 'تسجيل الخروج', contest: 'مسابقة الإحالة',
    contestDesc: '10 أصدقاء مشحونين = ترقية مجانية!', progress: 'تقدمك', goal: 'الهدف: 10 M1',
    spin: 'دور الآن', noSpins: 'لا دورات متبقية', prize: 'الجائزة',
    signIn: 'تسجيل الدخول', signUp: 'إنشاء حساب', username: 'اسم المستخدم', password: 'كلمة المرور', confirm: 'تأكيد',
    noAccount: 'ليس لديك حساب؟ سجل مجاناً', hasAccount: 'لديك حساب؟ سجل دخول', show: 'عرض', hide: 'إخفاء',
    notifications: 'الإشعارات', noNotifs: 'لا إشعارات',
    withdrawLock: 'السحب مقفل', withdrawReq: 'يتطلب M1 + 215 DZD',
    support: 'الدعم', copied: 'تم النسخ!', lang: 'English', ask: 'اسأل...',
    clearData: 'مسح البيانات', totalRefs: 'إجمالي الإحالات', refAmount: 'أرباح الإحالات',
    withdraw: 'سحب', quickWithdraw: 'سريع', dailyChange: 'تتغير يومياً',
    eachFriend: 'كل صديق = 🎡 دورة لك وله!', linkNote: '⚡ رابط مباشر للمشاركة',
    sub: 'منصة استثمار', contract: 'عقد رسمي مع الجزائر 2025-2027',
    manualSave: '💾 حفظ يدوي', savedMsg: '✓ تم حفظ كل البيانات'
  },
  en: {
    home: 'Home', tasks: 'Tasks', upgrade: 'Plans', account: 'Account',
    balance: 'Balance', team: 'Team', refTitle: 'Golden Referral', refDesc: "5% of each friend's income forever",
    copy: 'Copy', share: 'Share', portfolio: 'Portfolio', company: 'Company',
    earned: 'Total Earned', refEarn: 'Referral Earnings', todayProfit: "Today's Profit",
    dailyTasks: 'Daily Tasks', reward: 'Reward', start: 'Start', seconds: 'sec',
    cancel: 'Cancel', plans: 'Investment Plans', available: 'Available Balance',
    free: 'FREE', active: 'Active', upgradeBtn: 'Upgrade', daily: 'Daily', days: 'Days', total: 'Total', monthly: 'Monthly',
    myAccount: 'My Account', refCode: 'Referral Code', security: 'Security', about: 'About',
    wheel: 'Lucky Wheel', settings: 'Settings', logout: 'Sign Out', contest: 'Referral Contest',
    contestDesc: '10 paying friends = Free upgrade!', progress: 'Progress', goal: 'Goal: 10 M1 friends',
    spin: 'SPIN', noSpins: 'No spins left', prize: 'PRIZE',
    signIn: 'Sign In', signUp: 'Sign Up', username: 'Username', password: 'Password', confirm: 'Confirm',
    noAccount: "Don't have an account? Sign up", hasAccount: 'Have an account? Sign in', show: 'Show', hide: 'Hide',
    notifications: 'Notifications', noNotifs: 'No notifications',
    withdrawLock: 'Withdrawal Locked', withdrawReq: 'Requires M1 + 215 DZD',
    support: 'Support', copied: 'Copied!', lang: 'عربي', ask: 'Ask me...',
    clearData: 'Clear Data', totalRefs: 'Total Referrals', refAmount: 'Referral DZD',
    withdraw: 'Withdraw', quickWithdraw: 'Quick', dailyChange: 'Changes daily',
    eachFriend: 'Each friend = 🎡 spin for you + them!', linkNote: '⚡ Direct share link',
    sub: 'Investment Platform', contract: 'Official Algeria contract 2025-2027',
    manualSave: '💾 Save Now', savedMsg: '✓ All data saved'
  }
};
function t(key) { return (TEXTS[LANG.code] || TEXTS.ar)[key] || key; }

// ======================== التخزين المحلي مع نقطة حفظ ========================
const Storage = {
  set(key, val) {
    try { localStorage.setItem(`br_${key}`, JSON.stringify(val)); } catch(e) {}
    const dot = document.getElementById('saveDot');
    if(dot) { dot.classList.add('on'); setTimeout(() => dot.classList.remove('on'), 800); }
  },
  get(key) {
    try { return JSON.parse(localStorage.getItem(`br_${key}`)); } catch(e) { return null; }
  },
  remove(key) { localStorage.removeItem(`br_${key}`); }
};

// ======================== الحالة العامة ========================
let state = {
  user: null,
  currentTab: 'home',
  tasks: null,
  activeTaskId: null,
  countdownValue: 40,
  countdownInterval: null,
  wheelSpinning: false
};

// دوال مساعدة
function formatNumber(n) {
  n = n || 0;
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function showToast(msg, type = 'success') {
  const el = document.getElementById('toastMsg');
  if (!el) return;
  const colors = { success: '#16A34A', error: '#DC2626', warning: '#D97706' };
  el.style.backgroundColor = colors[type] || colors.success;
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}
function saveUser() {
  if (!state.user) return;
  Storage.set('currentUser', state.user);
  let users = Storage.get('allUsers') || [];
  const idx = users.findIndex(u => u.id === state.user.id);
  if (idx !== -1) users[idx] = state.user;
  else users.push(state.user);
  Storage.set('allUsers', users);
}
function updateUser(changes) {
  Object.assign(state.user, changes);
  saveUser();
  render();
}
function saveTasks() {
  if (state.tasks) Storage.set(`tasks_${state.user.id}`, { date: new Date().toDateString(), tasks: state.tasks });
}
function loadTasks() {
  const saved = Storage.get(`tasks_${state.user.id}`);
  if (saved && saved.date === new Date().toDateString()) return saved.tasks;
  // إنشاء مهام جديدة
  const levelData = getLevel(state.user.level || 'trial');
  const rewardPerTask = Math.max(43, Math.round(levelData.dy / 5));
  const arNames = ['مراجعة المحفظة', 'تقرير السوق', 'تحليل BLK', 'فحص الاستراتيجية', 'رسالة استثمارية', 'تحديث البيانات', 'مراجعة الأرباح', 'تحليل المؤشرات', 'أخبار الاستثمار', 'فحص الأسهم'];
  const enNames = ['Portfolio review', 'Market report', 'Analyze BLK', 'Check strategy', 'Investment msg', 'Update data', 'Review P&L', 'Market indicators', 'Investment news', 'Stock check'];
  const tasks = [];
  for (let i = 0; i < 5; i++) {
    tasks.push({
      id: i+1,
      ar: arNames[i % arNames.length],
      en: enNames[i % enNames.length],
      seconds: 40,
      reward: rewardPerTask,
      status: 'available'
    });
  }
  Storage.set(`tasks_${state.user.id}`, { date: new Date().toDateString(), tasks });
  return tasks;
}

// ======================== خطط الاستثمار ========================
const LEVELS = [
  { id: 'trial', name: 'Starter', price: 0, days: 3, daily: 43, total: 215, monthly: 0 },
  { id: 'm1', name: 'M1', price: 7000, days: 5, daily: 43, total: 215, monthly: 6450 },
  { id: 'm2', name: 'M2', price: 26600, days: 10, daily: 86, total: 860, monthly: 25800 },
  { id: 'm3', name: 'M3', price: 95000, days: 25, daily: 131, total: 3275, monthly: 98250 },
  { id: 'm4', name: 'M4', price: 300000, days: 50, daily: 222, total: 11100, monthly: 333000 },
  { id: 'm5', name: 'M5', price: 780000, days: 80, daily: 390, total: 31200, monthly: 936000 },
  { id: 'm6', name: 'M6', price: 1950000, days: 130, daily: 652, total: 84760, monthly: 2542800 },
  { id: 'g7', name: 'G7 Platinum', price: 4485000, days: 200, daily: 1068, total: 213600, monthly: 6408000 }
];
function getLevel(levelId) { return LEVELS.find(l => l.id === levelId) || LEVELS[0]; }
function getLevelName(levelId) { return getLevel(levelId).name; }

// رابط الإحالة
function getReferralLink() { return `${location.href.split('#')[0].split('?')[0]}?ref=${state.user.code}`; }

// ======================== واجهة المستخدم الرئيسية (مع نجوم كبيرة وتمرير سلس) ========================
function buildTicker() {
  const items = [
    { symbol: '★ BLACKROCK ★', value: '', change: '' },
    { symbol: '★ DZD/USD ★', value: '134.20', change: '+0.15%' },
    { symbol: '★ GOLD ★', value: '2342.8', change: '+0.82%' },
    { symbol: '★ S&P500 ★', value: '5248', change: '+0.45%' }
  ];
  let html = '<div class="ticker-wrap"><div class="ticker">';
  for (let i = 0; i < items.length; i++) {
    html += `<div class="ticker-item">
      <span style="color:var(--g); font-size:22px;">★</span>
      <strong style="font-size:16px;">${items[i].symbol}</strong>
      ${items[i].value ? `<span style="color:var(--g); font-size:16px;">${items[i].value}</span>` : ''}
      ${items[i].change ? `<span style="color:var(--grn);">▲ ${items[i].change}</span>` : ''}
    </div>`;
  }
  return html + '</div></div>';
}

function renderHome() {
  const u = state.user;
  const lvl = getLevel(u.level);
  let doneTasks = 0;
  if (state.tasks) doneTasks = state.tasks.filter(t => t.status === 'done').length;
  const contestProgress = (u.m1Refs || 0) % 10;
  return `
    <div class="card cg" style="text-align:center;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="star-big">★</span>
        <div><span class="gt" style="font-size:28px; font-weight:900;">BLACKROCK ★</span><br><span style="font-size:9px;">${t('sub')}</span></div>
        <button class="bs" style="padding:4px 12px;" onclick="toggleLanguage()">${t('lang')}</button>
      </div>
      ${buildTicker()}
    </div>
    <div class="card cg">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><div style="font-size:12px; color:var(--t3);">${t('balance')}</div>
        <div><span style="font-size:42px; font-weight:900;" class="gt">★ ${formatNumber(u.balance)}</span><span style="font-size:24px;"> ★</span></div>
        <div style="font-size:11px;">DZD ★</div></div>
        <div style="text-align:center;"><div style="font-size:42px;">★</div><div class="card" style="padding:4px 12px;">${getLevelName(u.level)}</div></div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px;">
        <div class="card" style="padding:8px;"><div style="font-size:20px; font-weight:800;">${u.teamCount || 0}</div><div>${t('team')}</div></div>
        <div class="card" style="padding:8px;"><div style="font-size:20px; font-weight:800;">${doneTasks}/5</div><div>${t('dailyTasks')}</div></div>
        <div class="card" style="padding:8px;"><div style="font-size:20px; font-weight:800;">+${lvl.daily}</div><div>${t('daily')}</div></div>
      </div>
    </div>
    <div class="card cg">
      <div style="display:flex; gap:10px; margin-bottom:10px;"><span class="star-big">★</span><div><strong>🎯 ${t('refTitle')}</strong><div>${t('refDesc')}</div></div></div>
      <div style="background:rgba(212,175,55,0.08); border-radius:12px; padding:8px; display:flex; gap:8px;"><span style="flex:1; font-size:14px;">${u.code}</span><button onclick="copyReferral()" class="bp" style="padding:6px 12px; width:auto;">${t('copy')}</button></div>
      <button class="btn bp" onclick="shareReferral()" style="margin-top:8px;">${t('share')}</button>
      <div style="font-size:10px; margin-top:6px;">${t('eachFriend')} ★</div>
    </div>
    <button class="btn bs" onclick="setTab('tasks')" style="margin-bottom:12px;">📋 ${t('dailyTasks')} ★ ${t('start')}</button>
    <button class="btn bp" onclick="requestWithdraw()">💸 ${t('withdraw')} ★ ${t('quickWithdraw')}</button>
  `;
}

function renderTasks() {
  if (!state.tasks) state.tasks = loadTasks();
  let html = `<div class="card cg"><div style="font-size:18px; font-weight:800;">★ ${t('dailyTasks')} ★</div></div>`;
  for (let tsk of state.tasks) {
    const isActive = (state.activeTaskId === tsk.id && tsk.status === 'active');
    const name = LANG.code === 'ar' ? tsk.ar : tsk.en;
    const progress = tsk.status === 'done' ? 100 : (isActive ? ((tsk.seconds - state.countdownValue) / tsk.seconds * 100) : 0);
    html += `<div class="card cg" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between;"><div><strong>${name}</strong><div>💰 ${tsk.reward} DZD · ${tsk.seconds} ${t('seconds')}</div></div><div class="gt" style="font-size:22px;">★</div></div>
      <div class="pgb" style="margin:8px 0;"><div class="pgf pg-g" style="width:${progress}%"></div></div>`;
    if (isActive) {
      html += `<div style="text-align:center;"><div style="font-size:48px; font-weight:900;" id="countdownValue">${state.countdownValue}</div><button class="btn bd" onclick="cancelActiveTask()">${t('cancel')}</button></div>`;
    } else if (tsk.status === 'available') {
      html += `<button class="btn bp" onclick="startTask(${tsk.id})">${t('start')} — ${tsk.seconds}${t('seconds')}</button>`;
    } else if (tsk.status === 'done') {
      html += `<div class="btn bn">✓ ${t('active')}</div>`;
    } else {
      html += `<div class="btn bd">✗ ${t('cancel')}</div>`;
    }
    html += `</div>`;
  }
  return html;
}

function renderUpgrade() {
  let html = `<div class="card cg"><div style="font-size:18px; font-weight:800;">★ ${t('plans')} ★</div><div>${t('available')}: ${formatNumber(state.user.balance)} DZD</div></div>`;
  for (let lv of LEVELS) {
    const locked = (state.user.balance < lv.price && lv.price > 0);
    const isCurrent = state.user.level === lv.id;
    html += `<div class="card cg" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between;"><div><strong>${lv.name}</strong><div>${lv.price === 0 ? t('free') : formatNumber(lv.price)+' DZD ★'}</div></div>${isCurrent ? '<span class="card" style="padding:2px 8px;">✓ '+t('active')+'</span>' : ''}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:6px 0;"><div>📅 ${lv.daily} ${t('daily')}</div><div>📆 ${lv.days} ${t('days')}</div><div>💰 ${lv.total} DZD</div></div>`;
    if (!locked && lv.price > 0 && !isCurrent) html += `<button class="btn bp" onclick="upgradeTo('${lv.id}')">${t('upgradeBtn')} → ${lv.name}</button>`;
    html += `</div>`;
  }
  return html;
}

function renderProfile() {
  const u = state.user;
  return `
    <div class="card cg" style="text-align:center;">
      <div class="star-big">★</div>
      <div style="font-size:24px; font-weight:800;">${u.un}</div>
      <div>${getLevelName(u.level)} ★</div>
      <div>💰 ${formatNumber(u.balance)} DZD</div>
      <div>👥 ${u.teamCount || 0} ${t('team')}</div>
      <div>🎡 ${u.wheelSpins || 0} ${t('wheel')}</div>
    </div>
    <div class="card cg">
      <div><strong>🔗 ${t('refCode')}</strong><div style="font-size:28px; letter-spacing:4px;" class="gt">${u.code} ★</div>
      <button class="btn bp" onclick="copyReferral()" style="margin-top:6px;">${t('copy')}</button>
      <button class="btn bs" onclick="shareReferral()" style="margin-top:6px;">${t('share')}</button></div>
    </div>
    <div class="card cg">
      <button class="btn bp" onclick="manualSaveAll()">💾 ${t('manualSave')}</button>
      <button class="btn bs" onclick="toggleLanguage()" style="margin-top:6px;">🌐 ${t('lang')}</button>
      <button class="btn bd" onclick="logout()" style="margin-top:6px;">🚪 ${t('logout')}</button>
    </div>
  `;
}

// ======================== دوال الأحداث الأساسية ========================
window.setTab = function(tab) {
  state.currentTab = tab;
  render();
};
window.startTask = function(taskId) {
  if (state.activeTaskId) { showToast(t('wait')+'...', 'warning'); return; }
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || task.status !== 'available') return;
  task.status = 'active';
  state.activeTaskId = taskId;
  state.countdownValue = task.seconds;
  saveTasks();
  render();
  if (state.countdownInterval) clearInterval(state.countdownInterval);
  state.countdownInterval = setInterval(() => {
    state.countdownValue--;
    const cdEl = document.getElementById('countdownValue');
    if (cdEl) cdEl.textContent = state.countdownValue;
    if (state.countdownValue <= 0) {
      clearInterval(state.countdownInterval);
      completeTask(taskId);
    }
  }, 1000);
};
function completeTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  task.status = 'done';
  state.activeTaskId = null;
  saveTasks();
  updateUser({
    balance: (state.user.balance || 0) + task.reward,
    taskBal: (state.user.taskBal || 0) + task.reward,
    totalEarned: (state.user.totalEarned || 0) + task.reward
  });
  showToast(`+${task.reward} DZD ★`);
  render();
}
window.cancelActiveTask = function() {
  if (!state.activeTaskId) return;
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  if (task) {
    task.status = 'failed';
    saveTasks();
  }
  clearInterval(state.countdownInterval);
  state.activeTaskId = null;
  render();
  showToast('❌ '+t('cancel'), 'error');
};
window.upgradeTo = function(levelId) {
  const lvl = LEVELS.find(l => l.id === levelId);
  if (!lvl) return;
  if (lvl.price > (state.user.balance || 0)) { showToast(t('available')+' '+t('noSpins'), 'error'); return; }
  updateUser({ level: levelId, balance: (state.user.balance || 0) - lvl.price, totalEarned: (state.user.totalEarned || 0) + lvl.price });
  showToast(`★ ${t('upgradeBtn')} → ${lvl.name} ★`);
};
window.copyReferral = function() {
  navigator.clipboard.writeText(getReferralLink());
  showToast(t('copied'));
};
window.shareReferral = function() {
  const link = getReferralLink();
  if (navigator.share) navigator.share({ title: 'BlackRock ★', text: t('refTitle'), url: link });
  else copyReferral();
};
window.requestWithdraw = function() {
  if (state.user.level === 'trial') { showToast(t('withdrawReq'), 'error'); return; }
  if ((state.user.taskBal || 0) < 215) { showToast(t('withdrawReq'), 'error'); return; }
  showToast('✓ '+t('withdraw')+' '+t('quickWithdraw'), 'success');
};
window.manualSaveAll = function() { saveUser(); saveTasks(); showToast(t('savedMsg')); };
window.toggleLanguage = function() {
  LANG.code = LANG.code === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = LANG.code;
  document.documentElement.dir = LANG.code === 'ar' ? 'rtl' : 'ltr';
  Storage.set('lang', LANG.code);
  render();
};
window.logout = function() {
  if (state.countdownInterval) clearInterval(state.countdownInterval);
  Storage.remove('currentUser');
  state.user = null;
  boot();
};

// عجلة الحظ (بسيطة مع حفظ)
window.openWheel = function() {
  if ((state.user.wheelSpins || 0) <= 0) { showToast(t('noSpins'), 'warning'); return; }
  const prizes = [43, 86, 215, 0, 430, 86, 215, 43];
  const rand = Math.floor(Math.random() * prizes.length);
  const prizeVal = prizes[rand];
  let newSpins = (state.user.wheelSpins || 0) - 1;
  if (prizeVal > 0) {
    updateUser({ balance: (state.user.balance || 0) + prizeVal, totalEarned: (state.user.totalEarned || 0) + prizeVal, wheelSpins: newSpins });
    showToast(`🎉 +${prizeVal} DZD ★`);
  } else {
    updateUser({ wheelSpins: newSpins + 1 });
    showToast(`🎠 ${t('prize')}`, 'warning');
  }
  render();
};

// ======================== التصيير الرئيسي ========================
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  let content = '';
  if (state.currentTab === 'home') content = renderHome();
  else if (state.currentTab === 'tasks') content = renderTasks();
  else if (state.currentTab === 'upgrade') content = renderUpgrade();
  else if (state.currentTab === 'account') content = renderProfile();
  const nav = `<div class="nav">
    <button class="${state.currentTab === 'home' ? 'on' : ''}" onclick="setTab('home')">🏠<span class="nbl">${t('home')}</span></button>
    <button class="${state.currentTab === 'tasks' ? 'on' : ''}" onclick="setTab('tasks')">📋<span class="nbl">${t('tasks')}</span></button>
    <button class="${state.currentTab === 'upgrade' ? 'on' : ''}" onclick="setTab('upgrade')">📈<span class="nbl">${t('upgrade')}</span></button>
    <button class="${state.currentTab === 'account' ? 'on' : ''}" onclick="setTab('account')">👤<span class="nbl">${t('account')}</span></button>
  </div>`;
  app.innerHTML = `<div class="scroll-area">${content}</div>${nav}`;
  // إعادة تعيين التمرير إلى الأعلى عند تغيير التبويب (اختياري)
  const scrollDiv = document.querySelector('.scroll-area');
  if (scrollDiv) scrollDiv.scrollTop = 0;
}

// ======================== نظام المصادقة والبدء ========================
function renderAuth() {
  const joinBonus = state.joinCode ? '<div class="card cg" style="margin-bottom:12px;">🎁 ★ دورة مجانية + 5% ★</div>' : '';
  const app = document.getElementById('app');
  app.innerHTML = `<div class="scroll-area" style="display:flex; align-items:center; justify-content:center;">
    <div style="width:100%; max-width:340px; padding:20px;">
      <div style="text-align:center; margin-bottom:20px;"><div style="font-size:48px;">★</div><div class="gt" style="font-size:32px; font-weight:900;">BLACKROCK ★</div><div>${t('sub')}</div></div>
      ${joinBonus}
      <div><input id="authUsername" class="inp" placeholder="${t('username')}" style="margin-bottom:8px;"><input id="authPassword" class="inp" type="password" placeholder="${t('password')}"><div id="signupConfirmDiv" style="display:none; margin-top:8px;"><input id="authConfirm" class="inp" type="password" placeholder="${t('confirm')}"></div>
      <button id="authActionBtn" class="btn bp" style="margin-top:12px;" onclick="performAuth()">${t('signIn')}</button>
      <button onclick="toggleAuthMode()" id="toggleAuthModeBtn" style="background:none; border:none; color:var(--g); margin-top:12px;">${t('noAccount')}</button></div>
      <div class="card cg" style="margin-top:16px; font-size:11px;">🔒 ${t('contract')} ★ AES-256 ★</div>
    </div>
  </div>`;
  window.authMode = 'login';
  window.toggleAuthMode = function() {
    const isLogin = authMode === 'login';
    document.getElementById('signupConfirmDiv').style.display = isLogin ? 'block' : 'none';
    document.getElementById('authActionBtn').textContent = isLogin ? t('signUp') : t('signIn');
    document.getElementById('toggleAuthModeBtn').textContent = isLogin ? t('hasAccount') : t('noAccount');
    authMode = isLogin ? 'signup' : 'login';
  };
  window.performAuth = function() {
    const un = document.getElementById('authUsername').value.trim();
    const pw = document.getElementById('authPassword').value.trim();
    if (!un || !pw) { showToast(t('username')+'/'+t('password')+' '+t('noAccount'), 'error'); return; }
    if (authMode === 'signup') {
      const conf = document.getElementById('authConfirm').value;
      if (pw !== conf) { showToast(t('confirm')+' '+t('noAccount'), 'error'); return; }
      let users = Storage.get('allUsers') || [];
      if (users.find(u => u.un === un)) { showToast(t('username')+' '+t('noAccount'), 'error'); return; }
      const newUser = {
        id: Date.now(), un: un, pw: pw, code: Math.random().toString(36).substring(2,8).toUpperCase(),
        balance: 0, taskBal: 0, refEarn: 0, teamCount: 0, wheelSpins: state.joinCode ? 1 : 0,
        m1Refs: 0, level: 'trial', totalEarned: 0, avatar: null, joined: new Date().toISOString(),
        notifs: []
      };
      if (state.joinCode) {
        const referrer = users.find(u => u.code === state.joinCode);
        if (referrer) {
          referrer.wheelSpins = (referrer.wheelSpins || 0) + 1;
          referrer.teamCount = (referrer.teamCount || 0) + 1;
          if (!referrer.notifs) referrer.notifs = [];
          referrer.notifs.push({ title: '★ New friend ★', desc: un + ' joined', time: new Date().toLocaleString() });
        }
      }
      users.push(newUser);
      Storage.set('allUsers', users);
      Storage.set('currentUser', newUser);
      state.user = newUser;
      showToast('★ '+t('signUp')+' ★');
      render();
    } else {
      const users = Storage.get('allUsers') || [];
      const found = users.find(u => u.un === un && u.pw === pw);
      if (found) {
        Storage.set('currentUser', found);
        state.user = found;
        showToast(`★ ${t('signIn')} ★`);
        render();
      } else showToast(t('noAccount'), 'error');
    }
  };
}

function boot() {
  const savedLang = Storage.get('lang');
  if (savedLang) LANG.code = savedLang;
  document.documentElement.lang = LANG.code;
  document.documentElement.dir = LANG.code === 'ar' ? 'rtl' : 'ltr';
  const cur = Storage.get('currentUser');
  if (cur) {
    state.user = cur;
    state.tasks = loadTasks();
    render();
  } else {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('ref')) state.joinCode = urlParams.get('ref');
    renderAuth();
  }
}

boot();
</script>
