<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKROCK GLOBAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0c0c0c; color: white; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .gold-card { background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%); border: 1px solid #332b00; }
        .gold-text { color: #ffcc00; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; color: #888; }
        .nav-item.active { color: #ffcc00; }
    </style>
</head>
<body>
    <div class="flex justify-between items-center p-4 bg-[#111]">
        <i class="fas fa-star text-green-500 text-2xl"></i>
        <h1 class="font-bold text-lg">BLACKROCK GLOBAL</h1>
        <div class="w-6"></div>
    </div>

    <div class="p-4 text-center">
        <h2 class="gold-text font-bold text-xl tracking-widest uppercase">Blackrock</h2>
        <span class="bg-[#0f2d1f] text-green-400 text-xs px-3 py-1 rounded-full mt-2 inline-block border border-green-900 shadow-lg">SECURE V3</span>
    </div>

    <div class="mx-4 p-6 rounded-3xl gold-card relative overflow-hidden shadow-2xl">
        <div class="text-right text-gray-400 text-sm mb-2">💼 رصيدك الإجمالي</div>
        <div class="text-center">
            <div class="text-5xl font-bold gold-text tracking-tighter">0.00</div>
            <div class="text-gray-400 mt-2 text-sm">دينار جزائري</div>
        </div>
        <div class="flex justify-between mt-6">
            <div class="bg-[#1a1a1a] p-3 rounded-2xl w-[48%] text-center border border-gray-800">
                <div class="text-[10px] text-gray-500 uppercase mb-1">الربح اليومي</div>
                <div class="text-green-500 font-bold text-sm">DZD 215+</div>
            </div>
            <div class="bg-[#1a1a1a] p-3 rounded-2xl w-[48%] text-center border border-gray-800">
                <div class="text-[10px] text-gray-500 uppercase mb-1">إجمالي الأرباح</div>
                <div class="gold-text font-bold text-sm">DZD 0</div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-4 gap-2 p-6">
        <div class="flex flex-col items-center"><div class="bg-[#222] p-4 rounded-2xl mb-2 text-[#ffcc00] shadow-md"><i class="fas fa-arrow-up"></i></div><span class="text-[10px]">إيداع</span></div>
        <div class="flex flex-col items-center"><div class="bg-[#0f2d1f] p-4 rounded-2xl mb-2 text-green-500 shadow-md"><i class="fas fa-arrow-down"></i></div><span class="text-[10px]">سحب</span></div>
        <div class="flex flex-col items-center"><div class="bg-[#0f172a] p-4 rounded-2xl mb-2 text-blue-400 shadow-md"><i class="fas fa-sync-alt"></i></div><span class="text-[10px]">تحويل</span></div>
        <div class="flex flex-col items-center"><div class="bg-[#2d0f1a] p-4 rounded-2xl mb-2 text-red-400 shadow-md"><i class="fas fa-users"></i></div><span class="text-[10px]">إحالة</span></div>
    </div>

    <div class="mx-4 p-4 rounded-2xl bg-[#111] border border-gray-800 mb-6">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-gray-400">المستوى الحالي: <span class="text-blue-400 font-bold">VIP 0</span></span>
            <span class="text-[10px] text-gray-500">الترقية لـ VIP 1</span>
        </div>
        <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
            <div class="bg-blue-500 h-full w-[5%] shadow-[0_0_8px_#3b82f6]"></div>
        </div>
    </div>

    <div class="fixed bottom-0 w-full bg-[#0a0a0a] border-t border-gray-800 flex justify-around py-3 px-2 z-50">
        <div class="nav-item active"><i class="fas fa-home text-xl mb-1"></i><span class="text-[10px]">الرئيسية</span></div>
        <div class="nav-item"><i class="fas fa-bolt text-xl mb-1"></i><span class="text-[10px]">المهام</span></div>
        <div class="nav-item"><i class="fas fa-gem text-xl mb-1"></i><span class="text-[10px]">الترقية</span></div>
        <div class="nav-item"><i class="fas fa-user text-xl mb-1"></i><span class="text-[10px]">حسابي</span></div>
    </div>
</body>
</html>
