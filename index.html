<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BlackRock Investment Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#060912;--c1:#0d1225;--gold:#F5C518;--gold2:#FF9800;--gold3:#FF6D00;--grn:#00E676;--red:#FF1744;--blu:#2979FF;--br:rgba(255,255,255,.07);}
*{font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:#fff;}
#root{height:100%;display:flex;justify-content:center;}
.app{width:100%;max-width:430px;height:100%;position:relative;overflow:hidden;background:var(--bg);}
.scr{position:absolute;top:0;left:0;right:0;bottom:74px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.scr::-webkit-scrollbar{display:none;}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-6px,0)}}
@keyframes glow{0%,100%{box-shadow:0 0 15px rgba(245,197,24,.3)}50%{box-shadow:0 0 35px rgba(245,197,24,.6)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes progressFill{from{width:0}to{width:100%}}
@keyframes td{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.fu{animation:fadeUp .22s ease both;}
.fi{animation:fadeIn .18s ease both;}
.float{animation:float 3s ease-in-out infinite;}
.glow{animation:glow 2.5s infinite;}
.card{background:linear-gradient(135deg,rgba(17,24,39,.97),rgba(13,18,37,.99));border:1px solid var(--br);border-radius:15px;}
.card-gold{border-color:rgba(245,197,24,.2);}
.card-green{border-color:rgba(0,230,118,.15);}
.card-red{border-color:rgba(255,23,68,.2);}
.gt{background:linear-gradient(135deg,#F5C518,#FF9800,#FF6D00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:800;border-radius:12px;padding:12px 16px;font-size:14px;width:100%;}
.btn-gold{background:linear-gradient(135deg,#F5C518,#FF9800,#FF6D00);color:#fff;box-shadow:0 4px 14px rgba(245,197,24,.28);}
.btn-gold:active{opacity:.85;transform:scale(.98);}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--br);color:#fff;}
.btn-red{background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.22);color:#FF1744;}
.btn-green{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.22);color:#00E676;}
.nav{position:absolute;bottom:0;left:0;right:0;height:74px;background:rgba(6,9,18,.97);border-top:1px solid var(--br);display:flex;justify-content:space-around;align-items:center;z-index:100;}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.32);padding:4px 12px;position:relative;}
.nb.active{color:var(--gold);}
.nb.active::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:16px;height:2px;background:linear-gradient(90deg,#F5C518,#FF9800);border-radius:2px;}
.nb-lbl{font-size:10px;font-weight:700;margin-top:1px;}
.bdg{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:var(--red);border-radius:8px;border:1.5px solid var(--bg);font-size:9px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.inp{background:rgba(255,255,255,.04);border:1px solid var(--br);border-radius:12px;color:#fff;padding:12px 15px;font-size:14px;font-family:'Tajawal',sans-serif;font-weight:700;outline:none;width:100%;}
.inp:focus{border-color:rgba(245,197,24,.38);}
.inp::placeholder{color:rgba(255,255,255,.24);}
.sho{position:fixed;inset:0;background:rgba(4,6,14,.82);z-index:200;display:flex;align-items:flex-end;}
.sh{background:linear-gradient(180deg,#0d1225,#080d1a);border-radius:22px 22px 0 0;border:1px solid var(--br);border-bottom:none;width:100%;max-height:88vh;overflow-y:auto;animation:sheetUp .28s cubic-bezier(.16,1,.3,1);}
.sh::-webkit-scrollbar{display:none;}
.sec{background:rgba(0,230,118,.09);border:1px solid rgba(0,230,118,.18);border-radius:100px;padding:3px 9px;display:inline-flex;align-items:center;gap:3px;}
.prog{background:rgba(255,255,255,.07);border-radius:6px;height:6px;overflow:hidden;}
.pg{height:100%;border-radius:6px;}
.pg-gold{background:linear-gradient(90deg,#F5C518,#FF9800);}
.pg-green{background:linear-gradient(90deg,#00E676,#00C853);}
.pg-red{background:linear-gradient(90deg,#FF1744,#D50000);}
.stat{background:linear-gradient(135deg,rgba(245,197,24,.07),rgba(255,152,0,.04));border:1px solid rgba(245,197,24,.13);border-radius:13px;padding:11px 7px;text-align:center;}
.money{font-family:'Montserrat',sans-serif;font-weight:900;letter-spacing:-0.5px;}
.task-avail{border-color:rgba(245,197,24,.18)!important;}
.task-active{border-color:rgba(245,197,24,.48)!important;background:linear-gradient(135deg,rgba(24,19,4,.45),rgba(13,18,37,.99))!important;}
.task-done{border-color:rgba(0,230,118,.32)!important;background:linear-gradient(135deg,rgba(0,18,9,.3),rgba(13,18,37,.99))!important;}
.task-fail{border-color:rgba(255,23,68,.22)!important;opacity:.75;}
.lvc{background:linear-gradient(135deg,rgba(17,24,39,.97),rgba(13,18,37,.99));border:1px solid rgba(245,197,24,.1);border-radius:15px;padding:13px;margin-bottom:9px;}
.lvc.locked{border-color:rgba(255,23,68,.09);opacity:.68;}
.lvc.current{border-color:rgba(0,230,118,.38);}
.bubble-ai{background:rgba(16,22,38,.97);border:1px solid var(--br);border-radius:13px;border-top-left-radius:4px;padding:10px 13px;max-width:84%;font-size:13px;line-height:1.65;color:rgba(255,255,255,.87);white-space:pre-wrap;}
.bubble-u{background:linear-gradient(135deg,#F5C518,#FF6D00);border-radius:13px;border-top-right-radius:4px;padding:10px 13px;max-width:84%;font-size:13px;line-height:1.65;color:#fff;white-space:pre-wrap;}
.td span{display:inline-block;width:7px;height:7px;background:rgba(255,255,255,.38);border-radius:50%;margin:0 2px;}
.td span:nth-child(1){animation:td 1.1s .0s infinite ease}
.td span:nth-child(2){animation:td 1.1s .2s infinite ease}
.td span:nth-child(3){animation:td 1.1s .4s infinite ease}
.ai-fab{position:absolute;bottom:82px;left:12px;z-index:99;width:50px;height:50px;background:linear-gradient(135deg,#F5C518,#FF6D00);border-radius:14px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(245,197,24,.32);}
.ai-dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;background:#00E676;border-radius:50%;border:2px solid var(--bg);animation:dotPulse 1.5s infinite;}
.av-ring{background:linear-gradient(135deg,#F5C518,#FF9800,#FF6D00);padding:2.5px;border-radius:50%;display:inline-block;}
.proof{background:linear-gradient(135deg,rgba(0,230,118,.06),rgba(0,200,83,.03));border:1px solid rgba(0,230,118,.13);}
.cd-num{font-family:'Montserrat',sans-serif;font-weight:900;font-size:44px;line-height:1;background:linear-gradient(135deg,#F5C518,#FF9800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.wheel-outer{width:268px;height:268px;border-radius:50%;position:relative;box-shadow:0 0 40px rgba(245,197,24,.18);}
.wheel-ptr{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid #FF1744;z-index:10;filter:drop-shadow(0 0 5px rgba(255,23,68,.55));}
.wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:linear-gradient(135deg,#080d1a,#04060e);border-radius:50%;border:2.5px solid #F5C518;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 12px rgba(245,197,24,.28);}
.toast-el{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;padding:9px 18px;border-radius:100px;font-size:13px;font-weight:800;color:#fff;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;animation:fadeUp .18s ease;display:none;}
</style>

<body>
<div id="root"></div>
<div class="toast-el" id="toast"></div>
<script>
// ═══════════════════════════════════════════════
// BLACKROCK v3 — Pure Vanilla JS, Zero Lag
// ═══════════════════════════════════════════════

// ── DB ──
const DB={
  g(k){try{const v=localStorage.getItem('br3_'+k);return v?JSON.parse(v):null;}catch{return null;}},
  s(k,v){try{localStorage.setItem('br3_'+k,JSON.stringify(v));}catch{}},
  d(k){try{localStorage.removeItem('br3_'+k);}catch{}}
};

// ── STATE ──
const S={user:null,tab:'home',activeTask:null,cdVal:40,cdTimer:null,tasks:null,sheetEl:null,aiOpen:false,wheelRot:0,wheelSpinning:false};

// ── UTILS ──
function fmt(n){n=parseFloat(n)||0;if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});}
function genCode(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');}
function today(){return new Date().toDateString();}
let _tt;
function toast(msg,type='info'){
  clearTimeout(_tt);
  const colors={success:'#00A846',error:'#C62828',warning:'#E65100',info:'#1565C0'};
  const icons={success:'✓ ',error:'✗ ',warning:'⚠ ',info:'ℹ '};
  const el=document.getElementById('toast');
  el.style.background=colors[type]||colors.info;
  el.textContent=(icons[type]||'')+msg;
  el.style.display='block';
  el.style.animation='none';void el.offsetWidth;el.style.animation='fadeUp .18s ease';
  _tt=setTimeout(()=>{el.style.display='none';},2800);
}
function $(id){return document.getElementById(id);}

// ── USER ──
function saveUser(){
  DB.s('cur',S.user);
  const users=DB.g('users')||[];
  const i=users.findIndex(u=>u.id===S.user.id);
  if(i>=0)users[i]=S.user;else users.push(S.user);
  DB.s('users',users);
}
function upd(ch){Object.assign(S.user,ch);saveUser();}

// ── TASKS ──
function loadTasks(){
  const saved=DB.g('tk_'+S.user.id);
  if(saved&&saved.date===today())return saved.tasks;
  const t=[1,2,3,4,5].map(id=>({id,status:'available'}));
  DB.s('tk_'+S.user.id,{date:today(),tasks:t});
  return t;
}
function saveTasks(){DB.s('tk_'+S.user.id,{date:today(),tasks:S.tasks});}

// ── SHEET ──
function openSheet(html,title=''){
  closeSheet();
  const ov=document.createElement('div');
  ov.className='sho fi';ov.id='sho';
  ov.onclick=e=>{if(e.target===ov)closeSheet();};
  const sh=document.createElement('div');sh.className='sh';
  sh.innerHTML=`<div style="width:34px;height:3.5px;background:rgba(255,255,255,.14);border-radius:2px;margin:11px auto 8px"></div>${title?`<div style="text-align:center;font-size:16px;font-weight:900;color:#fff;padding:0 16px 11px;border-bottom:1px solid var(--br)">${title}</div>`:''}<div style="padding:14px 14px 40px">${html}</div>`;
  ov.appendChild(sh);document.body.appendChild(ov);S.sheetEl=ov;
}
function closeSheet(){if(S.sheetEl){S.sheetEl.remove();S.sheetEl=null;}}
window.closeSheet=closeSheet;

// ── LEVELS ──

  {id:'m4',name:'M4',price:300000,days:50,daily:222,total:11100,monthly:333000,yearly:3996000},
  {id:'m5',name:'M5',price:780000,days:80,daily:390,total:31200,monthly:936000,yearly:11232000},
  {id:'m6',name:'M6',price:1950000,days:130,daily:652,total:84760,monthly:2542800,yearly:30513600},
  {id:'g7',name:'G7',price:4485000,days:200,daily:1068,total:213600,monthly:6408000,yearly:76896000},

  {k:['شركة','blackrock','بلاك','عن التطبيق','من انتم','معلومات الشركة'],r:`🏢 شركة BlackRock, Inc\n\nتأسست عام 1988 في نيويورك على يد لاري فينك.\n\n📊 أرقام حقيقية موثقة:\n• تدير 10.2 تريليون دولار من الأصول\n• مدرجة في بورصة نيويورك NYSE: BLK\n• EIN: 32-0174431\n• تعمل في 38 دولة حول العالم\n• +19,000 موظف متخصص\n\n🇩🇿 عقد الجزائر الرسمي:\nعقد رسمي مع الجزائر يناير 2025 — ديسمبر 2028.\n\n🛡️ الأمان: SSL/TLS 3.0 — AES-256\n\nاستثمار حقيقي وموثوق 100%! ✅`},
  {k:['كيف ربح','كيف اكسب','كيف احصل على المال','اكسب','طريقة الربح','من اين المال'],r:`💡 طرق الربح في BlackRock:\n\n1️⃣ المهام اليومية (الأسرع):\n• 5 مهام يومياً × 43 DZD = 215 DZD/يوم\n• كل مهمة تستغرق 40 ثانية فقط!\n• تتجدد كل يوم تلقائياً عند منتصف الليل\n\n2️⃣ نظام الإحالات (الأذكى):\n• شارك رابطك مع أصدقائك\n• تربح 5% من أرباحهم اليومية مدى الحياة!\n• 10 أصدقاء = ~107 DZD/يوم تلقائياً بدون مجهود!\n\n3️⃣ الترقية الاستثمارية (الأكثر ربحاً):\n• M1: 43 DZD/يوم\n• G7: 1,068 DZD/يوم!\n\n💪 ابدأ بالمهام اليومية الآن وادعُ أصدقاءك فوراً!`},
  {k:['مهمة','مهام','task','يومية','40 ثانية'],r:`⏱️ نظام المهام اليومية:\n\n• لديك 5 مهام يومياً مستقلة\n• كل مهمة = 40 ثانية انتظار = 43 DZD\n• يمكنك لعب أي مهمة بشكل مستقل دون الحاجة لإكمال الأخرى\n• إجمالي اليوم: 215 DZD\n• تتجدد المهام كل يوم عند منتصف الليل\n\n⚠️ تنبيه مهم:\nإذا ضغطت "إلغاء" أثناء المهمة تخسرها حتى الغد!\n\n💡 نصيحة احترافية:\nلا تغلق التطبيق أثناء المهمة. انتظر الـ40 ثانية بصبر وخذ المكافأة كاملة!\n\nابدأ الآن من تبويب المهام ⚡`},
  {k:['احال','إحال','رابط','صديق','فريق','5%','خمسة'],r:`🎯 نظام الإحالات الذهبي:\n\nكيف يعمل؟\n• شارك رابطك الشخصي مع أصدقائك\n• عندما يسجل أي صديق برابطك تحصل على:\n  ✅ دورة عجلة حظ مجانية 🎡\n  ✅ 5% من أرباحه اليومية مدى الحياة!\n\n💰 حسابات حقيقية:\n• صديق واحد يربح 215 DZD/يوم → تكسب 10.75 DZD\n• 10 أصدقاء → ~107 DZD/يوم بدون أي مجهود\n• 50 صديقاً → ~537 DZD/يوم!\n\n🚀 الإحالة هي أقوى طريقة للربح السلبي!\nانشر رابطك في كل مجموعة واتساب وتيليجرام الآن!`},
  {k:['سحب','اسحب','withdraw','استرجاع'],r:`💳 نظام السحب:\n\nالشروط:\n• يجب أن تكون مرقياً إلى M1 على الأقل\n• الحد الأدنى للسحب: 215 DZD من رصيد المهام\n• وقت المعالجة: 24-48 ساعة\n\nطرق السحب:\n💳 CCP (بريد الجزائر)\n🏦 DZ Bank\n💻 PayPal\n\n⚠️ ملاحظة مهمة:\nرصيد الترقية لا يُسحب مباشرةً، بل هو رأس مال يولّد أرباحاً يومية تُسحب لاحقاً.\n\nللسحب: اذهب الرئيسية → سحب`},

  {k:['ترقية','upgrade','مستوى','m1','m2','g7','استثمار'],r:`💎 مستويات الاستثمار:\n\nالمستوى | السعر | الربح اليومي\n━━━━━━━━━━━━━━━━━━━━\nتجريب | مجاني | 43 DZD (3 أيام)\nM1 | 7,000 DZD | 43 DZD/يوم\nM2 | 26,600 DZD | 86 DZD/يوم\nM3 | 95,000 DZD | 131 DZD/يوم\nM4 | 300,000 DZD | 222 DZD/يوم\nM5 | 780,000 DZD | 390 DZD/يوم\nM6 | 1,950,000 DZD | 652 DZD/يوم\nG7 | 4,485,000 DZD | 1,068 DZD/يوم\n\n💡 ابدأ بالتجربة المجانية ثم رقِّ إلى M1!\nللترقية تواصل مع الدعم في قسم الترقية 📞`},

function aiResp(txt){
  const lo=txt.toLowerCase();
  for(const e of KB)if(e.k.some(k=>lo.includes(k)))return e.r;
  return `🤔 سؤال ممتاز!\n\nأعد كتابة سؤالك بشكل أوضح. يمكنني مساعدتك في:\n\n💰 "كيف أربح؟"\n🏢 "ما هي الشركة؟"\n⏱️ "المهام"\n🎯 "الإحالات"\n💳 "السحب"\n💎 "الترقية"\n🎡 "عجلة الحظ"\n\nاكتب سؤالك وسأجيبك! 😊`;
}

    <div style="position:relative;z-index:1;width:100%;max-width:340px" class="fu">
      <div style="text-align:center;margin-bottom:26px">
        <div class="glow" style="width:84px;height:84px;background:linear-gradient(135deg,#F5C518,#FF9800,#FF6D00);border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 13px;box-shadow:0 10px 32px rgba(245,197,24,.22)">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9l4-6z"/><path d="M11 3 5 9l6 13V3z"/><path d="m13 22 6-13-6-6V22z"/><path d="m2 9 10 4 10-4"/></svg>
        </div>
        <div style="font-family:Montserrat,sans-serif;font-size:31px;font-weight:900;letter-spacing:2px" class="gt">BLACKROCK</div>
        <div style="color:rgba(255,255,255,.33);font-size:11.5px;margin-top:5px">BlackRock, Inc — Investment Platform</div>
        <div class="sec" style="margin-top:8px"><span style="color:#00E676">${I.shield}</span><span style="color:#00E676;font-size:9.5px;font-weight:900;letter-spacing:.5px">SECURE V3</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px">
        <input class="inp" id="a-un" placeholder="اسم المستخدم" style="text-align:center">
        <div style="position:relative">
          <input class="inp" id="a-pw" type="password" placeholder="كلمة المرور" style="text-align:center;width:100%">
          <button onclick="authTogglePw()" id="pw-tog" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.28);font-size:11px;font-weight:700;cursor:pointer">عرض</button>
        </div>
        <div id="cp-w" style="display:none"><input class="inp" id="a-cp" type="password" placeholder="تأكيد كلمة المرور" style="text-align:center"></div>
        <button class="btn btn-gold" id="auth-btn" onclick="doAuth()" style="margin-top:3px;font-size:15px">تسجيل الدخول</button>
      </div>
      <button onclick="authToggleMode()" id="mode-btn" style="display:block;margin:11px auto 0;background:none;border:none;color:rgba(255,255,255,.38);font-size:12px;cursor:pointer;font-weight:700">ليس لديك حساب؟ سجل الآن مجاناً</button>
      <div class="card card-green" style="border-radius:13px;padding:13px;margin-top:16px">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px"><span style="color:#00E676">${I.shield}</span><span style="color:#00E676;font-size:13px;font-weight:800">منصة آمنة 100%</span></div>
        <div style="font-size:11px;color:rgba(255,255,255,.38);line-height:1.7">• SSL/TLS 3.0 — AES-256 Encryption<br>• NYSE: BLK — EIN: 32-0174431<br>• عقد الجزائر: يناير 2025 — ديسمبر 2028</div>
      </div>
    </div>
  </div>`;
  let loginMode=true;
  window.authTogglePw=()=>{const i=$('a-pw'),b=$('pw-tog');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'عرض':'إخفاء';};
  window.authToggleMode=()=>{loginMode=!loginMode;$('cp-w').style.display=loginMode?'none':'block';$('auth-btn').textContent=loginMode?'تسجيل الدخول':'إنشاء حساب مجاني';$('mode-btn').textContent=loginMode?'ليس لديك حساب؟ سجل الآن مجاناً':'لديك حساب؟ سجل الدخول';};
  window.doAuth=()=>{
    const un=$('a-un').value.trim(),pw=$('a-pw').value.trim(),cp=$('a-cp')?.value.trim()||'';
    if(!un||!pw){toast('يرجى ملء جميع الحقول','error');return;}
    if(!loginMode&&pw!==cp){toast('كلمتا المرور غير متطابقتين','error');return;}
    $('auth-btn').textContent='جاري...';$('auth-btn').disabled=true;
    setTimeout(()=>{
      const users=DB.g('users')||[];
      if(loginMode){
        const u=users.find(x=>x.un===un&&x.pw===pw);
        if(u){DB.s('cur',u);S.user=u;toast('مرحباً! 🎉','success');launchApp();}
        else{toast('بيانات غير صحيحة','error');$('auth-btn').textContent='تسجيل الدخول';$('auth-btn').disabled=false;}
      } else {
        if(users.find(x=>x.un===un)){toast('اسم المستخدم موجود','error');$('auth-btn').textContent='إنشاء حساب مجاني';$('auth-btn').disabled=false;return;}
        const code=genCode();
        const u={id:Date.now(),un,pw,code,ref:'blackrock.app/ref/'+code,
          balance:0,taskBal:0,refEarn:0,teamCount:0,wheelSpins:0,level:null,
          totalEarned:0,avatar:null,joined:new Date().toISOString(),
          notifs:[
            {id:1,title:'مرحباً بك في BlackRock! 🎉',desc:'ابدأ رحلتك الاستثمارية. أكمل 5 مهام يومياً وادعُ أصدقاءك!',t:'الآن',r:false},
            {id:2,title:'💡 نصيحة ذهبية',desc:'ادعُ أصدقاءك برابطك الخاص واربح 5% من دخلهم مدى الحياة مجاناً!',t:'الآن',r:false},
          ]};
        users.push(u);DB.s('users',users);DB.s('cur',u);S.user=u;
        toast('تم إنشاء الحساب! 🎉','success');launchApp();
      }
    },500);
  };
}

function taskCardHtml(t){

  const prog=t.status==='done'?100:isAct?((40-S.cdVal)/40*100):0;
  return`
  <div class="card ${cls}" style="border-radius:14px;padding:12px;margin-bottom:8px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:9px">
        <div style="width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${t.status==='done'?'rgba(0,230,118,.13)':t.status==='failed'?'rgba(255,23,68,.1)':'linear-gradient(135deg,#F5C518,#FF6D00)'}">
          <span style="color:${t.status==='done'?'#00E676':t.status==='failed'?'#FF1744':'white'}">${t.status==='done'?I.check:t.status==='failed'?I.x:I.rocket}</span>

          <div style="color:rgba(255,255,255,.38);font-size:11.5px">+DZD 43</div>
        </div>
      </div>
      <div class="money" style="font-size:19px;font-weight:900;color:${t.status==='done'?'#00E676':t.status==='failed'?'rgba(255,80,100,.6)':'#F5C518'}">+43</div>
    </div>
    <div class="prog" style="margin-bottom:8px"><div class="pg ${t.status==='done'?'pg-green':t.status==='failed'?'pg-red':'pg-gold'}" style="width:${prog}%"></div></div>

window.setTab=function(id){if(S.tab===id)return;S.tab=id;render();};

window.startTask=function(id){
  if(S.activeTask!==null){toast('هناك مهمة جارية! أكملها أولاً','warning');return;}
  const t=S.tasks.find(x=>x.id===id);
  if(!t||t.status!=='available')return;
  t.status='active';S.activeTask=id;S.cdVal=40;saveTasks();render();
  toast('⏱️ المهمة بدأت! انتظر 40 ثانية...','info');
  S.cdTimer=setInterval(()=>{
    S.cdVal--;
    const cdEl=$('cd-'+id),cbEl=$('cb-'+id);
    if(cdEl)cdEl.textContent=S.cdVal;
    if(cbEl)cbEl.style.width=((40-S.cdVal)/40*100)+'%';
    if(S.cdVal<=0){clearInterval(S.cdTimer);S.cdTimer=null;completeTask(id);}
  },1000);
};

function completeTask(id){
  const t=S.tasks.find(x=>x.id===id);
  if(!t)return;
  t.status='done';S.activeTask=null;saveTasks();
