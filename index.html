<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BlackRock Investment</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;overflow:hidden;background:#020509;color:#fff;font-family:Tajawal,sans-serif}
:root{--bg:#020509;--card:#07101f;--card2:#0b1325;--gold:#d4af37;--gold2:#c9992c;--gold3:#b8860b;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--mut:rgba(255,255,255,.42);--line:rgba(255,255,255,.08)}
::-webkit-scrollbar{display:none}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.app{width:100%;max-width:430px;height:100%;margin:auto;position:relative;overflow:hidden;background:#020509}
.scr{position:absolute;inset:0 0 68px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:14px}
.nav{position:absolute;bottom:0;left:0;right:0;height:68px;background:rgba(2,5,9,.98);border-top:1px solid rgba(212,175,55,.12);display:flex;z-index:50}
.nav button{flex:1;background:none;border:0;color:rgba(255,255,255,.34);font-family:Tajawal;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nav button.on{color:var(--gold)}
.nav button.on:before{content:"";position:absolute;top:0;width:30px;height:3px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:0 0 3px 3px}
.badge{position:absolute;top:4px;right:24px;background:var(--red);color:#fff;border-radius:99px;font-size:9px;padding:1px 5px;border:2px solid var(--bg)}
.card{background:linear-gradient(160deg,rgba(10,16,32,.98),rgba(7,12,24,.99));border:1px solid var(--line);border-radius:16px}
.gold{background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold3))}
.gt{background:linear-gradient(135deg,#e8cc6a,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{border:0;border-radius:13px;padding:13px 14px;font-family:Tajawal;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97);opacity:.9}
.inp{width:100%;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;padding:14px 15px;font-size:15px;font-family:Tajawal;font-weight:800;outline:0}
.inp:focus{border-color:rgba(212,175,55,.5)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.anim{animation:up .25s both}
.top{position:sticky;top:0;z-index:30;background:rgba(2,5,9,.98);border-bottom:1px solid rgba(212,175,55,.07);padding:11px 14px}
.logo{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#020509;font-size:20px}
.small{font-size:10px;color:var(--mut);font-weight:800}
.money{font-family:Montserrat,sans-serif;font-weight:900}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:200;display:flex;align-items:flex-end;animation:fade .18s}
.panel{width:100%;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#0b1122,#050912);border-radius:22px 22px 0 0;border-top:1px solid rgba(212,175,55,.15);padding:12px 14px 40px;animation:up .22s}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;border-radius:99px;padding:10px 18px;color:#fff;font-weight:900;font-size:13px;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:up .2s}
.fab{position:absolute;left:12px;bottom:80px;width:52px;height:52px;border-radius:16px;border:0;z-index:45;animation:float 3s infinite;box-shadow:0 5px 22px rgba(212,175,55,.35)}
.dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--bg);animation:pulse 1.5s infinite}
.ticker{overflow:hidden;background:rgba(212,175,55,.035);margin:8px -14px -11px;border-top:1px solid rgba(212,175,55,.05)}
.tickerin{display:flex;white-space:nowrap;animation:tick 22s linear infinite;padding:5px 0}
.ticker span{padding:0 12px;font-size:9px;font-weight:800;color:var(--mut)}
.avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid rgba(212,175,55,.8)}
.locked{opacity:.55}
</style>
</head>
<body>
<div id="root"></div>
<script>
const D='د.ج',STORE='BR_FULL_FINAL_APP',USERS='BR_FULL_FINAL_USERS';
const $=s=>document.querySelector(s);
const fmt=n=>{n=+n||0;if(n>=1e6)return(n/1e6).toFixed(2).replace('.',',')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace('.',',')+'K';return n.toLocaleString('fr-DZ',{minimumFractionDigits:2,maximumFractionDigits:2})}
const dzd=n=>fmt(n)+' '+D;
const today=()=>new Date().toDateString();
const save=()=>{localStorage.setItem(STORE,JSON.stringify(S));flashSave();syncUserOnly()}
const load=()=>JSON.parse(localStorage.getItem(STORE)||'null');
const getUsers=()=>JSON.parse(localStorage.getItem(USERS)||'[]');
const setUsers=u=>localStorage.setItem(USERS,JSON.stringify(u));
const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const av=(style,seed)=>`https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(seed)}&backgroundColor=0f172a,1e293b,312e81`;
const AVS=['Ahmed','Amina','Karim','Lina','Yacine','Sofia','Nassim','Rania','Samir','Nour','Zaki','Meriem'].map((s,i)=>av(['avataaars','lorelei','micah','adventurer','notionists'][i%5],s));
const MKT=[['BLK','865,42','▲1,24%','#22C55E'],['د.ج/USD','134,20','▼0,15%','#EF4444'],['GOLD','2.342,8','▲0,82%','#22C55E'],['S&P500','5.248','▲0,45%','#22C55E']];
const LEVELS=[
{id:'trial',n:'Starter',p:0,d:3,dy:43,tot:215,mo:0},
{id:'m1',n:'M1',p:7000,d:5,dy:43,tot:215,mo:6450},
{id:'m2',n:'M2',p:26600,d:10,dy:86,tot:860,mo:25800},
{id:'m3',n:'M3',p:95000,d:25,dy:131,tot:3275,mo:98250},
{id:'m4',n:'M4',p:300000,d:50,dy:222,tot:11100,mo:333000},
{id:'m5',n:'M5',p:780000,d:80,dy:390,tot:31200,mo:936000},
{id:'m6',n:'M6',p:1950000,d:130,dy:652,tot:84760,mo:2542800},
{id:'g7',n:'G7 Platinum',p:4485000,d:200,dy:1068,tot:213600,mo:6408000}
];
const FUNDS=[
{id:1,n:'صندوق الطاقة المتجددة',d:'استثمر في مشاريع الطاقة الشمسية والرياح مع عوائد مضمونة',days:15,rate:6.5,total:97.5,min:1000,sold:72,e:'⚡',c:'#22C55E'},
{id:2,n:'صندوق استثمار الذهب',d:'استثمار آمن في الذهب الخام مع عوائد يومية ثابتة',days:30,rate:4.2,total:126,min:1000,sold:85,e:'🪙',c:'#D4AF37'},
{id:3,n:'صندوق التكنولوجيا',d:'استثمر في شركات التقنية الكبرى مع عوائد عالية',days:10,rate:8,total:80,min:1000,sold:54,e:'💻',c:'#3B82F6'},
{id:4,n:'صندوق العقارات',d:'عقارات فاخرة مع عوائد شهرية مستقرة',days:60,rate:2.8,total:168,min:1000,sold:38,e:'🏢',c:'#A855F7'},
{id:5,n:'صندوق VIP حصري',d:'للمستثمرين المميزين فقط مع أعلى العوائد',days:7,rate:12,total:84,min:1000,sold:91,e:'💎',c:'#F59E0B'}
];
const TASKS=['مراجعة أداء المحفظة','قراءة تقرير السوق اليومي','تحليل اتجاهات BLK','فحص الاستراتيجية اليومية','مشاهدة رسالة استثمارية','تحديث بيانات المحفظة','مراجعة الأرباح والخسائر','تحليل مؤشرات السوق','متابعة أخبار الاستثمار','فحص أداء الأسهم','مراجعة عقد الاستثمار','تحليل عائد المحفظة'];

let S=load()||{lang:'ar',tab:'home',user:null,tasks:null,active:null,cd:40,chat:[],wheel:0,openFund:null};
let timer=null,login=true;

function normalize(u){
 if(!u)return null;
 return {balance:0,taskBal:0,refEarn:0,teamCount:0,wheelSpins:0,m1Refs:0,level:null,totalEarned:0,avatar:null,investments:[],withdrawals:[],upgradeRequests:[],team:[],notifs:[],loginStreak:0,activityLog:[],...u}
}
function syncUserOnly(){
 if(!S.user)return;
 S.user=normalize(S.user);
 let users=getUsers().map(normalize),i=users.findIndex(u=>u.id===S.user.id);
 if(i>=0)users[i]=S.user;else users.push(S.user);
 setUsers(users);
}
function flashSave(){let e=$('#save');if(!e)return;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1000)}
function toast(msg,type='info'){let c={success:'#16A34A',error:'#DC2626',warning:'#D97706',info:'#1E40AF'}[type]||'#1E40AF';let e=document.createElement('div');e.className='toast';e.style.background=c;e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function refCode(){try{return(new URLSearchParams(location.search).get('ref')||'').toUpperCase()}catch{return''}}
function lv(id){return LEVELS.find(x=>x.id===id)||LEVELS[0]}
function lvN(id){return lv(id).n}
function makeTasks(){
 if(!S.user)return[];
 let old=JSON.parse(localStorage.getItem('tasks_'+S.user.id)||'null');
 if(old&&old.date===today())return old.tasks;
 let reward=Math.max(43,Math.round(lv(S.user.level||'trial').dy/5));
 let arr=[...TASKS].sort(()=>Math.random()-.5).slice(0,5).map((n,i)=>({id:i+1,n,sec:40,reward,status:'available'}));
 localStorage.setItem('tasks_'+S.user.id,JSON.stringify({date:today(),tasks:arr}));
 return arr
}
function app(html){$('#root').innerHTML=`<div class="app">${html}</div>`}
function header(title,icon='◇'){return`<div class="top"><div class="row"><div class="row"><div class="logo gold">${icon}</div><div><b style="font-size:16px">${title}</b><div class="small">BLACKROCK INVESTMENT</div></div></div><button onclick="lang()" class="btn" style="width:auto;padding:5px 10px;background:rgba(212,175,55,.08);color:var(--gold);border:1px solid rgba(212,175,55,.18)">${S.lang==='ar'?'English':'عربي'}</button></div></div>`}
function nav(){let b=(S.tasks||[]).filter(t=>t.status==='available').length,u=S.user||{};let tabs=[['home','⌂','الرئيسية',0],['tasks','⚡','المهام',b],['plans','◇','الترقية',0],['acc','♙','حسابي',(u.notifs||[]).filter(n=>!n.r).length]];return`<nav class="nav">${tabs.map(t=>`<button onclick="setTab('${t[0]}')" class="${S.tab===t[0]?'on':''}"><span style="font-size:24px">${t[1]}</span>${t[3]?`<b class="badge">${t[3]}</b>`:''}<span>${t[2]}</span></button>`).join('')}</nav>`}
function render(){if(!S.user)return auth();S.user=normalize(S.user);if(!S.tasks)S.tasks=makeTasks();let p={home,tasks,plans,acc}[S.tab]||home;app(`<div class="scr">${p()}</div>${nav()}${['home','tasks'].includes(S.tab)?`<button class="fab gold" onclick="ai()"><i class="dot"></i>🤖</button>`:''}<div id="save" style="position:fixed;top:12px;right:12px;opacity:0;z-index:999;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.3);color:var(--green);padding:6px 10px;border-radius:99px;font-weight:900;font-size:11px">تم الحفظ</div>`)}
function auth(){let r=refCode();app(`<div style="height:100%;overflow:auto;padding:25px;display:flex;align-items:center;justify-content:center"><div class="anim" style="width:100%;max-width:360px">${r?`<div class="card" style="border-color:rgba(212,175,55,.3);padding:14px;text-align:center;margin-bottom:15px"><b style="color:var(--gold)">🎁 دعوة صديق مفعلة</b><p class="small">سجل لتحصل على دورة عجلة حظ مجانية</p></div>`:''}<div style="text-align:center;margin-bottom:26px"><div class="gold" style="width:78px;height:78px;border-radius:20px;margin:auto;display:flex;align-items:center;justify-content:center;font-size:36px">◇</div><h1 class="gt" style="font-family:Montserrat;font-size:28px;letter-spacing:3px;margin-top:12px">BLACKROCK</h1><p class="small">منصة الاستثمار</p></div><form onsubmit="doAuth(event)" style="display:flex;flex-direction:column;gap:12px"><input id="un" class="inp" placeholder="اسم المستخدم"><div style="position:relative"><input id="pw" class="inp" type="password" placeholder="كلمة المرور"><button type="button" onclick="togglePw()" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut)">👁</button></div><input id="cpw" class="inp" type="password" placeholder="تأكيد كلمة المرور" style="display:none"><button class="btn gold" style="font-size:16px">تسجيل الدخول</button></form><button onclick="mode()" id="mode" style="display:block;margin:14px auto;background:none;border:0;color:var(--mut);font-family:Tajawal;font-weight:800">ليس لديك حساب؟ سجل مجاناً</button><div class="card" style="padding:15px"><b style="color:var(--green)">🛡 Platform Security</b><p class="small" style="line-height:1.8">• عقد رسمي: يناير 2025 → ديسمبر 2027<br>• AES-256 + SSL/TLS 3.0<br>• NYSE: BLK</p></div></div></div>`)}
function mode(){login=!login;$('#cpw').style.display=login?'none':'block';$('.btn.gold').textContent=login?'تسجيل الدخول':'إنشاء حساب';$('#mode').textContent=login?'ليس لديك حساب؟ سجل مجاناً':'لديك حساب؟ سجل الدخول'}
function togglePw(){let p=$('#pw');p.type=p.type==='password'?'text':'password'}
function doAuth(e){e.preventDefault();let un=$('#un').value.trim(),pw=$('#pw').value.trim(),cp=$('#cpw').value.trim(),users=getUsers().map(normalize);if(!un||!pw)return toast('املأ البيانات','error');if(!login&&pw!==cp)return toast('كلمتا المرور مختلفتان','error');if(login){let u=users.find(x=>x.un===un&&x.pw===pw);if(!u)return toast('بيانات خاطئة','error');S.user=normalize(u);S.tasks=makeTasks();dailyLogin();save();render();return}if(users.find(x=>x.un===un))return toast('الاسم موجود','error');let c=code(),r=refCode(),avatar=AVS[Math.floor(Math.random()*AVS.length)];let u=normalize({id:Date.now(),un,pw,code:c,ref:`${location.origin}${location.pathname}?ref=${c}`,wheelSpins:r?1:0,avatar,joined:new Date().toISOString(),joinedVia:r||null,notifs:[{id:1,title:'👋 مرحباً',desc:'ابدأ المهام اليومية للربح',t:'Now',r:false}],loginStreak:1,lastLogin:today(),activityLog:['account created']});let ri=users.findIndex(x=>x.code===r);if(ri>=0){users[ri].teamCount++;users[ri].wheelSpins++;users[ri].team.push({id:u.id,username:un,code:c,avatar,joined:u.joined,active:true});users[ri].notifs.push({id:Date.now(),title:'🎡 صديق جديد',desc:un+' سجل برابطك',t:new Date().toLocaleTimeString(),r:false})}users.push(u);setUsers(users);S.user=u;S.tasks=makeTasks();save();render()}
function dailyLogin(){if(!S.user)return;let td=today();if(S.user.lastLogin!==td){let y=new Date(Date.now()-86400000).toDateString();S.user.loginStreak=S.user.lastLogin===y?(S.user.loginStreak||0)+1:1;let r=Math.min(100,10+S.user.loginStreak*2);S.user.balance+=r;S.user.totalEarned+=r;S.user.lastLogin=td;S.user.activityLog.push('daily login +'+r+' د.ج');toast('🎁 +'+r+' د.ج','success')}}
function setTab(t){S.tab=t;save();render()}
function lang(){S.lang=S.lang==='ar'?'en':'ar';document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';save();render()}
function home(){let u=S.user,l=lv(u.level),done=S.tasks.filter(t=>t.status==='done').length;return`${header('BLACKROCK','◇')}<div class="ticker"><div class="tickerin">${[...MKT,...MKT].map(m=>`<span>${m[0]} <b style="color:var(--gold)">${m[1]}</b> <b style="color:${m[3]}">${m[2]}</b></span>`).join('')}</div></div><section style="padding:12px;display:flex;flex-direction:column;gap:10px"><div class="card" style="padding:16px"><div class="row"><div><p class="small">إجمالي الرصيد</p><h1 class="gt money">${fmt(u.balance)}</h1><b class="small">د.ج</b></div>${u.avatar?`<img class="avatar" style="width:52px;height:52px" src="${u.avatar}">`:`<div class="gold" style="width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#020509;font-weight:900">${u.un[0]}</div>`}</div><div class="grid3" style="margin-top:12px">${[[u.teamCount,'الفريق','#D4AF37'],[done+'/5','المهام','#22C55E'],['+'+l.dy,'اليومي','#3B82F6']].map(x=>`<div style="background:rgba(255,255,255,.03);border-radius:10px;padding:8px;text-align:center"><b class="money" style="color:${x[2]}">${x[0]}</b><p class="small">${x[1]}</p></div>`).join('')}</div></div><div class="grid2"><button class="btn card" onclick="deposit()">💰 شحن</button><button class="btn card" onclick="withdraw()">💳 سحب</button></div><button class="btn" onclick="invest()" style="background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(184,134,11,.06));border:1px solid rgba(212,175,55,.25);color:var(--gold);justify-content:space-between"><span>📈 استثمار BlackRock</span><span>›</span></button><div class="card" style="padding:14px;border-color:rgba(168,85,247,.25)"><div class="row"><b>🏆 مسابقة الإحالة</b><b style="color:var(--purple)">${(u.m1Refs||0)%10}/10</b></div><div style="height:5px;background:rgba(255,255,255,.07);border-radius:4px;margin-top:10px"><div style="height:100%;width:${((u.m1Refs||0)%10)*10}%;background:linear-gradient(90deg,#A855F7,#D4AF37);border-radius:4px"></div></div><p class="small" style="margin-top:6px">10 أصدقاء M1 = ترقية مجانية</p></div><div class="card" style="padding:14px;border-color:rgba(212,175,55,.18)"><h3>🎯 الإحالة الذهبية</h3><p class="small">5% من دخل كل صديق مدى الحياة</p><div class="row" style="background:rgba(255,255,255,.03);border-radius:10px;padding:9px;margin:10px 0;direction:ltr"><small>${u.ref}</small><button onclick="copyRef()" class="btn gold" style="width:auto;padding:6px 12px">نسخ</button></div><button onclick="shareRef()" class="btn gold">مشاركة</button></div><h3>📊 أداء المحفظة</h3><div class="grid2">${[[dzd(u.totalEarned),'إجمالي الأرباح','#22C55E'],[dzd(u.refEarn),'أرباح الإحالات','#D4AF37'],['+'+done*l.dy+' د.ج','أرباح اليوم','#3B82F6'],[l.mo?dzd(l.mo):'—','شهري','#D4AF37']].map(x=>`<div class="card" style="padding:12px"><b style="color:${x[2]}">${x[0]}</b><p class="small">${x[1]}</p></div>`).join('')}</div><button class="btn card" onclick="company()">🏢 الشركة والأمان ›</button></section>`}
function tasks(){let has=!!S.user.level,list=has?S.tasks:S.tasks.slice(0,3);return`${header('المهام اليومية','⚡')}<section style="padding:12px;display:flex;flex-direction:column;gap:10px">${!has?`<div class="card" style="padding:15px;text-align:center;border-color:rgba(212,175,55,.25)"><h3>🔒 المهام مقفلة</h3><p class="small">فعّل التجربة المجانية أو أي مستوى لتشغيل المهام.</p><button onclick="setTab('plans')" class="btn gold" style="margin-top:10px">تفعيل التجربة المجانية</button></div>`:''}${list.map(t=>taskCard(t,has)).join('')}${!has?`<div class="card" style="padding:14px;text-align:center"><p class="small">هذه معاينة فقط. بعد التفعيل ستظهر كل المهام.</p></div>`:''}</section>`}

function closeModal(){let m=$('#modal');if(m)m.remove()}
function ai(){modal(`<div id="msgs" style="max-height:60vh;overflow:auto">${(S.chat||[]).map(m=>`<div style="margin:8px 0;text-align:${m.r==='user'?'left':'right'}"><span class="card" style="display:inline-block;padding:12px;max-width:86%;white-space:pre-wrap">${m.text}</span></div>`).join('')||'<div class="card" style="padding:12px">أهلاً! أنا مساعد BlackRock الذكي. اسألني عن الربح، المهام، السحب، الشحن، الشركة.</div>'}</div><div style="display:flex;gap:6px;margin-top:10px"><input id="aii" class="inp" placeholder="اكتب سؤالك..."><button onclick="sendAI()" class="btn gold" style="width:52px">➤</button></div>`,'AI ASSISTANT')}
function sendAI(){let v=$('#aii').value.trim();if(!v)return;S.chat=[...(S.chat||[]),{r:'user',text:v},{r:'ai',text:aiResp(v)}];save();closeModal();ai()}
function aiResp(v){v=v.toLowerCase();if(v.includes('سحب'))return'السحب عبر CCP فقط، المعالجة من 48 إلى 72 ساعة، الحد الأدنى 215 د.ج.';if(v.includes('شحن'))return'الشحن يكون بالتواصل مع طاقم الشركة عبر واتساب أو تلقرام. لا يوجد دفع مباشر داخل التطبيق.';if(v.includes('استثمار'))return'افتح استثمار BlackRock واختر صندوقاً، الحد الأدنى 1000 د.ج ويمكنك وضع كل رصيدك.';if(v.includes('شركة'))return'BlackRock شركة عالمية، تأسست سنة 1988، مدرجة في NYSE: BLK.';return'جرب: كيف أربح؟ المهام، الاستثمار، السحب، الشحن، الشركة.'}
document.documentElement.lang='ar';document.documentElement.dir='rtl';S.user=normalize(S.user);render();
</script>
</body>
</html>
