window.doInvest=function(fid){

closeInvest();render()}

if(!window._isLogin&&pw!==cp){toast(LG.l==='ar'?'كلمتا المرور مختلفتان':'Passwords don\'t match','error');return}
var users=DB.g('users',[]);
if(window._isLogin){
var f=null;for(var i=0;i<users.length;i++)if(users[i].un===un&&users[i].pw===pw){f=users[i];break}
if(f){DB.s('cur',f);S.user=f;S.tasks=getDailyTasks(f.level||'trial',f.id);toast('👋 '+un,'success');render()}
else toast(LG.l==='ar'?'بيانات خاطئة':'Wrong credentials','error')}
else{
for(var j=0;j<users.length;j++)if(users[j].un===un){toast(LG.l==='ar'?'الاسم موجود':'Username taken','error');return}
var nu={id:Date.now(),un:un,pw:pw,code:genCode(),balance:0,taskBal:0,refEarn:0,teamCount:0,wheelSpins:0,m1Refs:0,level:null,totalEarned:0,joined:new Date().toISOString(),investments:[],expectedIncome:0};
users.push(nu);DB.s('users',users);DB.s('cur',nu);S.user=nu;S.tasks=getDailyTasks('trial',nu.id);
toast('🎉 '+(LG.l==='ar'?'مرحباً!':'Welcome!'),'success');render()}}

function render(){
var app=gId('app');if(!app)return;
if(!S.user){renderAuth();return}
var c='';
if(S.tab==='home')c=buildHome();
else if(S.tab==='tasks')c=buildTasks();
else if(S.tab==='funds')c=buildFunds();
else if(S.tab==='up')c=buildUpgrade();
else if(S.tab==='profile')c=buildProfile();
app.innerHTML='<div class="scr">'+c+'</div>'+buildNav()}
